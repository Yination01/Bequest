<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bequest Admin Console</title>
<style>
:root{--bg:#080c16;--panel:#0f1727;--line:#23324a;--ink:#dfe7f5;--dim:#8fa0b8;
  --gold:#e0a33c;--g:#4ec08a;--r:#e0565b;--a:#d8a23a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button{font:inherit;cursor:pointer}
.lock{max-width:420px;margin:14vh auto;padding:0 20px;text-align:center}
.logo{font-size:26px;font-weight:700;letter-spacing:.5px;margin-bottom:4px}
.logo i{color:var(--gold);font-style:normal}
.muted{color:var(--dim)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:18px}
input,select,textarea{background:#0b1220;border:1px solid var(--line);color:var(--ink);
  border-radius:9px;padding:9px 11px;font:inherit;width:100%}
textarea{min-height:76px;resize:vertical}
.btn{background:var(--gold);color:#1a1205;border:0;border-radius:9px;padding:9px 14px;font-weight:650}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:var(--r);color:#fff}
.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:#0b1220;border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column}
.brand{padding:6px 8px 16px}
.b1{font-weight:700}.b2{color:var(--gold);font-weight:700}
.brand .sub{color:var(--dim);font-size:12px;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav button{background:transparent;border:0;color:var(--dim);text-align:left;
  padding:9px 10px;border-radius:9px;font-size:14px}
.nav button.on{background:var(--panel);color:var(--ink);font-weight:600}
.nav button span{display:block;font-size:11px;opacity:.6;font-weight:400}
.me{border-top:1px solid var(--line);padding-top:10px;font-size:12px;color:var(--dim)}
.me button{background:transparent;border:1px solid var(--line);color:var(--ink);
  border-radius:8px;padding:5px 9px;margin-top:8px;font-size:12px;width:100%}
.main{padding:22px 26px;overflow:auto}
h1{font-size:22px;margin:0 0 2px}
.crumb{color:var(--dim);font-size:12px;margin-bottom:18px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.card .k{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
.card .v{font-size:24px;font-weight:700;margin:4px 0 2px}
.card .s{color:var(--dim);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;
  letter-spacing:.5px;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:top}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;
  border:1px solid var(--line)}
.pill.g{background:rgba(78,192,138,.12);color:var(--g);border-color:rgba(78,192,138,.4)}
.pill.r{background:rgba(224,86,91,.12);color:var(--r);border-color:rgba(224,86,91,.4)}
.pill.a{background:rgba(216,162,58,.12);color:var(--a);border-color:rgba(216,162,58,.4)}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:12px}
.row>*{flex:0 0 auto}
.grow{flex:1 1 180px}
.warn{background:rgba(224,86,91,.09);border:1px solid rgba(224,86,91,.35);
  border-radius:10px;padding:11px 13px;color:#f0b8ba;font-size:13px;margin-bottom:16px}
.note{background:rgba(216,162,58,.08);border:1px solid rgba(216,162,58,.3);
  border-radius:10px;padding:11px 13px;color:#e8cf9c;font-size:13px;margin-bottom:16px}
pre{background:#0b1220;border:1px solid var(--line);border-radius:10px;padding:11px;
  font:11px/1.45 ui-monospace,Menlo,monospace;color:#9fb0c9;overflow:auto;max-height:340px;
  white-space:pre-wrap;word-break:break-word}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-size:13px;
  opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
code{background:#0b1220;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:12px}
@media(max-width:760px){.layout{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<div id="app">Loading…</div>
<div class="toast" id="toast"></div>
<script src="admin.js"></script>
</body>
</html>
