<script>
/* BEQUEST — sound and haptics.

   Every cue is synthesised at play time with the Web Audio API. There are no
   audio files, deliberately: the game ships as one self-contained offline
   document, and a library of samples would have cost more bytes than the
   whole rest of the game put together. A cue is a short list of notes over a
   shaped envelope, which is also why any of them can be retuned by editing
   two numbers rather than opening an audio editor.

   The cues share a key — A minor pentatonic — so that a promotion, an
   achievement and a year turning sound like they belong to the same game
   rather than to three different asset packs.

   Nothing in here throws when there is no Web Audio, no audio device, or no
   window at all. The test suite runs in exactly that environment.          */

const NOTE = { A2:110.00, C3:130.81, D3:146.83, E3:164.81, G3:196.00,
               A3:220.00, C4:261.63, D4:293.66, E4:329.63, G4:392.00,
               A4:440.00, C5:523.25, D5:587.33, E5:659.25, G5:784.00,
               A5:880.00, C6:1046.50, E6:1318.51, G6:1567.98 };

/* n: [note, startOffset, length, gain, glideToNote?]  — times in seconds. */
const SFX = {
  /* the quiet furniture of the interface */
  tap:     { w:'triangle', g:0.055, n:[[NOTE.E5, 0,    0.035, 1]] },
  open:    { w:'sine',     g:0.075, n:[[NOTE.A4, 0,    0.07,  1], [NOTE.E5, 0.035, 0.09, 0.7]] },
  back:    { w:'sine',     g:0.065, n:[[NOTE.E5, 0,    0.07,  1], [NOTE.A4, 0.035, 0.09, 0.7]] },
  denied:  { w:'square',   g:0.070, n:[[NOTE.D3, 0,    0.10,  1], [NOTE.C3, 0.055, 0.13, 0.9]], noise:[0, 0.05, 0.25, 260] },

  /* the year, which is the game's heartbeat */
  year:    { w:'sine',     g:0.130, n:[[NOTE.A2, 0,    0.70,  1], [NOTE.E3, 0.02, 0.55, 0.55], [NOTE.A3, 0.06, 0.40, 0.30]] },
  event:   { w:'sine',     g:0.100, n:[[NOTE.C5, 0,    0.13,  1], [NOTE.G5, 0.075, 0.20, 0.6]] },

  /* outcomes */
  good:    { w:'triangle', g:0.105, n:[[NOTE.A4, 0,    0.10,  1], [NOTE.C5, 0.065, 0.10, 1], [NOTE.E5, 0.13, 0.22, 0.9]] },
  bad:     { w:'triangle', g:0.105, n:[[NOTE.E4, 0,    0.14,  1], [NOTE.C4, 0.08,  0.28, 0.9, NOTE.A3]] },
  moneyIn: { w:'triangle', g:0.085, n:[[NOTE.G5, 0,    0.06,  1], [NOTE.C6, 0.05,  0.14, 0.8]] },
  moneyOut:{ w:'triangle', g:0.080, n:[[NOTE.E4, 0,    0.07,  1], [NOTE.A3, 0.05,  0.16, 0.8]] },

  /* the moments worth looking up for */
  promote: { w:'triangle', g:0.115, n:[[NOTE.A4, 0,    0.09,  1], [NOTE.C5, 0.07, 0.09, 1],
                                       [NOTE.E5, 0.14, 0.09,  1], [NOTE.A5, 0.21, 0.34, 0.95]] },
  ach:     { w:'triangle', g:0.125, n:[[NOTE.C5, 0,    0.10,  1], [NOTE.E5, 0.08, 0.10, 1],
                                       [NOTE.G5, 0.16, 0.10,  1], [NOTE.C6, 0.24, 0.46, 0.95]] },
  egg:     { w:'sine',     g:0.090, n:[[NOTE.E6, 0,    0.05,  1], [NOTE.G6, 0.045, 0.05, 0.9],
                                       [NOTE.C6, 0.09, 0.05,  0.8], [NOTE.G6, 0.135, 0.28, 0.7]] },

  /* the end of it */
  death:   { w:'sine',     g:0.150, n:[[NOTE.A2, 0,    1.70,  1], [NOTE.E3, 0.35, 1.30, 0.42],
                                       [NOTE.C3, 0.80, 1.00,  0.30]] },
  born:    { w:'sine',     g:0.110, n:[[NOTE.A3, 0,    0.30,  1], [NOTE.E4, 0.16, 0.30, 0.7],
                                       [NOTE.A4, 0.32, 0.55,  0.6]] }
};

/* ---- settings ---- */
function soundCfg(){
  META.sfx = META.sfx || {};
  if(META.sfx.on == null) META.sfx.on = true;
  if(META.sfx.haptics == null) META.sfx.haptics = true;
  if(META.sfx.vol == null) META.sfx.vol = 0.7;
  return META.sfx;
}
function soundOn(){ return !!soundCfg().on; }
function hapticsOn(){ return !!soundCfg().haptics; }
function setSound(on){
  soundCfg().on = !!on; saveMeta();
  if(on){ audioResume(); sfx('open'); }
  if(typeof document!=='undefined'&&document.querySelector){
    const row=document.querySelector('[data-switch-id="sound"]');
    if(row){
      row.dataset.switch = on ? 'on' : 'off';
      row.setAttribute('aria-checked', on ? 'true' : 'false');
      const sub=row.querySelector('.hsub');
      if(sub) sub.textContent = on ? 'On · years, events and outcomes' : 'Off · silent';
      const icon=row.querySelector('.switch-icon');
      if(icon) icon.textContent = on ? '✓' : '○';
    }
  }
}
function setHaptics(on){
  soundCfg().haptics = !!on; saveMeta();
  if(on) haptic('light');
  if(typeof document!=='undefined'&&document.querySelector){
    const row=document.querySelector('[data-switch-id="haptics"]');
    if(row){
      row.dataset.switch = on ? 'on' : 'off';
      row.setAttribute('aria-checked', on ? 'true' : 'false');
      const sub=row.querySelector('.hsub');
      if(sub) sub.textContent = on ? 'On' : 'Off';
      const icon=row.querySelector('.switch-icon');
      if(icon) icon.textContent = on ? '✓' : '○';
    }
  }
}
function previewChime(vol){
  const ac = audioResume();
  if(!ac || !soundOn()) return;
  try{
    const t0 = ac.currentTime + 0.005;
    tone(t0, NOTE.C5, 0.07, 0.12, 'triangle');
    tone(t0 + 0.05, NOTE.E5, 0.07, 0.12, 'triangle');
    tone(t0 + 0.10, NOTE.G5, 0.12, 0.14, 'triangle');
  }catch(e){}
}
function setVolume(v){
  soundCfg().vol = Math.max(0, Math.min(1, v)); saveMeta();
  const ac = audioResume();
  const gainVal = Math.pow(soundCfg().vol, 2);
  if(MASTER && ac) MASTER.gain.setTargetAtTime(gainVal, ac.currentTime, 0.01);
  previewChime(soundCfg().vol);
  if(typeof document!=='undefined'&&document.querySelectorAll){
    document.querySelectorAll('.vol-btn').forEach(b=>{
      const cur = parseFloat(b.dataset.vol);
      b.classList.toggle('on', Math.abs(cur - soundCfg().vol) < 0.04);
    });
  }
}

/* ---- engine ---- */
let AC = null, MASTER = null, AUDIO_DEAD = false;
function audioCtx(){
  if(AC || AUDIO_DEAD) return AC;
  const W = (typeof window !== 'undefined') ? window : null;
  const Ctor = W && (W.AudioContext || W.webkitAudioContext);
  if(!Ctor){ AUDIO_DEAD = true; return null; }
  try{
    AC = new Ctor();
    MASTER = AC.createGain();
    MASTER.gain.value = soundCfg().vol;
    MASTER.connect(AC.destination);
  }catch(e){ AUDIO_DEAD = true; AC = null; }
  return AC;
}
/* Browsers will not start audio until the player has touched something, so
   the context is created and unlocked on the first gesture and never again. */
function audioResume(){
  const ac = audioCtx();
  if(ac && ac.state === 'suspended'){ try{ ac.resume(); }catch(e){} }
  return ac;
}
function tone(t0, hz, len, gain, wave, glide){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = wave || 'sine';
  o.frequency.setValueAtTime(hz, t0);
  if(glide) o.frequency.exponentialRampToValueAtTime(glide, t0 + len);
  const peak = Math.max(0.0001, gain);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(peak, t0 + Math.min(0.012, len * 0.3));   // attack
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + len);                   // decay
  o.connect(g); g.connect(MASTER);
  o.start(t0); o.stop(t0 + len + 0.03);
}
function noiseBurst(t0, at, len, gain, hz){
  const n = Math.max(1, Math.floor(AC.sampleRate * len));
  const buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for(let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = AC.createBufferSource(); src.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = hz || 600; f.Q.value = 1.2;
  const g = AC.createGain(); g.gain.value = gain;
  src.connect(f); f.connect(g); g.connect(MASTER);
  src.start(t0 + at);
}
/* The one entry point. Safe to call anywhere, at any time, on any device. */
function sfx(id){
  if(!soundOn()) return false;
  const cue = SFX[id];
  if(!cue) return false;
  const ac = audioResume();
  if(!ac || ac.state !== 'running') return false;
  try{
    const t0 = ac.currentTime + 0.001;
    cue.n.forEach(([hz, at, len, vol, glide]) => tone(t0 + at, hz, len, cue.g * (vol == null ? 1 : vol), cue.w, glide));
    if(cue.noise) noiseBurst(t0, cue.noise[0], cue.noise[1], cue.g * cue.noise[2], cue.noise[3]);
  }catch(e){ return false; }
  return true;
}

/* ---- haptics ----
   Capacitor's plugin on a real device, the vibration API in a browser, and
   silence anywhere else. */
const HAPTIC = { light:12, medium:22, heavy:38, year:[0, 14, 40, 22], death:[0, 60, 90, 120], denied:[0, 18, 45, 18] };
function haptic(kind){
  if(!hapticsOn()) return false;
  const pattern = HAPTIC[kind];
  if(pattern == null) return false;
  const W = (typeof window !== 'undefined') ? window : null;
  const cap = W && W.Capacitor && W.Capacitor.Plugins && W.Capacitor.Plugins.Haptics;
  try{
    if(cap){
      if(Array.isArray(pattern)) cap.vibrate({ duration: pattern.reduce((a, b) => a + b, 0) });
      else cap.impact({ style: kind === 'heavy' ? 'HEAVY' : kind === 'medium' ? 'MEDIUM' : 'LIGHT' });
      return true;
    }
    const nav = (typeof navigator !== 'undefined') ? navigator : null;
    if(nav && nav.vibrate){ nav.vibrate(pattern); return true; }
  }catch(e){}
  return false;
}
/* Both at once, which is what almost every call site actually wants. */
function cue(id, h){ const a = sfx(id); const b = haptic(h || 'light'); return a || b; }

/* ---- the interface's own voice ----
   One quiet tick on any button that does not already make a noise of its
   own, bound once at the document level so nothing else has to think
   about it. */
const TAP_MOVE = 10;
function bindTapSounds(){
  const D = (typeof document !== 'undefined') ? document : null;
  if(!D || !D.addEventListener) return;
  let gesture = null;
  D.addEventListener('pointerdown', e => {
    audioResume();                                   // unlocks audio on gesture one
    const el = e.target && e.target.closest && e.target.closest('button,.row,.choice');
    gesture = el && !el.dataset.noSfx ? { el, x:e.clientX, y:e.clientY, moved:false } : null;
  }, { passive: true });
  D.addEventListener('pointermove', e => {
    if(gesture && (Math.abs(e.clientX-gesture.x)>TAP_MOVE || Math.abs(e.clientY-gesture.y)>TAP_MOVE))
      gesture.moved = true;
  }, { passive: true });
  D.addEventListener('pointercancel', () => { gesture=null; }, { passive:true });
  D.addEventListener('pointerup', e => {
    const g=gesture; gesture=null;
    if(!g || g.moved || !(g.el===e.target || (g.el.contains&&g.el.contains(e.target)))) return;
    sfx('tap'); haptic('light');
  }, { passive: true });
}

</script>
<script>
/* BEQUEST — the obituary.

   The death screen used to be thirteen numbers in a grid, which is a strange
   way to end a game about a life. This turns the same save into prose: what
   the life was, who is left holding it, and what they were left.

   Everything here is derived at the moment of death and nothing is stored,
   so an obituary can be written for a save made before this file existed.
   Every section degrades: a character who died at four has no working life
   and no estate, and the text simply does not mention them.                */

const EULOGY_NUM = ['no','one','two','three','four','five','six','seven','eight',
                    'nine','ten','eleven','twelve'];
function eNum(n){ return (n >= 0 && n <= 12) ? EULOGY_NUM[n] : String(n); }
function eList(items){
  items = items.filter(Boolean);
  if(!items.length) return '';
  if(items.length === 1) return items[0];
  if(items.length === 2) return items[0] + ' and ' + items[1];
  return items.slice(0, -1).join(', ') + ' and ' + items[items.length - 1];
}
function first(n){ return String(n && n.name ? n.name : '').split(' ')[0]; }
/* The name pool can hand a sibling the dead person's own first name, and
   "He and Miles had not spoken in years" then reads as one man not speaking
   to himself. Fall back to the relation wherever the name stands alone. */
function eName(s, n){
  const f = first(n);
  if(!f || f.toLowerCase() !== first(s).toLowerCase()) return f;
  const p = ePron(s);
  return `${p.their} ${eKin(n)}`;
}
function eKin(n){
  return n.rel === 'child'   ? (n.gender === 'f' ? 'daughter' : 'son')
       : n.rel === 'sibling' ? (n.gender === 'f' ? 'sister'   : 'brother')
       : n.rel === 'spouse'  ? (n.gender === 'f' ? 'wife'     : 'husband')
       : n.rel;
}
/* Stable variation: keyed off the seed so re-rendering the screen never
   rewrites what was said, and salted so two sentences in one obituary do not
   move together. */
function ePickFrom(s, arr, salt){
  const k = ((s.seed >>> 0) + (salt || 0) * 2654435761) >>> 0;
  return arr[k % arr.length];
}
function ePron(s){
  return s.gender === 'f'
    ? { they:'she', them:'her', their:'her', cap:'She' }
    : { they:'he',  them:'him', their:'his', cap:'He'  };
}
function eSentence(parts){
  const t = parts.filter(Boolean).join(' ').replace(/\s+/g,' ').replace(/\s+([,.;])/g,'$1').trim();
  if(!t) return '';
  return t.charAt(0).toUpperCase() + t.slice(1) + (/[.!?]$/.test(t) ? '' : '.');
}

/* ---- where a life started ---- */
const EULOGY_BORN = [
  ['into a family that had nothing', 'into poverty and no prospect of leaving it', 'into a family with nothing behind it at all'],
  ['into a family that worked for everything it had', 'into a household that got by on work', 'to parents who never stopped working'],
  ['into a family that had just enough', 'into the comfortable middle of things', 'to a family that was neither struggling nor secure'],
  ['into comfortable circumstances', 'into a family with something put by', 'into the kind of comfort that is easy to mistake for normal'],
  ['into money', 'into a family that had never had to think about it', 'into real money']
];

function eulogyOpening(s){
  const p = ePron(s);
  const where = s.city ? `in ${s.city}` : '';
  const born = ePickFrom(s, EULOGY_BORN[s.birthTier] || EULOGY_BORN[2], 1);
  const out = [];
  out.push(eSentence([`${s.name} was born`, where, born + '.']));

  /* A child's obituary is a different document, and should not go on to
     discuss their career. */
  if(s.age < 16){
    const sibs = (s.npcs || []).filter(n => n.rel === 'sibling').length;
    out.push(eSentence([
      p.cap, `died at ${eNum(s.age)}`,
      s.cause ? `of ${s.cause}` : '',
      sibs ? `, one of ${eNum(sibs + 1)} children` : ''
    ]));
    return out;
  }

  /* schooling */
  const deg = (typeof DEGREE === 'function' && s.degreeDone) ? DEGREE(s.degreeDone) : null;
  const uni = (typeof UNI_TIERS !== 'undefined' && s.uniTier)
    ? (UNI_TIERS.find(t => t.id === s.uniTier) || null) : null;
  const subject = deg ? deg.n.toLowerCase() : null;
  const SCHOOL = [
    [`${p.they} left school with nothing to show for it`,
     `${p.they} left school early and did not go back`,
     `School did not take, and ${p.they} left it behind`],
    [`${p.they} finished school and went no further`,
     `${p.they} took ${p.their} certificate and stopped there`,
     `${p.they} left at eighteen with a diploma and no plan`],
    [`${p.they} trained in a trade`,
     `${p.they} learned a trade instead`,
     `${p.they} took a trade certificate and made it pay`],
    [`${p.they} read ${subject || 'for a degree'}${uni ? ` at ${uni.n.toLowerCase()}` : ''}`,
     `${p.they} went to university${subject ? ` for ${subject}` : ''}`,
     `${subject ? `A degree in ${subject} followed` : 'A degree followed'}${uni ? `, taken at ${uni.n.toLowerCase()}` : ''}`],
    [`${p.they} studied ${subject || 'on'} to postgraduate level`,
     `${p.they} kept studying long after most people stop`,
     `${p.they} went all the way through to postgraduate work`]
  ];
  const school = ePickFrom(s, SCHOOL[Math.max(0, Math.min(4, s.edu || 0))], 2);
  /* only qualifications you had to pass can be passed well */
  const gpa = s.gpa == null ? 50 : s.gpa;
  const howWell = s.edu >= 2 ? (gpa >= 82 ? ', and was good at it' : gpa < 38 ? ', barely' : '') : '';
  out.push(eSentence([school + howWell]));
  return out;
}

/* ---- what they did with the middle of it ---- */
function eulogyWork(s){
  const p = ePron(s);
  const out = [];
  const career = s.career || [];
  if(s.age < 16) return out;

  if(!career.length && !s.jobsHeld){
    out.push(eSentence([p.cap, 'never held a job']));
  } else if(career.length){
    /* the job held longest is the one a life is remembered by */
    const spans = career.map((j, i) => ({
      t: j.t,
      years: (i + 1 < career.length ? career[i + 1].from : s.age) - j.from
    }));
    const longest = spans.slice().sort((a, b) => b.years - a.years)[0];
    const last = career[career.length - 1];
    const roles = new Set(career.map(j => j.t));
    let line;
    if(longest.years >= 10)
      line = `${p.they} spent ${eNum(longest.years)} years as ${eArticle(longest.t)}`;
    else if(roles.size >= 5)
      line = `${p.they} moved through ${eNum(roles.size)} jobs and settled at none of them`;
    else
      line = `${p.they} worked as ${eArticle(longest.t)}`;
    if(last.t !== longest.t && longest.years >= 10)
      line += `, and finished as ${eArticle(last.t)}`;
    out.push(eSentence([line]));
    if(s.peakIncome > 0 && s.counters && s.counters.promotions >= 3)
      out.push(eSentence([p.cap, `was promoted ${eNum(s.counters.promotions)} times`]));
  } else if(s.jobsHeld){
    out.push(eSentence([p.cap, `held ${eNum(s.jobsHeld)} job${s.jobsHeld > 1 ? 's' : ''}`]));
  }

  if((s.countriesLived || []).length > 1)
    out.push(eSentence([p.cap, `lived in ${eNum(s.countriesLived.length)} countries`]));

  if(s.track && typeof TRACK === 'function'){
    const d = TRACK(s.track.id), r = (typeof TRACK_RANK === 'function') ? TRACK_RANK(s.track) : null;
    if(d) out.push(eSentence([`Away from all that, ${p.they} rose to ${r ? r.n.toLowerCase() : 'some standing'} in ${d.n.toLowerCase()}`]));
  }
  if(s.yearsJailed > 0)
    out.push(eSentence([p.cap, `served ${eNum(s.yearsJailed)} year${s.yearsJailed > 1 ? 's' : ''} in prison`]));
  else if(s.crimesCommitted >= 5)
    out.push(eSentence([p.cap, 'broke the law more often than anyone knew, and was never caught']));

  if(s.donated >= 50000)
    out.push(eSentence([p.cap, `gave ${money(s.donated)} of it away`]));
  return out;
}

function eArticle(t){
  return (/^[aeiou]/i.test(t) ? 'an ' : 'a ') + t.toLowerCase();
}

/* ---- the people ----
   An obituary names family. It does not list six estranged acquaintances,
   and it does not repeat the same parenthetical after every name, so at most
   one relationship gets a clause of its own and it is the one worth saying. */
const EULOGY_REL = { spouse:0, partner:1, child:2, sibling:3, mother:4, father:5, friend:6 };
function eulogyLabel(s, n, withPossessive){
  const p = ePron(s);
  return (withPossessive === false ? '' : p.their + ' ') + eKin(n) + ' ' + n.name.split(' ')[0];
}
function eulogyPeople(s){
  const p = ePron(s);
  const npcs = s.npcs || [];
  const rank = n => (EULOGY_REL[n.rel] == null ? 9 : EULOGY_REL[n.rel]);
  const first = n => n.name.split(' ')[0];

  const family = npcs.filter(n => n.alive && EULOGY_REL[n.rel] != null && n.rel !== 'friend')
                     .sort((a, b) => rank(a) - rank(b) || b.r - a.r);
  /* friends only earn a mention if they were genuinely close, or if there
     is no family left at all to name */
  let friends = npcs.filter(n => n.alive && n.rel === 'friend' && n.r >= 72)
                    .sort((a, b) => b.r - a.r).slice(0, 2);
  if(!family.length && !friends.length)
    friends = npcs.filter(n => n.alive && n.rel === 'friend').sort((a, b) => b.r - a.r).slice(0, 1);

  const named = family.slice(0, 5).concat(friends);
  const out = {};

  if(named.length){
    /* do not print the same first name twice, which the name pool allows */
    const seen = {};
    const phrased = named.filter(n => { const k = first(n) + n.rel; if(seen[k]) return false; seen[k] = 1; return true; })
                         .map(n => eulogyLabel(s, n));
    out.survived = eSentence([`${first(s)} is survived by ${eList(phrased)}`]);
  } else {
    out.survived = eSentence([`${p.cap} left no one behind`]);
  }

  /* one relationship, said properly, instead of a clause after every name */
  const notes = [];
  const closest = named.filter(n => n.r >= 85).sort((a, b) => b.r - a.r)[0];
  const distant = named.filter(n => n.r < 28).sort((a, b) => a.r - b.r)[0];
  if(closest) notes.push(eSentence([`${eName(s, closest).replace(/^\\w/, c => c.toUpperCase())} was with ${p.them} at the end`]));
  else if(distant) notes.push(eSentence([`${p.cap} and ${eName(s, distant)} had not spoken in years`]));

  /* being outlived by your parents is ordinary; outliving a spouse or a
     child is the thing an obituary actually records */
  const lostSpouse = npcs.filter(n => !n.alive && (n.rel === 'spouse' || n.rel === 'partner'));
  const lostKids   = npcs.filter(n => !n.alive && n.rel === 'child');
  if(lostKids.length)
    notes.push(eSentence([`${p.cap} buried ${lostKids.length === 1 ? eulogyLabel(s, lostKids[0]) : eNum(lostKids.length) + ' of ' + p.their + ' children'}`]));
  if(lostSpouse.length)
    notes.push(eSentence([`${eulogyLabel(s, lostSpouse[0]).replace(/^\w/, c => c.toUpperCase())} died before ${p.them}`]));
  if(s.age < 40){
    const par = npcs.filter(n => n.alive && (n.rel === 'mother' || n.rel === 'father'));
    if(par.length) notes.push(eSentence([`${p.their.replace(/^\w/, c => c.toUpperCase())} ${par.length > 1 ? 'parents' : par[0].rel} buried ${p.them}`]));
  }

  if(s.marriedYears >= 40) notes.push(eSentence([`The marriage lasted ${eNum(s.marriedYears)} years`]));
  else if(s.counters && s.counters.divorces > 0)
    notes.push(eSentence([`${p.cap} divorced ${eNum(s.counters.divorces)} time${s.counters.divorces > 1 ? 's' : ''}`]));
  /* trust the people, not the counter: anything that adds a child without
     bumping childrenCount would otherwise print a flat lie */
  const kidCount = Math.max(s.childrenCount || 0, npcs.filter(n => n.rel === 'child').length);
  if(kidCount === 0 && s.age >= 45)
    notes.push(eSentence([`${p.cap} had no children`]));
  else if(kidCount >= 3)
    notes.push(eSentence([`${p.cap} raised ${eNum(kidCount)}`]));

  out.notes = notes.slice(0, 3);
  return out;
}

/* ---- what was left ---- */
/* When the estate has actually been settled we say what happened, not what
   probably happened. Falls back to the guess when there is no settlement. */
function eulogyEstateFrom(s, worth, st){
  const p = ePron(s);
  const out = [];
  if(s.age < 16) return out;
  const nm = a => String(a.name || '').split(' ')[0];

  if(worth <= -1000){
    out.push(eSentence([p.cap, `died owing ${money(-worth)}`]));
    if((st.allocations || []).length || (s.npcs || []).some(n => n.alive && n.rel === 'child'))
      out.push(eSentence(['A debt is the one thing that does not pass on']));
    return out;
  }
  if(worth < 1000){
    out.push(eSentence([p.cap, 'left nothing to speak of']));
    return out;
  }

  const props = (s.properties || []).length, biz = (s.businesses || []).length;
  const things = [];
  if(props) things.push(`${eNum(props)} propert${props > 1 ? 'ies' : 'y'}`);
  if(biz)   things.push(`${eNum(biz)} business${biz > 1 ? 'es' : ''}`);
  out.push(eSentence([`The estate came to ${money(worth)}`
    + (things.length ? `, including ${eList(things)}` : '')]));

  const got = (st.allocations || []).filter(a => a.cash > 0 || a.assets.length || a.heirloom);

  if(st.intestate){
    if(!got.length) out.push(eSentence(['There was no will, and no one to claim it']));
    else out.push(eSentence([`There was no will. It was sold off and split between ${eList(got.map(nm))}`]));
  } else {
    /* the specific things first: those are the sentences worth reading */
    const inKind = [];
    (st.allocations || []).forEach(a => {
      a.assets.forEach(x => inKind.push({ thing: x.name.toLowerCase(), who: nm(a) }));
    });
    if(inKind.length){
      /* the verb goes in once, on the first item: "the house went to Margot
         and the cafe to Tom" */
      const parts = inKind.slice(0, 3).map((x, i) =>
        i === 0 ? `${x.thing} went to ${x.who}` : `${x.thing} to ${x.who}`);
      out.push(eSentence([eList(parts).replace(/^\w/, c => c.toUpperCase())]));
    }
    const cashers = got.filter(a => a.cash > 0);
    if(cashers.length > 1)
      out.push(eSentence([`${inKind.length ? 'The rest was' : 'It was'} split between ${eList(cashers.map(nm))}`]));
    else if(cashers.length === 1)
      out.push(eSentence([`${inKind.length ? 'The rest went' : 'It went'} to ${nm(cashers[0])}`]));
    else if(!inKind.length)
      out.push(eSentence(['There was no one to leave it to']));
  }

  if((st.contested || []).length)
    out.push(eSentence([`${eList(st.contested.map(nm))} went to court over it`
      + (st.legal > 0 ? `, and the lawyers took ${money(st.legal)}` : '')]));

  if(s.heirloom){
    const g = (s.heirloom.gens || []).length;
    if(st.heirloomLost)
      out.push(eSentence([`${s.heirloom.name.replace(/^\w/, c => c.toUpperCase())} that had been kept for ${eNum(g)} generations was sold with the rest`]));
    else {
      const to = (st.allocations || []).find(a => a.heirloom);
      if(to) out.push(eSentence([`${s.heirloom.name.replace(/^\w/, c => c.toUpperCase())} went to ${nm(to)}, who is the ${eOrd(g + 1)} to have it`]));
    }
  }

  if(s.peakNet > worth * 3 && s.peakNet > 100000)
    out.push(eSentence([`${p.cap} had been worth ${money(s.peakNet)} once`]));
  return out;
}
function eOrd(n){
  const w = ['', 'first', 'second', 'third', 'fourth', 'fifth', 'sixth', 'seventh', 'eighth', 'ninth', 'tenth'];
  return w[n] || (n + 'th');
}

function eulogyEstate(s, worth){
  worth = Number(worth);
  if(!isFinite(worth)) worth = 0;   /* never print "$NaN" on this screen */
  const p = ePron(s);
  const props = (s.properties || []).length, biz = (s.businesses || []).length;
  const heirs = (s.npcs || []).filter(n => n.alive && n.rel === 'child');
  const wid   = (s.npcs || []).filter(n => n.alive && (n.rel === 'spouse' || n.rel === 'partner'))[0];
  const sibs  = (s.npcs || []).filter(n => n.alive && n.rel === 'sibling');
  const par   = (s.npcs || []).filter(n => n.alive && (n.rel === 'mother' || n.rel === 'father'));
  const out = [];
  if(s.age < 16) return out;

  if(worth <= -1000){
    out.push(eSentence([p.cap, `died owing ${money(-worth)}`]));
    if(heirs.length || wid) out.push(eSentence(['A debt is the one thing that does not pass on']));
    return out;
  }
  if(worth < 1000){
    out.push(eSentence([p.cap, 'left nothing to speak of']));
    return out;
  }
  const things = [];
  if(props) things.push(`${eNum(props)} propert${props > 1 ? 'ies' : 'y'}`);
  if(biz)   things.push(`${eNum(biz)} business${biz > 1 ? 'es' : ''}`);
  out.push(eSentence([`The estate came to ${money(worth)}`
    + (things.length ? `, including ${eList(things)}` : '')]));
  if(heirs.length)
    out.push(eSentence([`It passes to ${eList(heirs.slice(0, 4).map(n => eName(s, n)))}`
      + (wid ? ` and to ${eName(s, wid)}` : '')]));
  else if(wid)
    out.push(eSentence([`It passes to ${eName(s, wid)}`]));
  else if(sibs.length)
    out.push(eSentence([`With no children, it passes to ${eList(sibs.slice(0, 3).map(n => eName(s, n)))}`]));
  else if(par.length)
    out.push(eSentence([`It went back to ${eList(par.map(n => eulogyLabel(s, n)))}`]));
  else
    out.push(eSentence(['There was no one to leave it to']));
  if(s.peakNet > worth * 3 && s.peakNet > 100000)
    out.push(eSentence([`${p.cap} had been worth ${money(s.peakNet)} once`]));
  return out;
}

/* ---- the closing line ----
   Picked from everything that is true of this life rather than the first
   match, and keyed off the seed so that re-rendering the screen does not
   change what was said about someone. */
function eulogyClose(s){
  const p = ePron(s), h = s.stats || {};
  const drink = (s.habits && s.habits.drinking) || 0, drugs = (s.habits && s.habits.drugs) || 0;
  if(s.age < 16) return 'They did not get the chance to become anything, which is the whole of it.';
  const kin = (s.npcs || []).filter(n => n.alive && ['spouse','partner','child','sibling'].includes(n.rel));
  const loved = (s.npcs || []).filter(n => n.alive && n.r >= 70).length;
  const cands = [];
  const add = (test, line) => { if(test) cands.push(line); };

  /* Happiness has decayed in everyone by the time they die, so a low number
     on its own says nothing. It has to be bleak on more than one axis. */
  add(h.happiness <= 25 && !loved && (h.reputation || 50) < 45,
      `${p.cap} was not happy, and there was no one left who would have noticed.`);
  add(drugs > 55 || drink > 70, `${p.cap} fought something for most of ${p.their} life, and it was still there at the end.`);
  add(s.childrenCount >= 3, `What ${p.they} leaves behind is mostly people.`);
  add(s.age >= 92, `${p.cap} outlived almost everyone ${p.they} started with.`);
  add(s.age < 45, `It was not a long life, and it was not finished.`);
  add((s.countriesLived || []).length > 2, `${p.cap} never quite settled anywhere, and did not seem to mind.`);
  add(s.peakNet >= 1000000 && (s.birthTier || 0) <= 1, `${p.cap} started with nothing and did not end with nothing, which is rarer than it sounds.`);
  add(s.yearsJailed >= 5, `The record will say what ${p.they} did. It will not say much about why.`);
  add(s.crimesCommitted >= 10 && s.yearsJailed === 0, `${p.cap} got away with a great deal, and took most of it with ${p.them}.`);
  add(loved >= 3, `${p.cap} was loved by ${eNum(loved)} people, which is ${eNum(loved)} more than many manage.`);
  add((h.reputation || 0) >= 80, `${p.cap} was widely liked, which is harder than it sounds and counts for more than it is given credit for.`);
  add(h.happiness >= 72 && loved, `${p.cap} was, on the whole, happy. Not everyone manages it.`);
  add(s.marriedYears >= 40, `${p.cap} was not alone for most of it, which is what most people are actually asking for.`);
  add((s.echoes || []).some(e => e.id === 'scarred'), `Something happened to ${p.them} once, and ${p.they} carried it the rest of the way.`);
  add((s.echoes || []).some(e => e.id === 'driven'), `${p.cap} was always working towards something. ${p.cap} never said what.`);
  add(s.donated >= 100000, `${p.cap} gave away more than most people ever have.`);
  add(s.edu >= 4 && (h.smarts || 0) >= 80, `${p.cap} spent a life learning things, and took nearly all of it with ${p.them}.`);
  add(!kin.length && s.age >= 60, `${p.cap} outlasted everyone who would have come.`);
  add((s.jobsHeld || 0) >= 8, `${p.cap} was never quite finished deciding what to be.`);
  add((s.jobsHeld || 0) === 0 && s.age >= 40, `${p.cap} never worked a day of it, for reasons the record does not give.`);

  /* always available, so there is never nothing to say */
  cands.push(`It was an ordinary life, which is to say it was like almost every other one, and entirely unlike any of them.`);
  cands.push(`There is no summing it up. There was just all of it, one year after another.`);
  cands.push(`${p.cap} was here, for ${eNum(s.age)} years, and then ${p.they} was not.`);

  return cands[(s.seed >>> 0) % cands.length];
}

/* ---- the whole document ---- */
function eulogy(s, worth, st){
  const people = eulogyPeople(s);
  return {
    name: s.name,
    strap: `Died at ${s.age}${s.cause ? ` of ${s.cause}` : ''}`,
    life: eulogyOpening(s).concat(eulogyWork(s)).filter(Boolean),
    people: [people.survived].concat(people.predeceased ? [people.predeceased] : [])
              .concat(people.notes).filter(Boolean),
    estate: (st ? eulogyEstateFrom(s, Number(worth) || 0, st)
                : eulogyEstate(s, worth)).filter(Boolean),
    close: eulogyClose(s)
  };
}

/* BEQUEST — the will.

   The game is called Bequest and until now dying handed a flat 70% of net
   worth to whichever child happened to be first in the array. The house, the
   business and the car were simply deleted.

   This module lets you say who gets what, and makes that decision cost
   something. Three rules carry the weight:

     1. Without a will the estate is liquidated. Everything you built is sold
        by strangers and the cash is split by a formula, minus a large slice
        to probate. With a will, things pass in kind — the heir wakes up
        owning the actual house.
     2. Leaving someone out is not free. They may find out while you are
        alive, and they may contest it once you are not.
     3. One object can outlive all of it. An heirloom carries its own history
        forward and accumulates the names of everyone who held it.

   Everything here must be deterministic for a given save: the death screen
   re-renders whenever the player toggles something, and an estate that
   resettled itself mid-read would be a lie. All chance is resolved by
   hashing the save's seed, never by calling the RNG.                       */

/* ---------------- deterministic chance ---------------- */
function wHash(s, salt){
  const h = (((s && s.seed) >>> 0) + (salt >>> 0) * 2654435761) >>> 0;
  /* one more avalanche round, or neighbouring salts correlate */
  let x = h ^ (h >>> 15); x = Math.imul(x, 2246822507) >>> 0;
  x = x ^ (x >>> 13); x = Math.imul(x, 3266489909) >>> 0;
  return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
}
function wHashId(s, id, salt){
  let h = ((s && s.seed) >>> 0) ^ ((salt >>> 0) * 2654435761);
  const t = String(id);
  for(let i = 0; i < t.length; i++) h = (Math.imul(h, 31) + t.charCodeAt(i)) >>> 0;
  return wHash({ seed: h }, 7);
}

/* ---------------- heirlooms ----------------
   Deliberately small and deliberately not very valuable. The point of an
   heirloom is not that it is worth money.                                  */
const HEIRLOOMS = [
  { id:'watch',   n:'a gold pocket watch',      cost:4200,  v:3800  },
  { id:'ring',    n:'a signet ring',            cost:2600,  v:2400  },
  { id:'locket',  n:'a silver locket',          cost:900,   v:700   },
  { id:'violin',  n:'a violin',                 cost:7400,  v:6800  },
  { id:'bible',   n:'a family bible',           cost:400,   v:250   },
  { id:'clock',   n:'a longcase clock',         cost:5200,  v:5000  },
  { id:'painting',n:'a portrait of the family', cost:9500,  v:8000  },
  { id:'desk',    n:'a writing desk',           cost:3100,  v:2700  },
  { id:'medal',   n:'a service medal',          cost:0,     v:600   },
  { id:'rifle',   n:'a shotgun in a case',      cost:2900,  v:2500  }
];
const HEIRLOOM = id => HEIRLOOMS.find(h => h.id === id) || HEIRLOOMS[0];

/* An heirloom is worth more for having been kept. Not much more. */
function heirloomValue(h){
  if(!h) return 0;
  const gens = (h.gens || []).length;
  return Math.round((h.v || 0) * (1 + Math.min(gens, 8) * 0.22));
}
function heirloomAge(h){ return (h && h.gens) ? h.gens.length : 0; }
function heirloomLine(h){
  if(!h) return '';
  const g = heirloomAge(h);
  if(g <= 1) return 'Yours. Nobody has inherited it yet.';
  const first = h.gens[0];
  return `Held by ${wNum(g)} generations. ${first && first.name ? first.name.split(' ')[0] + ' had it first.' : ''}`.trim();
}

/* Some families already have one when you arrive. Called from newGame. */
function willBirth(s){
  s.will = { made:0, updated:0, main:null, shares:{}, gifts:{}, told:false, cut:[] };
  s.heirloom = null;
  if(s.birthTier >= 2 && wHash(s, 41) < 0.14){
    const d = HEIRLOOMS[Math.floor(wHash(s, 42) * HEIRLOOMS.length)] || HEIRLOOMS[0];
    const prior = 1 + Math.floor(wHash(s, 43) * 3);
    const gens = [];
    for(let i = 0; i < prior; i++) gens.push({ gen: s.gen - prior + i, name: 'A ' + s.surname });
    gens.push({ gen: s.gen, name: s.name });
    s.heirloom = { id:d.id, name:d.n, v:d.v, gens, origin:'family' };
  }
}
function willMigrate(s){
  if(!s.will) s.will = { made:0, updated:0, main:null, shares:{}, gifts:{}, told:false, cut:[] };
  if(!s.will.shares) s.will.shares = {};
  if(!s.will.gifts)  s.will.gifts  = {};
  if(!s.will.cut)    s.will.cut    = [];
  if(s.heirloom === undefined) s.heirloom = null;
}

/* ---------------- what there is to leave ----------------
   Assets get a uid the first time anyone looks at them through this screen.
   If the thing is sold before you die the bequest simply lapses, which is
   what happens in life and has a name: ademption.                          */
let WUID = 1;
function wUid(o, k){ if(!o.uid) o.uid = k + (WUID++) + '_' + Math.floor(Math.random() * 9000 + 1000); return o.uid; }

function willAssets(s){
  s = s || S;
  const out = [];
  (s.properties || []).forEach(p => {
    const eq = Math.max(0, (p.value || 0) - (p.mortgage || 0));
    out.push({ uid: wUid(p, 'p'), kind:'prop', ref:p, name: PROP(p.t).n, worth: eq,
               note: (p.home ? 'your home' : p.rented ? 'let out' : 'empty')
                     + (p.mortgage > 0 ? ' \u00b7 ' + money(p.mortgage) + ' still owing' : '') });
  });
  (s.vehicles || []).forEach(v => {
    out.push({ uid: wUid(v, 'v'), kind:'veh', ref:v, name: VEH(v.t).n, worth: v.value || 0,
               note: condWord(v.cond) });
  });
  (s.businesses || []).forEach(b => {
    out.push({ uid: wUid(b, 'b'), kind:'biz', ref:b, name: BIZ(b.t).n, worth: b.value || 0,
               note: (b.staff || 0) + ' staff' });
  });
  if(s.heirloom)
    out.push({ uid:'heirloom', kind:'heirloom', ref:s.heirloom,
               name: s.heirloom.name.replace(/^a /, 'A ').replace(/^an /, 'An '),
               worth: heirloomValue(s.heirloom), note: heirloomLine(s.heirloom) });
  return out;
}

/* Who is allowed to be in a will. Blood and the people you chose: children,
   a spouse or partner, siblings, and a friend close enough to count. */
function willHeirs(s){
  s = s || S;
  const rank = { spouse:0, partner:1, child:2, sibling:3, friend:4 };
  return (s.npcs || [])
    .filter(n => n.alive && rank[n.rel] != null && (n.rel !== 'friend' || n.r >= 80))
    .sort((a, b) => (rank[a.rel] - rank[b.rel]) || (b.r - a.r));
}
function willHeir(s, id){ return (s.npcs || []).find(n => n.id === id) || null; }

/* ---------------- editing the will ---------------- */
function willFee(){ return Math.round(900 * (typeof country === 'function' ? country().col : 1)); }
function willShareTotal(s){
  s = s || S;
  return Object.keys(s.will.shares).reduce((n, k) => n + (s.will.shares[k] || 0), 0);
}
function willCanWrite(s){
  s = s || S;
  return s.age >= 18 && willHeirs(s).length > 0;
}

function willSetShare(id, pct){
  const w = S.will, heirs = willHeirs(S);
  if(!heirs.some(h => h.id === id)) return;
  pct = Math.max(0, Math.min(100, Math.round(pct)));
  /* never let the total run past 100: the last mover is capped, not the will */
  const others = Object.keys(w.shares).filter(k => k !== id)
    .reduce((n, k) => n + (w.shares[k] || 0), 0);
  w.shares[id] = Math.min(pct, 100 - others);
  if(!w.shares[id]) delete w.shares[id];
  w.cut = w.cut.filter(x => x !== id);
  if(!w.main || !willHeir(S, w.main)) w.main = willMainGuess(S);
  willTouch(); save(); renderTab('money', true);
}
function willEven(){
  const w = S.will, kids = willHeirs(S).filter(n => n.rel === 'child');
  const pool = kids.length ? kids : willHeirs(S).slice(0, 1);
  if(!pool.length) return;
  w.shares = {};
  const base = Math.floor(100 / pool.length);
  pool.forEach((n, i) => { w.shares[n.id] = base + (i < 100 - base * pool.length ? 1 : 0); });
  w.cut = [];
  w.main = w.main && w.shares[w.main] ? w.main : pool[0].id;
  willTouch(); save(); renderTab('money', true);
}
function willSetGift(uid, heirId){
  const w = S.will;
  if(!heirId) delete w.gifts[uid]; else w.gifts[uid] = heirId;
  willTouch(); save(); renderTab('money', true);
}
function willCut(id){
  const w = S.will;
  if(w.cut.indexOf(id) < 0){ w.cut.push(id); delete w.shares[id];
    Object.keys(w.gifts).forEach(k => { if(w.gifts[k] === id) delete w.gifts[k]; });
    if(w.main === id) w.main = willMainGuess(S);
  } else w.cut = w.cut.filter(x => x !== id);
  willTouch(); save(); renderTab('money', true);
}
function willSetMain(id){ S.will.main = id; willTouch(); save(); renderTab('money', true); }
function willMainGuess(s){
  const named = willHeirs(s).filter(n => n.rel === 'child' && (s.will.shares[n.id] || 0) > 0);
  const kids  = willHeirs(s).filter(n => n.rel === 'child');
  return (named[0] || kids[0] || null) && (named[0] || kids[0]).id;
}
/* Any edit after the will is signed means it has to be signed again. */
function willTouch(){ if(S.will.made) S.will.updated = S.age; }

function willWrite(){
  if(!willCanWrite(S)) return popupOK('Not yet', 'You need someone to leave something to first.');
  const fee = willFee();
  if(!afford(fee)) return;
  confirmDo('Have the will drawn up?', `A solicitor will charge ${money(fee)} to write and witness it.`, () => {
    charge(fee); ledger('spend','Solicitor',fee);
    S.will.made = S.age; S.will.updated = S.age;
    if(!S.will.main) S.will.main = willMainGuess(S);
    if(!willShareTotal(S)) willEven();
    cue('good', 'medium');
    logLine('You had your will drawn up.', 'good');
    save(); renderAll();
    popupOK('Signed and witnessed', 'It will be read out when you are not in the room.');
  });
}

/* Telling them is a real decision. The ones who do well by it think better
   of you. The ones who do not are not going to wait until you are dead. */
function willTell(){
  if(!S.will.made) return popupOK('Nothing to tell', 'You have not made a will yet.');
  confirmDo('Tell the family what is in it?',
    'They will know exactly where they stand. Some of them will be pleased.', () => {
    const res = [];
    willHeirs(S).forEach(n => {
      const got = (S.will.shares[n.id] || 0) > 0 || Object.keys(S.will.gifts).some(k => S.will.gifts[k] === n.id);
      const cut = S.will.cut.indexOf(n.id) >= 0;
      const d = cut ? -26 : got ? +7 : -14;
      n.r = Math.max(0, Math.min(100, n.r + d));
      res.push(`${n.name.split(' ')[0]} ${d > 0 ? '+' : ''}${d}`);
    });
    S.will.told = true;
    cue(res.some(r => r.indexOf('-') > 0) ? 'bad' : 'good', 'medium');
    logLine('You told the family what was in your will.', 'neutral');
    save(); renderAll();
    popupOK('They know', 'Nobody will be surprised now.', res);
  });
}

/* If you cut someone out and say nothing, word still gets round. */
function willLeak(){
  if(!S.will.made || S.will.told) return;
  const wronged = willHeirs(S).filter(n =>
    S.will.cut.indexOf(n.id) >= 0 ||
    ((S.will.shares[n.id] || 0) === 0 && n.rel === 'child' &&
     !Object.keys(S.will.gifts).some(k => S.will.gifts[k] === n.id)));
  if(!wronged.length) return;
  if(R() > 0.06) return;
  const n = pick(wronged);
  n.r = Math.max(0, n.r - 18);
  S.will.leaked = true;
  logLine(`${n.name.split(' ')[0]} found out what is in your will.`, 'bad');
}

/* ---------------- commissioning one ---------------- */
function heirloomOffer(){
  if(S.heirloom) return popupOK('You already have one', `${S.heirloom.name.replace(/^an? /, '')} \u2014 ${heirloomLine(S.heirloom)}`);
  const col = typeof country === 'function' ? country().col : 1;
  const opts = HEIRLOOMS.filter(h => h.cost > 0).map(h =>
    [`${h.n.replace(/^a /, 'A ').replace(/^an /, 'An ')} \u2014 ${money(Math.round(h.cost * col))}`, 0, h.id]);
  chooseFrom('Something to last', opts, (label, id) => commissionHeirloom(id));
}
function commissionHeirloom(id){
  const d = HEIRLOOM(id), col = typeof country === 'function' ? country().col : 1;
  const cost = Math.round(d.cost * col);
  if(S.heirloom) return;
  if(!afford(cost)) return;
  charge(cost); ledger('spend','Heirloom',cost);
  S.heirloom = { id:d.id, name:d.n, v:d.v, gens:[{ gen:S.gen, name:S.name }], origin:'made' };
  cue('good', 'medium');
  logLine(`You bought ${d.n}, meaning to keep it.`, 'good');
  save(); renderAll();
}

/* ---------------- settling the estate ----------------
   Pure and deterministic: same save in, same settlement out, every time.  */
function settleEstate(s, gross){
  s = s || S;
  willMigrate(s);
  gross = Number(gross);
  if(!isFinite(gross)) gross = 0;

  const w = s.will || {};
  const heirs = willHeirs(s);
  const assets = willAssets(s);
  const out = {
    gross, intestate: !w.made, probateRate: 0, probate: 0, legal: 0,
    contested: [], allocations: [], lapsed: [], heirloomTo: null,
    heirloomLost: false, lost: 0, net: 0
  };

  /* Debt does not pass on. There is nothing to settle. */
  if(gross <= 0){
    out.net = 0;
    if(s.heirloom) out.heirloomLost = true;
    return out;
  }

  /* --- no will: strangers sell it and the courts take a slice --- */
  if(!w.made){
    out.probateRate = 0.12;
    out.probate = Math.round(gross * out.probateRate);
    out.net = gross - out.probate;
    const kids = heirs.filter(n => n.rel === 'child');
    const sp   = heirs.filter(n => n.rel === 'spouse' || n.rel === 'partner');
    const sib  = heirs.filter(n => n.rel === 'sibling');
    const take = kids.length ? kids : sp.length ? sp : sib;
    if(!take.length){ out.lost = out.net; return out; }
    const each = Math.floor(out.net / take.length);
    take.forEach(n => out.allocations.push({ id:n.id, name:n.name, rel:n.rel, cash:each, assets:[], heirloom:false }));
    /* everything is liquidated, including the thing that was not about money */
    if(s.heirloom) out.heirloomLost = true;
    return out;
  }

  /* --- a will: 4% and things pass as things --- */
  out.probateRate = 0.04;
  out.probate = Math.round(gross * out.probateRate);

  const alloc = {};
  const ensure = n => alloc[n.id] || (alloc[n.id] = { id:n.id, name:n.name, rel:n.rel, cash:0, assets:[], heirloom:false });

  let gifted = 0;
  assets.forEach(a => {
    const to = w.gifts[a.uid];
    if(!to) return;
    const n = willHeir(s, to);
    if(!n || !n.alive){ out.lapsed.push(a); return; }   /* named someone who went first */
    if(a.kind === 'heirloom'){ ensure(n).heirloom = true; out.heirloomTo = n.id; return; }
    ensure(n).assets.push(a);
    gifted += a.worth;
  });
  /* an heirloom nobody was left goes in the sale with everything else */
  if(s.heirloom && !out.heirloomTo) out.heirloomLost = true;

  let cash = Math.max(0, gross - out.probate - gifted);

  const shareIds = Object.keys(w.shares).filter(id => {
    const n = willHeir(s, id); return n && n.alive && w.shares[id] > 0;
  });
  const shareSum = shareIds.reduce((n, id) => n + w.shares[id], 0);
  if(shareIds.length && shareSum > 0){
    shareIds.forEach(id => {
      const n = willHeir(s, id);
      ensure(n).cash += Math.floor(cash * (w.shares[id] / shareSum));
    });
  } else if(cash > 0){
    /* a will that disposes of the things but not the money: it still has to
       go somewhere, and it goes where the law would have sent it */
    const kids = heirs.filter(n => n.rel === 'child');
    const fall = kids.length ? kids : heirs.slice(0, 1);
    if(fall.length){ const each = Math.floor(cash / fall.length); fall.forEach(n => ensure(n).cash += each); }
    else out.lost += cash;
  }

  /* --- contesting ---
     A living child or spouse who was left nothing, and did not think much of
     you, has both the standing and the motive. */
  const wronged = heirs.filter(n => {
    if(n.rel !== 'child' && n.rel !== 'spouse' && n.rel !== 'partner') return false;
    const a = alloc[n.id];
    return !a || (a.cash <= 0 && !a.assets.length && !a.heirloom);
  });
  wronged.forEach(n => {
    let p = 0.10 + Math.max(0, (60 - n.r)) / 110;          /* resentment does the work */
    if((w.cut || []).indexOf(n.id) >= 0) p += 0.15;        /* named and excluded */
    if(w.told) p *= 0.55;                                  /* they had the row while you were alive */
    /* nobody instructs a solicitor over a few thousand pounds */
    p *= Math.max(0, Math.min(1, gross / 60000));
    if(wHashId(s, n.id, 91) < p) out.contested.push({ id:n.id, name:n.name, rel:n.rel, r:n.r });
  });

  if(out.contested.length){
    /* Lawyers first. Then the court gives the claimants a third of the cash
       between them, taken pro rata from everyone who was left some. */
    out.legal = Math.round(Math.min(gross * 0.18, 140000));
    const paid = Object.keys(alloc).filter(id => alloc[id].cash > 0);
    const pot  = paid.reduce((n, id) => n + alloc[id].cash, 0);
    const fees = Math.min(out.legal, pot);
    paid.forEach(id => { alloc[id].cash -= Math.round(fees * (alloc[id].cash / pot)); });

    const after = paid.reduce((n, id) => n + Math.max(0, alloc[id].cash), 0);
    const forced = Math.round(after / 3);
    if(forced > 0){
      paid.forEach(id => { alloc[id].cash -= Math.round(forced * (Math.max(0, alloc[id].cash) / after)); });
      const each = Math.floor(forced / out.contested.length);
      out.contested.forEach(c => { const n = willHeir(s, c.id); ensure(n).cash += each; });
    }
  }

  Object.keys(alloc).forEach(id => { alloc[id].cash = Math.max(0, alloc[id].cash); out.allocations.push(alloc[id]); });
  out.allocations.sort((a, b) => (b.cash + b.assets.reduce((n, x) => n + x.worth, 0))
                               - (a.cash + a.assets.reduce((n, x) => n + x.worth, 0)));
  out.net = gross - out.probate - out.legal;
  return out;
}

function settlementFor(id, st){
  return (st.allocations || []).find(a => a.id === id) || null;
}

/* ---------------- the screen you write it on ---------------- */
function willView(){
  willMigrate(S);
  const w = S.will, heirs = willHeirs(S), assets = willAssets(S);
  const worth = netWorth();
  const total = willShareTotal(S);

  if(S.age < 18)
    return '<div class="card"><div class="muted">You cannot make a will until you are 18.</div></div>';

  const status = w.made
    ? `<div class="kv"><span>Drawn up</span><b>age ${w.made}${w.updated > w.made ? ', revised at ' + w.updated : ''}</b></div>
       <div class="kv"><span>Probate will take</span><b>4%</b></div>
       <div class="kv"><span>The family</span><b>${w.told ? 'know what is in it' : w.leaked ? 'have heard rumours' : 'have not been told'}</b></div>`
    : `<div class="hardnote">You have not made a will. If you die now the estate is sold off,
       <b>12% goes to probate</b>, and what is left is split by a formula \u2014 the house, the business

  const heirRows = heirs.length ? heirs.map(n => {
    const cut = w.cut.indexOf(n.id) >= 0;

    const gifts = assets.filter(a => w.gifts[a.uid] === n.id);
    return `<div class="npc"><div class="npcline"><div>
        <div class="rn">${esc(n.name)}${w.main === n.id ? ' <span class="award t1">main heir</span>' : ''}</div>
        <div class="hsub dim">${esc(n.rel)} \u00b7 ${n.r >= 70 ? 'close' : n.r >= 40 ? 'in touch' : 'distant'}${
          gifts.length ? ' \u00b7 ' + esc(gifts.map(g => g.name.toLowerCase()).join(', ')) : ''}</div></div>
        <div class="hsub"><b>${cut ? '\u2014' : pct + '%'}</b></div></div>
      ${cut ? '<div class="hsub dim">Cut out of the will.</div>' : `
      <div class="nact">
        <button onclick="willSetShare('${n.id}',${Math.max(0, pct - 10)})">\u2212</button>
        <button onclick="willSetShare('${n.id}',${Math.min(100, pct + 10)})">+</button>
        ${w.main === n.id || n.rel !== 'child' ? '' : `<button onclick="willSetMain('${n.id}')">Make main heir</button>`}
      </div>`}
      <div class="nact"><button onclick="willCut('${n.id}')">${cut ? 'Put back in' : 'Cut out'}</button></div>
    </div>`;
  }).join('') : '<div class="hsub dim">There is nobody to leave anything to yet.</div>';

  const assetRows = assets.length ? assets.map(a => {
    const to = w.gifts[a.uid], n = to ? willHeir(S, to) : null;
    const opts = ['<option value="">Sold with the rest</option>']
      .concat(heirs.map(h => `<option value="${h.id}"${to === h.id ? ' selected' : ''}>${esc(h.name)}</option>`)).join('');
    return `<div class="npc"><div class="npcline"><div>
        <div class="rn">${esc(a.name)}${a.kind === 'heirloom' ? ' <span class="award t2">heirloom</span>' : ''}</div>
        <div class="hsub dim">${money(a.worth)} \u00b7 ${esc(a.note)}</div></div></div>
      <div class="nact"><select class="willsel" onchange="willSetGift('${a.uid}',this.value)">${opts}</select></div>
      ${n && !n.alive ? '<div class="hsub bad">They are no longer alive.</div>' : ''}</div>`;
  }).join('') : '<div class="hsub dim">You own nothing that can be handed over as it is.</div>';

  /* what it would actually come to if you died this year */
  const st = settleEstate(S, worth);
  const preview = st.allocations.length ? st.allocations.map(a => {
    const things = a.assets.map(x => x.name.toLowerCase()).concat(a.heirloom ? ['the heirloom'] : []);
    return `<div class="kv"><span>${esc(a.name.split(' ')[0])}</span><b>${money(a.cash)}${
      things.length ? ' + ' + esc(things.join(', ')) : ''}</b></div>`;
  }).join('') : '<div class="hsub dim">Nobody would get anything.</div>';

  return `<div class="card"><div class="ctrow"><div class="ct">Your will</div>
      <div class="hsub dim">${money(worth)} to leave</div></div>
    ${status}
    <div class="row mt">
      <button class="btn primary" onclick="willWrite()">${w.made ? 'Have it redrawn \u2014 ' + money(willFee()) : 'Have one drawn up \u2014 ' + money(willFee())}</button>
      ${w.made ? '<button class="btn" onclick="willTell()">Tell the family</button>' : ''}
    </div></div>

  <div class="card"><div class="ctrow"><div class="ct">Who gets the money</div>
      <div class="hsub ${total === 100 ? 'dim' : 'bad'}">${total}% allocated</div></div>
    ${total !== 100 && heirs.length ? `<div class="hardnote">${total > 100 ? 'That is more than there is.'
      : 'The rest would be split by the law, not by you.'}</div>` : ''}
    <div class="row"><button class="btn" onclick="willEven()">Split evenly between the children</button></div>
    ${heirRows}</div>

  <div class="card"><div class="ct">Who gets the things</div>
    <div class="hsub dim">Anything you do not name is sold and added to the money.</div>

    ${!S.heirloom && S.age >= 25 ? `<div class="row mt"><button class="btn" onclick="heirloomOffer()">Have something made to last</button></div>` : ''}</div>

  <div class="card"><div class="ct">If you died this year</div>
    <div class="kv"><span>Estate</span><b>${money(st.gross)}</b></div>
    <div class="kv"><span>Probate at ${Math.round(st.probateRate * 100)}%</span><b class="bad">\u2212${money(st.probate)}</b></div>
    ${st.contested.length ? `<div class="kv"><span>Contested by ${esc(st.contested.map(c => c.name.split(' ')[0]).join(', '))}</span><b class="bad">\u2212${money(st.legal)}</b></div>` : ''}
    ${preview}
    ${st.heirloomLost ? '<div class="hardnote">The heirloom would be sold with everything else.</div>' : ''}
    ${st.contested.length ? '<div class="hardnote">Someone you left out would take it to court. Telling them while you are alive makes that less likely.</div>' : ''}
  </div>`;
