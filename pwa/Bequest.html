/* ---------------- the death screen block ---------------- */
function willDeathBlock(st){
  if(!st) return '';
  const rows = st.allocations.map(a => {
    const things = a.assets.map(x => x.name.toLowerCase()).concat(a.heirloom ? ['the heirloom'] : []);
    return `<div class="kv"><span>${esc(a.name)}</span><b>${money(a.cash)}${things.length ? ' + ' + esc(things.join(', ')) : ''}</b></div>`;
  }).join('');
  const notes = [];
  if(st.intestate) notes.push('There was no will. Everything was sold and ' + money(st.probate) + ' went to probate.');
  else notes.push('The will was read. ' + money(st.probate) + ' went to probate.');
  if(st.contested.length) notes.push(st.contested.map(c => c.name.split(' ')[0]).join(' and ')
    + ' contested it. The lawyers took ' + money(st.legal) + '.');
  if(st.heirloomLost) notes.push('The heirloom was sold with the rest.');
  if(st.lost > 0) notes.push(money(st.lost) + ' went unclaimed.');
  return `<div class="sec">What was left</div>
    ${rows || '<div class="hsub dim">There was nothing to leave.</div>'}
    ${notes.map(n => `<div class="hsub dim">${esc(n)}</div>`).join('')}`;
}

/* words, for the small numbers that read badly as digits */
function wNum(n){
  const w = ['no','one','two','three','four','five','six','seven','eight','nine','ten'];
  return w[n] != null ? w[n] : String(n);
}

/* BEQUEST — school subjects.

   Ages eleven to eighteen are a third of the events in the game and resolved
   to a single number, S.gpa, which drifted up or down from smarts and
   discipline and then decided one thing: whether a university would take you.

   Worse, the twelve degrees in social.js were unreachable. `S.degree` was
   read in six places and assigned in none, so enrolling bought you three
   smarts a year and nothing else: no subject, no skills from studying it, and
   never the 12% pay premium for working in your field. This module is what
   makes ages eleven to eighteen decide anything: subjects you are good at,
   options you choose at fourteen, degrees those options open or close, and
   skills the whole thing hands you on the way out.

   S.gpa is kept, and kept accurate, because the rest of the game reads it.
   It is now an average of what you are actually studying rather than a
   number of its own.                                                       */

const SUBJECTS = [
  { id:'maths',     n:'Mathematics',          skill:'smarts',    core:true,  degrees:['compsci','engineering','business_d'] },
  { id:'english_s', n:'English',              skill:'writing',   core:true,  degrees:['english','law','education_d'] },
  { id:'science',   n:'Science',              skill:'medicine',  core:true,  degrees:['medicine','sport_sci','psychology'] },
  { id:'history',   n:'History',              skill:'smarts',    core:false, degrees:['politics_d','law'] },
  { id:'languages', n:'Languages',            skill:'charisma',  core:false, degrees:['english','politics_d'] },
  { id:'art_s',     n:'Art',                  skill:'art',       core:false, degrees:['arts'] },
  { id:'music_s',   n:'Music',                skill:'music',     core:false, degrees:['music_d'] },
  { id:'dt',        n:'Design and Technology',skill:'handiness', core:false, degrees:['engineering'] },
  { id:'pe',        n:'Physical Education',   skill:'fitness',   core:false, degrees:['sport_sci'] },
  { id:'business_s',n:'Business Studies',     skill:'business',  core:false, degrees:['business_d'] },
  { id:'computing', n:'Computing',            skill:'tech',      core:false, degrees:['compsci'] },
  { id:'psych_s',   n:'Psychology',           skill:'smarts',    core:false, degrees:['psychology','medicine'] }
];
const SUBJECT = id => SUBJECTS.find(s => s.id === id) || SUBJECTS[0];

const SCHOOL_START = 11;   /* when subjects begin to mean anything */
const OPTIONS_AGE  = 14;   /* when you drop some and keep others   */
const SCHOOL_END   = 18;
const DEGREE_BAR   = 60;   /* the grade a subject needs to open its degrees */

/* Some people are simply better at some things, and it is not all effort. */
function schoolBirth(s){
  s.subjects = {};
  s.aptitude = {};
  SUBJECTS.forEach(sub => { s.aptitude[sub.id] = ri(-18, 22); });
  s.options = null;        /* chosen at fourteen */
  s.optionsHow = null;
}
function schoolMigrate(s){
  if(!s.subjects) s.subjects = {};
  if(!s.aptitude){ s.aptitude = {}; SUBJECTS.forEach(sub => { s.aptitude[sub.id] = ri(-18, 22); }); }
  if(s.options === undefined) s.options = null;
}

/* What you are actually sitting in a room for this year. */
function subjectsActive(s){
  if(s.age < SCHOOL_START || s.age > SCHOOL_END) return [];
  if(s.age < OPTIONS_AGE || !s.options || !s.options.length) return SUBJECTS.map(x => x.id);
  /* after options: the three core subjects plus whatever you chose */
  const core = SUBJECTS.filter(x => x.core).map(x => x.id);
  return core.concat(s.options.filter(id => core.indexOf(id) < 0));
}
/* The subjects you actually took to eighteen. subjectsActive() answers "what
   are you sitting in this year" and goes empty once school is over; this one
   has to keep answering after you have left, because it is what a university
   asks about. */
function subjectsTaken(s){
  const core = SUBJECTS.filter(x => x.core).map(x => x.id);
  const kept = (s.options || []).filter(id => core.indexOf(id) < 0);
  return core.concat(kept);
}
function subjectGrade(s, id){
  const g = (s.subjects || {})[id];
  return g == null ? 0 : Math.round(g);
}
function bestSubjects(s, n){
  return Object.keys(s.subjects || {})
    .sort((a, b) => s.subjects[b] - s.subjects[a])
    .slice(0, n || 3);
}

/* One year of school. Called from tickAging while inSchool. */
function tickSubjects(s, notes){
  if(s.age < SCHOOL_START || s.age > SCHOOL_END) return;
  const active = subjectsActive(s);
  active.forEach(id => {
    if(s.subjects[id] == null) s.subjects[id] = 36 + ri(0, 10);
    /* A subject has a ceiling you converge on, rather than a number that
       accumulates: seven years of small positive drift made everybody a
       straight-A student in everything, and then no degree was ever closed
       to anyone. You move a third of the way towards what you are capable
       of each year, so ability and effort separate people instead of time. */
    const apt  = (s.aptitude && s.aptitude[id]) || 0;
    const kept = s.options && s.options.indexOf(id) >= 0;
    const ceiling = clamp(40
          + (s.stats.smarts - 50) * 0.42
          + apt * 0.85
          + s.stats.discipline * 0.14
          + (kept ? 11 : -4)                       /* you chose it, so you turn up */
          + (s.traits && s.traits.includes('gifted') ? 6 : 0)
          - (s.habits.doomscroll > 45 ? 7 : 0)
          - (s.stats.happiness < 30 ? 6 : 0));
    const d = (ceiling - s.subjects[id]) * 0.34 + (Math.random() * 3 - 1.5);
    s.subjects[id] = clamp(s.subjects[id] + d);
  });
  /* dropped subjects do not improve, and fade a little */
  if(s.options && s.options.length){
    Object.keys(s.subjects).forEach(id => {
      if(active.indexOf(id) < 0) s.subjects[id] = clamp(s.subjects[id] - 1.2);
    });
  }
  s.gpa = gpaFrom(s);
  /* one line a year, about the subject that is going somewhere */
  if(notes && s.age >= OPTIONS_AGE && Math.random() < 0.45){
    const best = bestSubjects(s, 1)[0];
    if(best && subjectGrade(s, best) >= 72)
      notes.push(`${SUBJECT(best).n} is going well. You are at ${subjectGrade(s, best)} in it.`);
  }
}

/* S.gpa is still the number the rest of the game reads, so it has to stay
   true: it is the average of what you are studying now. */
function gpaFrom(s){
  const active = subjectsActive(s);
  const have = active.filter(id => s.subjects[id] != null);
  if(!have.length) return s.gpa == null ? 50 : s.gpa;
  return clamp(have.reduce((n, id) => n + s.subjects[id], 0) / have.length);
}

/* ---- choosing options at fourteen ---- */
function optionPool(){ return SUBJECTS.filter(x => !x.core).map(x => x.id); }
function chooseOptions(how){
  const s = S;
  const pool = optionPool();
  let picked;
  if(how === 'best'){
    picked = pool.slice().sort((a, b) =>
      ((s.subjects[b] || 0) + (s.aptitude[b] || 0)) - ((s.subjects[a] || 0) + (s.aptitude[a] || 0))).slice(0, 3);
  } else if(how === 'enjoy'){
    const fun = ['art_s','music_s','pe','computing','psych_s'];
    picked = fun.slice().sort(() => Math.random() - 0.5).slice(0, 3);
  } else {
    picked = pool.slice().sort(() => Math.random() - 0.5).slice(0, 3);
  }
  s.options = picked;
  s.optionsHow = how;
  picked.forEach(id => { if(s.subjects[id] == null) s.subjects[id] = 36 + ri(0, 10); });
  return picked.map(id => SUBJECT(id).n);
}

/* ---- what your subjects open ---- */
function degreeOpen(s, degId){
  const feeders = SUBJECTS.filter(x => x.degrees.indexOf(degId) >= 0);
  if(!feeders.length) return true;                 /* nothing gates it */
  const took = subjectsTaken(s);
  /* dropping a subject at fourteen has to close something, or the choice at
     fourteen was not a choice */
  return feeders.some(f => took.indexOf(f.id) >= 0 && subjectGrade(s, f.id) >= DEGREE_BAR);
}
function degreesOpenTo(s){
  const open = DEGREES.filter(d => degreeOpen(s, d.id));
  const list = open.length ? open
    : DEGREES.filter(d => ['business_d','english','education_d'].indexOf(d.id) >= 0);
  /* best subject first, so a dismissed chooser still reads something that
     follows from the life rather than whatever is top of the table */
  const rank = d => Math.max.apply(null, SUBJECTS.filter(x => x.degrees.indexOf(d.id) >= 0)
                                                 .map(x => subjectGrade(s, x.id)).concat([0]));
  return list.slice().sort((a, b) => rank(b) - rank(a));
}
function degreeBlockedBy(degId){
  const feeders = SUBJECTS.filter(x => x.degrees.indexOf(degId) >= 0);
  return feeders.map(f => f.n).join(' or ');
}

/* Leaving school hands you what you were good at, as skills. This is the
   line that makes ages eleven to eighteen matter to a career. */
function schoolLeavingSkills(s, notes){
  if(s.flags.schoolSkillsGiven) return;
  s.flags.schoolSkillsGiven = true;
  const gained = [];
  SUBJECTS.forEach(sub => {
    const g = subjectGrade(s, sub.id);
    if(g < 60) return;
    const amount = Math.round((g - 55) / 3.2);     /* 60 -> +2, 100 -> +14 */
    if(amount <= 0) return;
    if(s.skills[sub.skill] != null) s.skills[sub.skill] = clamp(s.skills[sub.skill] + amount);
    else if(s.stats[sub.skill] != null) s.stats[sub.skill] = clamp(s.stats[sub.skill] + amount);
    gained.push(`${sub.n} ${g}`);
  });
  if(gained.length && notes)
    notes.push(`You left school with ${gained.slice(0, 4).join(', ')}.`);
  else if(notes) notes.push('You left school with nothing much to show for it.');
}

/* ---- the study action, now aimed at something ---- */
function studySubject(id){
  const s = S, sub = SUBJECT(id);
  if(s.subjects[id] == null) s.subjects[id] = 36 + ri(0, 10);
  const before = subjectGrade(s, id);
  /* effort beats the ceiling, but with diminishing returns near the top */
  const room = Math.max(0, 100 - s.subjects[id]);
  const gain = Math.max(1, Math.round((ri(5, 12) + ((s.aptitude && s.aptitude[id]) || 0) / 10) * (room / 100 + 0.25)));
  s.subjects[id] = clamp(s.subjects[id] + gain);
  s.gpa = gpaFrom(s);
  applyEff({ smarts: 3, happiness: -3, discipline: 3 });
  popupOK(`${sub.n}`,
    `You put the evening into it.\n${sub.n} moved from ${before} to ${subjectGrade(s, id)}.`
    + (subjectGrade(s, id) >= DEGREE_BAR && before < DEGREE_BAR
       ? `\n\nThat is now good enough to read ${DEGREES.filter(d => sub.degrees.indexOf(d.id) >= 0).map(d => d.n).join(' or ')} at university.`
       : ''));
  save(); renderAll();
}
function studyPick(){
  const s = S, active = subjectsActive(s);
  if(!active.length) return popupOK('Not at school', 'You are not studying anything.');
  chooseFrom('Which subject?', active.map(id =>
    [`${SUBJECT(id).n} \u2014 ${subjectGrade(s, id)}/100`, 0, id]), (label, id) => studySubject(id));
}

/* ---- the card on the Life tab ---- */
function subjectsCard(){
  const s = S;
  const active = subjectsActive(s);
  if(!active.length) return '';
  const rows = active.slice().sort((a, b) => subjectGrade(s, b) - subjectGrade(s, a)).map(id => {
    const g = subjectGrade(s, id), sub = SUBJECT(id);
    const kept = s.options && s.options.indexOf(id) >= 0;
    const opens = sub.degrees.filter(d => DEGREE(d)).map(d => DEGREE(d).n);
    return `<div class="subj">
      <div class="subjline"><div class="rn">${esc(sub.n)}${kept ? ' <span class="award t1">chosen</span>' : ''}</div>
        <b class="${g >= 70 ? 'g' : g >= DEGREE_BAR ? '' : 'dim'}">${g}</b></div>
      <div class="bt"><i class="${g >= 70 ? 'g' : g >= DEGREE_BAR ? 'a' : 'r'}" style="width:${g}%"></i></div>
      ${opens.length ? `<div class="hsub dim">${g >= DEGREE_BAR ? 'Opens' : 'Would open'} ${esc(opens.join(', '))}</div>` : ''}
    </div>`;
  }).join('');
  const note = s.age < OPTIONS_AGE
    ? `<div class="hsub dim">At ${OPTIONS_AGE} you will drop some of these and keep the rest.</div>`
    : s.options ? `<div class="hsub dim">You kept ${esc(s.options.map(id => SUBJECT(id).n).join(', '))}.</div>` : '';
  return `<div class="card"><div class="ctrow"><div class="ct">Subjects</div>
      <div class="hsub dim">average ${Math.round(gpaFrom(s))}</div></div>
    ${note}${rows}</div>`;
}

/* BEQUEST — arrest, plea, trial, sentence, appeal.

   Getting caught used to be one line of arithmetic. A single roll decided
   whether you were caught, and if you were, a second roll decided how many
   years you served. There was nothing to decide and nothing to spend money
   on, which made crime the only system in the game with no play in it.

   Now being caught is the beginning rather than the end:

     charged -> how do you plead -> who represents you -> verdict -> appeal

   The decisions are real ones and they trade off against each other. Pleading
   guilty takes a third off the sentence and gives up any chance of walking.
   Fighting it costs money you may not have and, if you lose, costs you the
   discount as well. Good representation is the difference between the two,
   and it is expensive exactly when you can least afford it.

   Everything is queued through push(), never confirmDo(), because a case can
   open from inside ageUp() and draining the queue from in there re-enters the
   year.                                                                     */

/* Who is standing up for you. cost is before cost-of-living. */
const COUNSEL = [
  { id:'duty',      n:'The duty solicitor',   cost:0,     acquit:0.00, mitigate:0.00,
    d:'Whoever is on the rota. Met you twenty minutes ago.' },
  { id:'solicitor', n:'A decent solicitor',   cost:4200,  acquit:0.14, mitigate:0.12,
    d:'Knows the court and the prosecutor. Will read the file properly.' },
  { id:'barrister', n:'A silk',               cost:26000, acquit:0.30, mitigate:0.26,
    d:'Expensive, and the room changes when they stand up.' }
];
const COUNSEL_BY = id => COUNSEL.find(c => c.id === id) || COUNSEL[0];

function courtMigrate(s){ if(s.legalCase === undefined) s.legalCase = null; }
function counselCost(c){ return Math.round(c.cost * (typeof country === 'function' ? country().col : 1)); }

/* ---- opening a case ---- */
function openCase(crimeId, baseSentence){
  const cr = DATA.crimes.find(c => c.id === crimeId) || { id:crimeId, n:'An offence', sentence:[0,1] };
  /* How much the prosecution actually has. Being careful, and being the sort
     of person a jury believes, both help. */
  let ev = 45 + ri(0, 35) + baseSentence * 3;
  ev -= Math.round((S.skills.charisma || 0) / 8);
  ev -= Math.round((S.stats.reputation || 50) / 12);
  if(hasItem('burner')) ev -= 8;
  if(hasItem('mask'))   ev -= 10;
  if((S.record || []).filter(r => !r.spent).length >= 2) ev += 12;   /* known to them */
  S.legalCase = {
    crime: cr.id, name: cr.n,
    base: baseSentence,
    evidence: Math.max(8, Math.min(97, ev)),
    stage: 'plea', plea: null, counsel: null, spent: 0,
    outcome: null, sentence: 0, appealed: false, note: null
  };
  push({ type:'COURT' });
  return `You were arrested and charged with ${cr.n.toLowerCase()}.`;
}

function evidenceWord(e){
  return e >= 80 ? 'overwhelming' : e >= 62 ? 'strong' : e >= 45 ? 'decent' : e >= 30 ? 'thin' : 'barely there';
}

/* ---- the decisions ---- */
function courtPlead(how){
  const c = S.legalCase; if(!c) return;
  c.plea = how;
  c.stage = 'counsel';
  renderPopup();
}
function courtCounsel(id){
  const c = S.legalCase; if(!c) return;
  const def = COUNSEL_BY(id), cost = counselCost(def);
  if(cost > 0){
    const pot = S.money + S.savings;
    if(pot < cost){ c.note = `You cannot raise ${money(cost)}.`; return renderPopup(); }
    /* Math.min on a negative balance would have paid you to hire someone */
    const fromCash = Math.max(0, Math.min(S.money, cost));
    S.money -= fromCash; S.savings -= (cost - fromCash);
    ledger('spend', 'Legal fees', cost);
  }
  c.counsel = id; c.spent += cost; c.note = null;
  courtResolve();
}

/* ---- the verdict ---- */
function courtResolve(){
  const c = S.legalCase; if(!c) return;
  const def = COUNSEL_BY(c.counsel);

  if(c.plea === 'guilty'){
    /* no trial: a third off for not making everyone sit through one */
    c.outcome = 'convicted';
    /* a real discount, or there is no reason ever to plead */
    c.sentence = Math.max(0, Math.round(c.base * (0.55 - def.mitigate * 0.8)));
    c.note = 'You pleaded guilty. The sentence was reduced for it.';
  } else {
    let p = 0.22
          - (c.evidence - 50) / 110
          + def.acquit
          + (S.skills.charisma || 0) / 500
          + (S.stats.reputation - 50) / 600
          + LUCK() / 2;
    if(hasItem('fakeid')) p += 0.10;
    p = Math.max(0.02, Math.min(0.88, p));
    if(R() < p){
      c.outcome = 'acquitted';
      c.sentence = 0;
      c.note = 'Not guilty. You walked out of the building.';
    } else {
      c.outcome = 'convicted';
      /* you ran the trial and lost, so the discount is gone: that is the
         whole weight behind the plea decision */
      c.sentence = Math.max(0, Math.round(c.base * (1 - def.mitigate * 0.6)));
      c.note = 'The jury did not believe you.';
    }
  }
  c.stage = 'verdict';
  renderPopup();
}

function courtAppeal(){
  const c = S.legalCase; if(!c || c.appealed) return;
  const def = COUNSEL_BY(c.counsel);
  const cost = Math.round(9000 * (typeof country === 'function' ? country().col : 1));
  const pot = S.money + S.savings;
  if(pot < cost){ c.note = `An appeal costs ${money(cost)} and you cannot raise it.`; return renderPopup(); }
  const fromCash = Math.max(0, Math.min(S.money, cost));
  S.money -= fromCash; S.savings -= (cost - fromCash);
  ledger('spend', 'Appeal', cost);
  c.spent += cost; c.appealed = true;

  const p = 0.16 + def.acquit / 2 + (c.evidence < 45 ? 0.16 : 0) + LUCK() / 3;
  const r = R();
  if(r < p * 0.4){
    c.outcome = 'quashed'; c.sentence = 0;
    c.note = 'The conviction was quashed. It should never have been brought.';
  } else if(r < p){
    c.sentence = Math.max(0, Math.round(c.sentence * 0.5));
    c.note = 'The sentence was reduced on appeal.';
  } else {
    c.note = 'The appeal was refused, and it cost you.';
  }
  c.stage = 'verdict';
  renderPopup();
}

/* ---- applying it to the life ---- */
function courtFinish(){
  const c = S.legalCase;
  document.getElementById('modal').className = 'modal';
  if(!c){ drain(); return; }
  const sev = c.sentence >= 6 ? 3 : c.sentence >= 2 ? 2 : 1;

  if(c.outcome === 'acquitted' || c.outcome === 'quashed'){
    S.stats.reputation = clamp(S.stats.reputation - 4);
    S.stats.happiness  = clamp(S.stats.happiness + 6);
    logLine(`${c.name}: acquitted.`, 'good');
  } else if(c.sentence <= 0){
    S.money -= ri(200, 2000);
    S.stats.reputation = clamp(S.stats.reputation - 6);
    S.record.push({ crime:c.name, age:S.age, sev:1, spent:false });
    logLine(`${c.name}: fined.`, 'bad');
  } else {
    S.jailLeft = c.sentence;
    S.stats.reputation = clamp(S.stats.reputation - 15);
    S.record.push({ crime:c.name, age:S.age, sev, spent:false });
    if(S.job){ S.job = null; S.firedCount++; }
    logLine(`${c.name}: ${c.sentence} year${c.sentence > 1 ? 's' : ''}.`, 'bad');
  }
  S.legalCase = null;
  clampMinorMoney(); settleState(); checkAch(); checkGoals();
  save();
  drain();
}

/* ---- the screen ---- */
function courtSheet(){
  const c = S.legalCase;
  if(!c) return '<div class="sheet"><div class="ph">No case</div><div class="choices">'
    + '<button class="choice ok" onclick="courtFinish()"><span>Continue</span><i>\u203a</i></button></div></div>';
  const head = `<div class="phead"><span class="ptag">Court</span></div>`;
  const note = c.note ? `<div class="pb">${esc(c.note)}</div>` : '';

  if(c.stage === 'plea'){
    /* must match courtResolve(), or the screen promises one number and the
       court hands down another */
    const disc = Math.max(0, Math.round(c.base * 0.55));
    return `<div class="sheet">${head}
      <div class="ph">${esc(c.name)}</div>
      <div class="pb">The case against you is ${evidenceWord(c.evidence)}. If it goes against you
        the starting point is ${c.base} year${c.base === 1 ? '' : 's'}.</div>
      <div class="bt"><i class="${c.evidence > 62 ? 'r' : c.evidence > 40 ? 'a' : 'g'}" style="width:${c.evidence}%"></i></div>
      <div class="hsub dim">Evidence against you</div>
      ${note}
      <div class="choices">
        <button class="choice" onclick="courtPlead('guilty')"><span>Plead guilty
          <small class="dim"> \u00b7 about ${disc} year${disc === 1 ? '' : 's'}, less with good counsel</small></span><i>\u203a</i></button>
        <button class="choice" onclick="courtPlead('notguilty')"><span>Plead not guilty
          <small class="dim"> \u00b7 a trial, and no discount if you lose</small></span><i>\u203a</i></button>
      </div></div>`;
  }

  if(c.stage === 'counsel'){
    return `<div class="sheet">${head}
      <div class="ph">Who is representing you?</div>
      <div class="pb">You have ${money(S.money + S.savings)} to hand.</div>
      ${note}
      <div class="choices">${COUNSEL.map(x => {
        const cost = counselCost(x);
        const can = cost === 0 || (S.money + S.savings) >= cost;
        return `<button class="choice${can ? '' : ' dim'}" onclick="courtCounsel('${x.id}')">
          <span>${esc(x.n)} <small class="dim">\u00b7 ${cost ? money(cost) : 'free'}</small>
          <br><small class="dim">${esc(x.d)}</small></span><i>\u203a</i></button>`;
      }).join('')}</div></div>`;
  }

  /* verdict */
  const won = c.outcome === 'acquitted' || c.outcome === 'quashed';
  const line = won ? 'Not guilty'
    : c.sentence > 0 ? `${c.sentence} year${c.sentence > 1 ? 's' : ''} in prison`
    : 'A fine and a record';
  const canAppeal = !won && !c.appealed && c.sentence > 0;
  return `<div class="sheet">${head}
    <div class="ph">${esc(line)}</div>
    ${note}
    ${c.spent > 0 ? `<div class="hsub dim">Legal costs: ${money(c.spent)}</div>` : ''}
    <div class="choices">
      ${canAppeal ? `<button class="choice" onclick="courtAppeal()"><span>Appeal
        <small class="dim"> \u00b7 ${money(Math.round(9000 * (typeof country === 'function' ? country().col : 1)))}</small></span><i>\u203a</i></button>` : ''}
      <button class="choice ok" onclick="courtFinish()"><span>${won ? 'Go home' : 'Accept it'}</span><i>\u203a</i></button>
    </div></div>`;
}

/* Re-render the sheet in place without touching the queue. */
function renderPopup(){
  const el = document.getElementById('modal');
  el.className = 'modal show';
  el.innerHTML = courtSheet();
}

/* BEQUEST — somewhere to put money that is not a savings account.

   There was one investment in the game: crypto, whose price moved by up to
   forty per cent a year on a coin flip. Nothing else. Savings paid 2.5% and
   property was a separate system, so "investing" was a single lever with no
   decision in it beyond how much to pull.

   Six asset classes now, and the point of them is that they do not move
   together. Every year the market has a mood; each asset responds to it by
   its own beta and then adds noise of its own. Gold has a negative beta, so
   it is the only thing that goes up in a bad year, and bonds barely notice.
   That makes a spread of holdings genuinely different from one big bet,
   which is the only reason a portfolio is interesting.                     */

const ASSETS = [
  { id:'bonds',  n:'Government bonds',  mean:0.031, sd:0.045, beta:0.10, min:500,
    d:'Dull, and that is the entire point of them.' },
  { id:'index',  n:'An index fund',     mean:0.072, sd:0.150, beta:1.00, min:500,
    d:'The whole market at once, for a very small fee.' },
  { id:'reit',   n:'A property fund',   mean:0.058, sd:0.175, beta:0.75, min:2000,
    d:'Bricks, at one remove, without the tenants.' },
  { id:'shares', n:'Individual shares', mean:0.086, sd:0.320, beta:1.30, min:1000,
    d:'You will be certain you have picked well. Some of you will be right.' },
  { id:'em',     n:'Emerging markets',  mean:0.098, sd:0.290, beta:1.55, min:1000,
    d:'Growth, interrupted.' },
  { id:'gold',   n:'Gold',              mean:0.022, sd:0.150, beta:-0.35, min:1000,
    d:'Does nothing for years, then everything in one of them.' }
];
const ASSET = id => ASSETS.find(a => a.id === id) || ASSETS[0];

function investBirth(s){
  s.holdings = {};
  s.market = { last:0, year:0 };
  s.investIn = 0;      /* everything ever put in  */
  s.investOut = 0;     /* everything ever taken out */
}
function investMigrate(s){
  if(!s.holdings) s.holdings = {};
  if(!s.market) s.market = { last:0, year:0 };
  if(s.investIn == null) s.investIn = 0;
  if(s.investOut == null) s.investOut = 0;
}

function holdingsValue(s){
  s = s || S;
  return Object.keys(s.holdings || {}).reduce((n, k) => n + (s.holdings[k] || 0), 0);
}
function holdingOf(s, id){ return Math.round((s.holdings || {})[id] || 0); }

/* A normal-ish draw without needing a library. */
function gauss(){ return ((R() + R() + R() + R() + R() + R()) - 3) / 1.2; }

/* One year of markets. Returns notes worth telling the player about. */
function tickInvest(s, notes){
  s = s || S;
  investMigrate(s);
  /* The market's mood, with the occasional bad year that is much worse than
     the spread alone would ever produce. */
  let mkt = gauss() * 0.13;
  if(R() < 0.055) mkt = -0.22 - R() * 0.26;          /* a crash */
  else if(R() < 0.05) mkt = 0.20 + R() * 0.18;       /* a run */
  mkt += (typeof newsMod === 'function' ? newsMod('crypto') * 0.3 : 0);
  s.market.last = mkt;
  s.market.year = s.age;

  const held = Object.keys(s.holdings).filter(k => s.holdings[k] > 0);
  if(!held.length) return;

  let before = 0, after = 0;
  held.forEach(id => {
    const a = ASSET(id);
    const r = a.mean + a.beta * mkt + gauss() * a.sd * 0.55;
    before += s.holdings[id];
    s.holdings[id] = Math.max(0, s.holdings[id] * (1 + r));
    after += s.holdings[id];
  });
  const pct = before > 0 ? (after - before) / before : 0;
  if(notes && Math.abs(pct) >= 0.06)
    notes.push(`Your investments ${pct > 0 ? 'gained' : 'lost'} ${money(Math.abs(Math.round(after - before)))} `
      + `(${pct > 0 ? '+' : '\u2212'}${Math.abs(pct * 100).toFixed(0)}%).`);
  if(mkt <= -0.22 && notes) notes.push('The markets had a very bad year.');
}

/* ---- buying and selling ---- */
function investBuy(id, amount){
  const a = ASSET(id);
  amount = Math.round(amount);
  if(S.age < 18) return popupOK('Too young', 'You need to be 18 to invest.');
  if(amount < a.min) return popupOK('Below the minimum', `${a.n} takes ${money(a.min)} or more.`);
  if(!afford(amount)) return;
  charge(amount); ledger('spend', a.n, amount);
  S.holdings[id] = (S.holdings[id] || 0) + amount;
  S.investIn += amount;
  S.flags.invests = true;
  cue('moneyOut', 'light');
  save(); renderAll();
}
function investSell(id, part){
  const a = ASSET(id);
  const have = S.holdings[id] || 0;
  if(have <= 0) return;
  const take = part >= 1 ? have : have * part;
  const got = Math.round(take);
  S.holdings[id] = have - take;
  if(S.holdings[id] < 1) delete S.holdings[id];
  S.money += got; S.investOut += got;
  ledger('earn', 'Sold ' + a.n.toLowerCase(), got);
  cue('moneyIn', 'light');
  popupOK('Sold', `You sold ${money(got)} of ${a.n.toLowerCase()}.`);
  save(); renderAll();
}
function investPick(id){
  const a = ASSET(id);
  const steps = [a.min, a.min * 4, a.min * 20].filter(v => v <= S.money);
  if(!steps.length) return popupOK('Not enough', `${a.n} takes ${money(a.min)} or more, and you have ${money(S.money)}.`);
  if(S.money >= a.min) steps.push(-1);   /* everything */
  chooseFrom(`How much into ${a.n.toLowerCase()}?`,
    steps.map(v => [v === -1 ? `Everything you have \u00b7 ${money(S.money)}` : money(v), 0, String(v)]),
    (label, v) => investBuy(id, +v === -1 ? S.money : +v));
}

/* How spread out the money is, 0 (one bet) to 1 (evenly across everything). */
function spread(s){
  s = s || S;
  const vals = ASSETS.map(a => (s.holdings || {})[a.id] || 0);
  const tot = vals.reduce((n, v) => n + v, 0);
  if(tot <= 0) return 0;
  const shares = vals.map(v => v / tot);
  const hhi = shares.reduce((n, x) => n + x * x, 0);      /* 1 = all in one */
  const best = 1 / ASSETS.length;
  return Math.max(0, Math.min(1, (1 - hhi) / (1 - best)));
}

/* ---- the screen ---- */
function moneyInvest(){
  if(S.age < 18) return '<div class="card"><div class="muted">Investing opens at 18.</div></div>';
  investMigrate(S);
  const tot = holdingsValue(S);
  const m = S.market.last || 0;
  const mood = m <= -0.22 ? 'a very bad year' : m < -0.06 ? 'a poor year'
    : m > 0.18 ? 'a very good year' : m > 0.05 ? 'a good year' : 'a flat year';

  const rows = ASSETS.map(a => {
    const held = holdingOf(S, a.id);
    return `<div class="npc"><div class="npcline"><div>
        <div class="rn">${esc(a.n)}</div>
        <div class="hsub dim">${esc(a.d)}</div></div>
        <div class="hsub"><b>${held ? money(held) : '\u2014'}</b></div></div>
      <div class="hsub dim">typical ${(a.mean * 100).toFixed(1)}% a year \u00b7 ${
        a.sd > 0.25 ? 'very volatile' : a.sd > 0.15 ? 'volatile' : a.sd > 0.08 ? 'steady' : 'very steady'}${
        a.beta < 0 ? ' \u00b7 rises when the market falls' : ''}</div>
      <div class="nact"><button onclick="investPick('${a.id}')">Buy</button>
        ${held ? `<button onclick="investSell('${a.id}',0.5)">Sell half</button>
                  <button onclick="investSell('${a.id}',1)">Sell all</button>` : ''}</div></div>`;
  }).join('');

  const sp = spread(S);
  const gain = S.investOut + tot - S.investIn;
  return `<div class="card"><div class="ctrow"><div class="ct">Your portfolio</div>
      <div class="hsub dim">${money(tot)}</div></div>
    ${tot > 0 ? `<div class="kv"><span>Put in over your life</span><b>${money(S.investIn)}</b></div>
      <div class="kv"><span>Taken out</span><b>${money(S.investOut)}</b></div>
      <div class="kv"><span>Ahead by</span><b class="${gain >= 0 ? 'g' : 'bad'}">${gain >= 0 ? '' : '\u2212'}${money(Math.abs(gain))}</b></div>
      <div class="kv"><span>Spread across</span><b>${Math.round(sp * 100)}%</b></div>
      <div class="bt"><i class="${sp > 0.6 ? 'g' : sp > 0.3 ? 'a' : 'r'}" style="width:${Math.round(sp * 100)}%"></i></div>
      <div class="hsub dim">${sp > 0.6 ? 'Well spread. A bad year in one thing will not take the lot.'
        : sp > 0.3 ? 'Somewhat concentrated.'
        : 'Almost all of it is in one thing.'}</div>`
      : '<div class="hsub dim">You hold nothing. Savings pay 2.5% and inflation does not care.</div>'}
    <div class="hsub dim mt">The market has just had ${mood}.</div></div>
  <div class="card"><div class="ct">What you can buy</div>${rows}</div>
  <div class="card"><div class="ct">Crypto</div>
    <div class="kv"><span>Holding</span><b>${money(cryptoValue())} <small class="dim">@ ${money(S.crypto.price)}</small></b></div>
    <div class="grid3 mt">
      <button class="mini" onclick="fin('buyc')">Buy $2k</button>
      <button class="mini" onclick="fin('sellc')">Sell all</button>
    </div></div>`;
}

/* BEQUEST — being ill somewhere.

   Treating a condition was one button: pay the money, the condition becomes
   managed, done. The country you live in changed the price and nothing else,
   so a strong public health service was pure upside — cheaper care, no cost
   anywhere. That is not what living under one is like.

   The trade-off is time. `country().med` is a price multiplier in the data,
   and a low one means the state is paying, which means you wait. A high one
   means you are paying, which means you are seen on Thursday. So:

     public   free, or nearly, and a wait measured in years
     mixed    some of both
     private  no wait at all, and it costs what it costs

   On top of that: a specialist, who improves the odds of actually beating
   the thing rather than managing it, and rehabilitation afterwards, which is
   dull, takes years, and is the difference between recovering and coping.  */

function healthSystem(){
  const m = (typeof country === 'function' ? country().med : 1);
  if(m <= 0.40) return { id:'public',  n:'the health service', wait:[1,4], pay:0.0,  self:1.9 };
  if(m >= 0.85) return { id:'private', n:'a private system',   wait:[0,0], pay:1.0,  self:1.0 };
  return              { id:'mixed',   n:'a mixed system',     wait:[0,2], pay:0.45, self:1.4 };
}
function healthMigrate(s){
  (s.conditions || []).forEach(k => {
    if(k.waiting === undefined)   k.waiting = 0;    /* age the appointment lands */
    if(k.specialist === undefined)k.specialist = false;
    if(k.rehab === undefined)     k.rehab = 0;
  });
}

function condCost(k, selfPay){
  const c = COND(k.id); if(!c) return 0;
  const sys = healthSystem();
  const mul = selfPay ? sys.self : sys.pay;
  const ins = hasItem('insurance') ? 0.45 : 1;
  return Math.max(0, Math.round(c.cost * (typeof country === 'function' ? country().med : 1) * mul * ins * k.sev / c.sev));
}
function waitYears(k){
  const sys = healthSystem();
  if(sys.wait[1] === 0) return 0;
  /* the worse it is, the sooner they see you */
  const urgency = k.sev >= 3 ? 2 : k.sev === 2 ? 1 : 0;
  return Math.max(0, ri(sys.wait[0], sys.wait[1]) - urgency);
}

/* ---- the four things you can do about it ---- */
function treatJoin(id){
  const k = (S.conditions || []).find(x => x.id === id); if(!k) return;
  const cost = condCost(k, false);
  if(cost > 0 && !afford(cost)) return;
  if(cost > 0){ charge(cost); ledger('spend', 'Treatment', cost); }
  const w = waitYears(k);
  if(w <= 0){
    applyTreatment(k, false);
  } else {
    k.waiting = S.age + w;
    cue('open', 'light');
    popupOK('On the list',
      `You have been referred. The wait for ${COND(k.id).n.toLowerCase()} is about ${w} year${w > 1 ? 's' : ''}.`
      + `\n\nIt will carry on as it is until then.`);
  }
  save(); renderAll();
}
function treatPrivate(id){
  const k = (S.conditions || []).find(x => x.id === id); if(!k) return;
  const cost = condCost(k, true);
  if(!afford(cost)) return;
  charge(cost); ledger('spend', 'Private treatment', cost);
  k.waiting = 0;
  applyTreatment(k, true);
  save(); renderAll();
}
function seeSpecialist(id){
  const k = (S.conditions || []).find(x => x.id === id); if(!k) return;
  if(k.specialist) return popupOK('Already under a specialist', 'You are already being seen by one.');
  const cost = Math.round(2600 * (typeof country === 'function' ? country().med : 1)
                          * healthSystem().self * (hasItem('insurance') ? 0.5 : 1));
  if(!afford(cost)) return;
  charge(cost); ledger('spend', 'Specialist', cost);
  k.specialist = true;
  applyEff({ happiness: 3 });
  popupOK('A specialist', `Somebody who has seen a thousand of these is now looking at yours. `
    + `It roughly doubles the chance of beating it rather than living with it.`);
  save(); renderAll();
}
function doRehab(id){
  const k = (S.conditions || []).find(x => x.id === id); if(!k) return;
  if(!k.treated) return popupOK('Not yet', 'Rehabilitation comes after treatment.');
  const cost = Math.round(1400 * (typeof country === 'function' ? country().med : 1) * healthSystem().pay);
  if(cost > 0 && !afford(cost)) return;
  if(cost > 0){ charge(cost); ledger('spend', 'Rehabilitation', cost); }
  k.rehab = (k.rehab || 0) + 1;
  const c = COND(k.id);
  S.stats.health = clamp(S.stats.health + 4 + k.sev * 2);
  applyEff({ discipline: 4, happiness: -2 });
  let t = `Another year of it. Dull, repetitive, and your ${c.n.toLowerCase()} is easier to live with for it.`;
  if(k.rehab >= 2 && k.sev > 1){ k.sev--; t += `\n\nThe severity has come down to ${k.sev}/3.`; }
  popupOK('Rehabilitation', t);
  save(); renderAll();
}

/* Treatment landing, from the waiting list or from paying. */
function applyTreatment(k, wasPrivate){
  const c = COND(k.id); if(!c) return;
  k.treated = true;
  k.waiting = 0;
  S.stats.health = clamp(S.stats.health + c.sev * 3 + (wasPrivate ? 2 : 0));
  let cure = c.cure * (k.specialist ? 2 : 1);
  if(!c.chronic && R() < cure){
    S.conditions = S.conditions.filter(x => x !== k);
    S.counters.illnessesBeaten++;
    logLine(`Recovered from ${c.n}.`, 'good');
    cue('good', 'medium');
    popupOK('Treated', `You have fully recovered from ${c.n.toLowerCase()}.`
      + (k.specialist ? '\n\nThe specialist made the difference.' : ''));
    return;
  }
  cue('good', 'light');
  popupOK('Treated', `Your ${c.n.toLowerCase()} is being managed. Its effects are reduced by about two thirds.`
    + (c.chronic ? '\n\nIt will not go away, but it is under control.' : ''));
}

/* One year: waiting lists move, and waiting has a cost. */
function tickHealth(s, notes){
  s = s || S;
  healthMigrate(s);
  (s.conditions || []).forEach(k => {
    if(!k.waiting) return;
    if(s.age >= k.waiting){
      k.waiting = 0; k.treated = true;
      const c = COND(k.id);
      s.stats.health = clamp(s.stats.health + (c ? c.sev * 3 : 3));
      if(c && !c.chronic && R() < c.cure * (k.specialist ? 2 : 1)){
        s.conditions = s.conditions.filter(x => x !== k);
        s.counters.illnessesBeaten++;
        if(notes) notes.push(`Your ${c.n.toLowerCase()} was treated at last, and it has gone.`);
      } else if(notes && c){
        notes.push(`Your appointment for ${c.n.toLowerCase()} finally came round.`);
      }
    } else if(notes && R() < 0.3){
      notes.push(`Still waiting to be seen about your ${(COND(k.id) || {n:'condition'}).n.toLowerCase()}.`);
    }
  });
}

/* ---- the card ---- */
function healthCard(){
  const list = S.conditions || [];
  if(!list.length) return '';
  const sys = healthSystem();
  const rows = list.map(k => {
    const c = COND(k.id); if(!c) return '';
    const waiting = k.waiting && S.age < k.waiting;
    const status = waiting ? `waiting until ${k.waiting}`
      : k.treated ? 'managed' : 'untreated';
    const pub = condCost(k, false), priv = condCost(k, true);
    return `<div class="npc"><div class="npcline"><div>
        <div class="rn">${esc(c.n)}${k.specialist ? ' <span class="award t1">specialist</span>' : ''}</div>
        <div class="hsub dim">severity ${k.sev}/3 \u00b7 ${status}${k.rehab ? ` \u00b7 ${k.rehab} year${k.rehab > 1 ? 's' : ''} of rehab` : ''}</div>
      </div></div>
      <div class="nact">
        ${(!k.treated && !waiting) ? `<button onclick="treatJoin('${k.id}')">${
            sys.wait[1] ? `Get referred${pub ? ' \u00b7 ' + money(pub) : ' \u00b7 free'}` : `Treat it \u00b7 ${money(pub)}`}</button>` : ''}
        ${(waiting || !k.treated) ? `<button onclick="treatPrivate('${k.id}')">Go private \u00b7 ${money(priv)}</button>` : ''}
        ${!k.specialist ? `<button onclick="seeSpecialist('${k.id}')">See a specialist</button>` : ''}
        ${k.treated ? `<button onclick="doRehab('${k.id}')">Rehabilitation</button>` : ''}
      </div></div>`;
  }).join('');
  return `<div class="card"><div class="ctrow"><div class="ct">Your health</div>
      <div class="hsub dim">${esc(sys.n)}</div></div>
    ${sys.id === 'public' ? '<div class="hsub dim">Treatment is free here. The wait is the price.</div>'
      : sys.id === 'private' ? '<div class="hsub dim">No waiting here. You pay for all of it.</div>'
      : '<div class="hsub dim">Some of it is covered. The rest is yours, and there is still a wait.</div>'}
    ${rows}</div>`;
}

/* BEQUEST — knowing when something broke.

   The game had no global error handler. A thrown error anywhere outside the
   fourteen local try/catch blocks left the screen frozen with no message, and
   the player had no way to tell anyone what happened. The try/catch blocks
   themselves were worse in their way: a save that failed to write, a corrupt
   load, an achievement predicate that threw — all swallowed in silence, for
   years potentially, because nothing ever looked.

   This records both, on the device, and goes nowhere.

   DELIBERATELY NO TRANSPORT. crashSink() is the single seam a destination
   plugs into later — an endpoint, Crashlytics, Sentry, whatever is chosen.
   Until one exists, reports stay in localStorage and the only way anything
   leaves the phone is the player pressing Copy. Sending is gated on an
   explicit opt-in that defaults to off, so the claim that the game collects
   nothing stays true as written.

   WHAT A REPORT MAY NOT CONTAIN: the player's name, any NPC's name, their
   employer, school or manager, any log line, or the save. A life is
   described by its shape — age, country, difficulty, what was on screen,
   what they had just done — which is enough to reproduce nearly everything
   and is not about anybody. There is a test that puts a distinctive name in
   the save and fails if it appears anywhere in a report.                   */

const CRASH_KEY = 'bequest.crashlog';
const CRASH_MAX = 12;             /* a ring buffer; old reports fall off   */
const CRASH_STACK_LINES = 12;

let CRASH_ACTS = [];              /* the last few things the player did    */
let CRASH_POPUP = null;           /* what was on screen when it went wrong */
let CRASH_LAST = null;            /* most recent report, for the screen    */
let CRASH_INSTALLED = false;

/* ---- the seam ----
   Returns false because nothing is wired up. A destination replaces the
   body of this one function and honours crashOptIn(). */
function crashSink(report){ return false; }
function crashOptIn(){ return !!(typeof META !== 'undefined' && META && META.crashOptIn); }
function setCrashOptIn(v){
  if(typeof META === 'undefined' || !META) return;
  META.crashOptIn = !!v;
  if(typeof saveMeta === 'function') saveMeta();
  if(typeof renderAll === 'function') renderAll();
}

/* ---- context: the shape of the life, never the life ---- */
function moneyBand(n){
  n = Number(n) || 0;
  const a = Math.abs(n);
  const b = a < 100 ? '0' : a < 1000 ? '<1k' : a < 10000 ? '1k-10k'
          : a < 100000 ? '10k-100k' : a < 1000000 ? '100k-1m' : '1m+';
  return (n < 0 ? '-' : '') + b;
}
function crashContext(){
  const s = (typeof S !== 'undefined') ? S : null;
  const ctx = {
    acts: CRASH_ACTS.slice(-6),
    popup: CRASH_POPUP
  };
  if(!s) return ctx;
  try{
    ctx.age    = s.age;
    ctx.alive  = !!s.alive;
    ctx.gen    = s.gen;
    ctx.country= s.country;                       /* a country, not an address */
    ctx.diff   = s.diff;
    ctx.edu    = s.edu;
    ctx.job    = s.job ? s.job.field : null;      /* the field, not the title  */
    ctx.money  = moneyBand(s.money);
    ctx.worth  = moneyBand(typeof netWorth === 'function' ? netWorth() : 0);
    ctx.npcs   = (s.npcs || []).length;
    ctx.kids   = (s.npcs || []).filter(n => n.rel === 'child').length;
    ctx.conds  = (s.conditions || []).map(k => k.id);
    ctx.flags  = Object.keys(s.flags || {}).filter(k => s.flags[k]).slice(0, 14);
    /* the tab lives on the DOM, not the save */
    ctx.screen = (typeof document !== 'undefined' && document.getElementById
                  && document.getElementById('app') && document.getElementById('app').dataset)
                 ? (document.getElementById('app').dataset.tab || null) : null;
    ctx.section= s.section || s.msection || null;
    ctx.actionsLeft = s.actionsLeft;
    ctx.inSchool = !!s.inSchool;
    ctx.jail   = s.jailLeft || 0;
    ctx.case   = s.legalCase ? s.legalCase.stage : null;
    ctx.holds  = Object.keys(s.holdings || {});
    /* log KINDS only: the text has names in it */
    ctx.recent = (s.log || []).slice(-6).map(l => ({ a: l.a, k: l.k || '' }));
    ctx.queue  = (typeof QUEUE !== 'undefined' && QUEUE) ? QUEUE.map(p => p.type) : [];
  }catch(e){ ctx.ctxError = String(e && e.message || e); }
  return ctx;
}

function trimStack(stack){
  return String(stack || '').split('\n').slice(0, CRASH_STACK_LINES)
    .map(l => l.trim().replace(/https?:\/\/[^\s)]+/g, m => m.split('/').pop()))
    .join('\n');
}

/* ---- recording ---- */
function crashLog(){
  try{ return JSON.parse(localStorage.getItem(CRASH_KEY) || '[]') || []; }
  catch(e){ return []; }
}
function crashSave(list){
  try{ localStorage.setItem(CRASH_KEY, JSON.stringify(list.slice(-CRASH_MAX))); }catch(e){}
}
function crashClear(){ try{ localStorage.removeItem(CRASH_KEY); }catch(e){} CRASH_LAST = null; }

function recordCrash(kind, where, message, stack){
  const report = {
    v: (typeof APP_VERSION !== 'undefined' ? APP_VERSION : '1.0.0'),
    at: Date.now(),
    kind: kind,
    where: String(where || ''),
    msg: String(message || '').slice(0, 300),
    stack: trimStack(stack),
    ctx: crashContext()
  };
  CRASH_LAST = report;
  const list = crashLog(); list.push(report); crashSave(list);
  /* nothing leaves the device unless a destination exists AND they said yes */
  if(crashOptIn()){ try{ crashSink(report); }catch(e){} }
  return report;
}

/* A failure that does not throw its way to the top: a save that would not
   write, an achievement predicate that blew up, a corrupt load. These were
   all swallowed by bare catch blocks. */
function softFail(where, err, extra){
  try{
    const msg = (err && err.message) ? err.message : String(err == null ? (extra || 'failed') : err);
    return recordCrash('soft', where, msg, err && err.stack);
  }catch(e){ return null; }
}

/* ---- what the player sees ---- */
function crashReportText(r){
  r = r || CRASH_LAST || crashLog().slice(-1)[0];
  if(!r) return 'No problems have been recorded.';
  const c = r.ctx || {};
  return [
    'Bequest ' + r.v + '  ' + r.kind,
    'where: ' + r.where,
    r.msg,
    '',
    r.stack,
    '',
    'age ' + c.age + '  gen ' + c.gen + '  ' + c.country + '  ' + c.diff,
    'screen ' + c.screen + '/' + c.section + '  popup ' + c.popup,
    'did: ' + (c.acts || []).join(' > '),
    'queue: ' + (c.queue || []).join(',') + '  actions ' + c.actionsLeft,
    'money ' + c.money + '  worth ' + c.worth + '  npcs ' + c.npcs + '  conds ' + (c.conds || []).join(',')
  ].join('\n');
}

/* The house quality bar: "No backend details in user-facing errors: friendly
   message client-side; full details (stack traces, connection strings,
   internal hosts) logged server-side only; exposure is a UX fail and a
   security vulnerability." So the screen shows what went wrong in words and
   the stack travels only via Copy. */
function crashSummary(r){
  r = r || CRASH_LAST || crashLog().slice(-1)[0];
  if(!r) return 'Nothing has gone wrong.';
  const c = r.ctx || {};
  const what = r.kind === 'soft' ? 'A background task failed' : 'The game stopped responding';
  return `${what} while you were ${c.screen ? 'on the ' + c.screen + ' screen' : 'playing'}`
    + (c.age != null ? `, at ${c.age}` : '') + '.';
}
function crashCopy(){
  const t = crashReportText();
  try{
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t);
    else {
      const ta = document.createElement('textarea');
      ta.value = t; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
    }
    if(typeof popupOK === 'function') popupOK('Copied', 'The report is on your clipboard.');
  }catch(e){
    if(typeof popupOK === 'function') popupOK('Could not copy', t);
  }
}

function crashScreen(){
  const el = (typeof document !== 'undefined') ? document.getElementById('modal') : null;
  if(!el) return;
  el.className = 'modal show';
  el.innerHTML = `<div class="sheet">
    <div class="phead"><span class="ptag">Something went wrong</span></div>
    <div class="ph">That was not supposed to happen</div>
    <div class="pb">The game hit a problem. Your save is untouched \u2014 it was written at the
      start of the year and nothing since has been committed. You can carry on.</div>
    <div class="pb">If it keeps happening, Copy the report and send it on. It describes the
      shape of this life \u2014 age, country, what was on screen \u2014 and contains no names and
      no save.</div>
    <div class="crashsum">${esc(crashSummary())}</div>
    <div class="choices">
      <button class="choice" onclick="crashCopy()"><span>Copy the report</span><i>\u203a</i></button>
      <button class="choice ok" onclick="closePopup()"><span>Carry on</span><i>\u203a</i></button>
    </div></div>`;
}

/* ---- installation ---- */
function noteAct(id){ CRASH_ACTS.push(String(id)); if(CRASH_ACTS.length > 12) CRASH_ACTS.shift(); }
function notePopup(p){
  try{ CRASH_POPUP = p ? (p.type + (p.ev ? ':' + p.ev.id : '')) : null; }catch(e){ CRASH_POPUP = null; }
}

function installCrashHandlers(){
  if(CRASH_INSTALLED) return;
  if(typeof window === 'undefined' || !window || !window.addEventListener) return;
  CRASH_INSTALLED = true;
  window.addEventListener('error', ev => {
    try{
      recordCrash('error', (ev.filename || '').split('/').pop() + ':' + (ev.lineno || 0),
        ev.message, ev.error && ev.error.stack);
      crashScreen();
    }catch(e){}
  });
  window.addEventListener('unhandledrejection', ev => {
    try{
      const r = ev.reason;
      recordCrash('promise', 'promise', (r && r.message) || String(r), r && r.stack);
    }catch(e){}
  });
}

/* BEQUEST — the half of the admin console that lives inside the game.

   The console itself is pwa/admin/. This file is what it acts through:
   redeem codes, broadcasts, and forced events. It is in the game bundle
   because the game has to honour these things; the console is a separate
   page and is never shipped inside the app.

   HONEST LIMITS, because the quality bar is explicit about this:

   - A code is verified against a secret that is inside the bundle. Anyone
     who unpacks the APK can read it and mint their own codes. That is
     unavoidable for an offline game and it is why codes here grant only
     cosmetic and convenience things, never anything that costs money to
     produce. Plus is deliberately NOT grantable by code.
   - The console's passphrase is a speed bump on a device the owner already
     controls, not an authorisation boundary. If remote mode is ever pointed
     at a real server, that server must do its own authorisation and must
     not trust anything this page says.                                    */

const CODE_SECRET = 'bequest-v1-code-salt';
const CODE_GRANTS = {
  lp:   { n:'Legacy Points', apply:(v)=>{ META.lp = (META.lp||0) + v; } },
  perk: { n:'A perk',        apply:(v)=>{ META.perks = META.perks||{}; META.perks[v] = true; } },
  egg:  { n:'An easter egg', apply:(v)=>{ META.eggs = META.eggs||{}; if(!META.eggs[v]) META.eggs[v] = {age:0,life:META.lives||0,at:Date.now()}; } }
};

/* A short, readable, offline-verifiable code: TYPE-VALUE-CHECK */
function codeHash(body){
  let h = 2166136261;
  const s = body + '|' + CODE_SECRET;
  for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h.toString(36).toUpperCase().slice(0, 4).padStart(4, '0');
}
function makeCode(type, value){
  const body = String(type).toUpperCase() + '-' + String(value).toUpperCase();
  return body + '-' + codeHash(body);
}
function readCode(code){
  const parts = String(code || '').trim().toUpperCase().split('-');
  if(parts.length !== 3) return null;
  const body = parts[0] + '-' + parts[1];
  if(codeHash(body) !== parts[2]) return null;
  const type = parts[0].toLowerCase();
  if(!CODE_GRANTS[type]) return null;
  return { type, raw: parts[1] };
}

function redeemCode(code){
  const parsed = readCode(code);
  if(!parsed) return popupOK('Not a valid code', 'Check it and try again.');
  META.redeemed = META.redeemed || {};
  const key = String(code).trim().toUpperCase();
  if(META.redeemed[key]) return popupOK('Already used', 'That code has been redeemed on this device.');
  const g = CODE_GRANTS[parsed.type];
  const value = parsed.type === 'lp' ? Math.max(0, Math.min(100000, parseInt(parsed.raw, 36) || 0))
                                     : parsed.raw.toLowerCase();
  g.apply(value);
  META.redeemed[key] = Date.now();
  saveMeta();
  cue('ach', 'medium');
  popupOK('Redeemed', `${g.n}: ${value}.`);
  renderAll();
}

/* ---- broadcasts ---- */
function broadcast(){ return (META.broadcast && META.broadcast.text) ? META.broadcast : null; }
function setBroadcast(text, until){
  META.broadcast = text ? { text: String(text).slice(0, 240), until: until || 0, seen: false } : null;
  saveMeta();
}
function dismissBroadcast(){ if(META.broadcast){ META.broadcast.seen = true; saveMeta(); renderAll(); } }
function broadcastCard(){
  const b = broadcast();
  if(!b || b.seen) return '';
  if(b.until && Date.now() > b.until) return '';
  return `<div class="card tip coach"><div class="ctrow"><div class="ct">A note from the developer</div></div>
    <div class="hsub">${esc(b.text)}</div>
    <div class="row mt"><button class="btn" onclick="dismissBroadcast()">Got it</button></div></div>`;
}

/* ---- forced events, for reproducing a report ---- */
function forceEvent(id){
  const ev = EVENTS.find(e => e.id === id);
  if(!ev) return false;
  META.forced = META.forced || [];
  if(META.forced.indexOf(id) < 0) META.forced.push(id);
  saveMeta();
  return true;
}
function clearForced(){ META.forced = []; saveMeta(); }
/* drained by ageUp before the random draw */
function takeForced(){
  const list = (META.forced || []).slice();
  if(!list.length) return [];
  META.forced = []; saveMeta();
  return list.map(id => EVENTS.find(e => e.id === id)).filter(Boolean);
}

/* ---- flags, the local equivalent of a ban ---- */
function flagSave(slot, reason){
  META.flags = META.flags || {};
  META.flags[slot] = reason ? { reason: String(reason).slice(0, 120), at: Date.now() } : null;
  if(!reason) delete META.flags[slot];
  saveMeta();
}
function saveFlag(slot){ return (META.flags || {})[slot] || null; }

/* BEQUEST — reachable without a touchscreen or a working pair of eyes.

   The quality bar is blunt about this: "Treat accessibility as a compliance
   requirement: non-compliance is a legal liability; AI tools do not ship
   accessible output by default, so explicitly ask for it." Before this file
   the whole 742 KB bundle carried one aria attribute and no roles at all: a
   five-item tab bar that announced nothing, toggle switches that read as
   plain buttons, and modal sheets a screen reader could walk straight past.

   Four things are fixed here, and each is a specific line in that bar.

     tabs       Arrows move, Home and End jump, Tab leaves the strip.
                Roving tabindex, so the bar is one stop and not five.
     switches   role=switch with aria-checked, so the state is spoken
                rather than inferred from the tick glyph.
     dialogs    role=dialog, focus moves in and comes back out to whatever
                opened it, Escape closes anything dismissible, and focus
                cannot wander behind the sheet.
     speech     A polite live region, so the year's news is heard instead
                of silently appearing.

   The focus ring is deliberately not the same as the selected state. The
   bar calls that out and it is the mistake that makes keyboard use feel
   broken even when it works.                                             */

const TAB_ORDER = ['life','act','ppl','money'];

/* The game also runs headless, in the test harness and in the research
   tools, where document is a stub with only the handful of methods those
   tools needed. Accessibility work must never be the reason a simulated
   life cannot run, so every entry point checks for the DOM it uses rather
   than assuming one. */
function domReady(){
  return typeof document !== 'undefined' && document
    && typeof document.querySelector === 'function'
    && typeof document.querySelectorAll === 'function';
}
let LAST_FOCUS = null;

function a11yTabs(){
  if(!domReady()) return;
  const nav = document.querySelector('nav.nav');
  if(!nav || nav.dataset.a11y) return;
  nav.dataset.a11y = '1';
  nav.addEventListener('keydown', e => {
    const btns = Array.from(nav.querySelectorAll('[role="tab"]'));
    const here = btns.indexOf(document.activeElement);
    if(here < 0) return;
    let to = -1;
    if(e.key === 'ArrowRight' || e.key === 'ArrowDown') to = (here + 1) % btns.length;
    else if(e.key === 'ArrowLeft' || e.key === 'ArrowUp') to = (here - 1 + btns.length) % btns.length;
    else if(e.key === 'Home') to = 0;
    else if(e.key === 'End') to = btns.length - 1;
    else return;
    e.preventDefault();
    btns[to].focus();
    const t = btns[to].dataset.t;
    if(t && typeof setTab === 'function') setTab(t);
  });
}

/* setTab() paints .on; the roles have to follow it or the bar lies. */
function a11ySyncTabs(active){
  if(!domReady()) return;
  const nav = document.querySelector('nav.nav');
  if(!nav) return;
  nav.querySelectorAll('[role="tab"]').forEach(b => {
    const on = b.dataset.t === active;
    b.setAttribute('aria-selected', on ? 'true' : 'false');
    b.tabIndex = on ? 0 : -1;
  });
  const main = document.getElementById('main');
  if(main) main.setAttribute('aria-labelledby', 'tab-' + active);
}

  el.textContent = '';

/* ---- dialogs ---- */
function a11yDialogOpen(label){
  if(!domReady()) return;
  const m = document.getElementById('modal');
  if(!m) return;
  if(document.activeElement && document.activeElement !== document.body)
    LAST_FOCUS = document.activeElement;
  m.setAttribute('aria-label', label || 'Message');
  /* the first real control in the sheet, so a keyboard lands inside it */
  const first = m.querySelector('button, [href], input, select, textarea');

  if(!domReady()) return;

/* Escape closes anything that can be dismissed, and focus cannot leave an
   open sheet by tabbing behind it. */
function a11yGlobalKeys(){
  if(!domReady() || !document.body) return;
  if(document.body.dataset.a11yKeys) return;
  document.body.dataset.a11yKeys = '1';
  document.addEventListener('keydown', e => {
    const m = document.getElementById('modal');
    const open = m && m.className.indexOf('show') >= 0;
    if(!open) return;
    if(e.key === 'Escape'){
      /* only if there is a way out that is not a decision */
      const outs = Array.from(m.querySelectorAll('button')).filter(b =>
        /continue|close|got it|carry on|not now|cancel|ok\b|put it away|\u2026/i.test(b.textContent || ''));
      if(outs.length){ e.preventDefault(); outs[outs.length - 1].click(); }
      return;
    }
    if(e.key !== 'Tab') return;
    const f = Array.from(m.querySelectorAll('button, [href], input, select, textarea'))
      .filter(x => !x.disabled && x.offsetParent !== null);
    if(!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    else if(f.indexOf(document.activeElement) < 0){ e.preventDefault(); first.focus(); }
  });
}

  if(!domReady()) return;
  a11yTabs();
  a11yGlobalKeys();
  a11ySwitches();
  a11yAgeHint();
}

/* BEQUEST — one language today, any language later.

   The roadmap asked for this to be planned "before the library reaches 500
   events". It reached 533 first, so this is late, and the measurement is
   the point of it: 3,197 strings and 19,443 words, of which 91% is the
   event library. About £1,900 a language at trade rates.

   THE DESIGN, AND WHY IT IS NOT t('some.key')

   The obvious approach is to wrap every string in a call with an invented
   id. That would mean editing 533 events, inventing 3,197 ids, and living
   with the certainty that an id and its string eventually drift apart. It
   would also put a function call in the middle of prose that has been
   tuned line by line.

   Instead the catalogue is keyed by a hash of the English. The content
   files never change. A translator receives a JSON file of English to
   Other, and a missing entry falls back to the English that is already
   sitting in the source. There is no such thing as a missing-key crash and
   no such thing as a half-translated build that shows raw ids.

   The cost of that choice, stated plainly: editing an English string
   changes its key, so its translation is orphaned and falls back to the
   new English until somebody retranslates it. That is the right failure.
   The alternative is a stable id quietly pointing at a translation of a
   sentence that no longer exists.                                        */

let I18N = { locale: 'en', map: null, missing: null };

/* Must match tools/extract-strings.js exactly. A test asserts it does. */
function i18nKey(s){
  let h = 2166136261;
  const t = String(s);
  for(let i = 0; i < t.length; i++){ h ^= t.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h.toString(36);
}

/* The whole runtime. Identity when no locale is loaded, so English pays
   nothing for this existing. */
function T(s){
  if(!I18N.map || typeof s !== 'string' || !s) return s;
  const hit = I18N.map[i18nKey(s.trim())];
  if(hit) return hit;
  if(I18N.missing) I18N.missing[s] = (I18N.missing[s] || 0) + 1;
  return s;
}

function setLocale(code, map){
  I18N.locale = code || 'en';
  I18N.map = map || null;
  if(map) localiseData();
  return I18N.locale;
}
function currentLocale(){ return I18N.locale; }
/* Turn on collection to find out what a translator still owes you. */
function trackMissing(on){ I18N.missing = on ? {} : null; }
function missingStrings(){ return I18N.missing ? Object.keys(I18N.missing) : []; }

/* ---- the tables ----
   Event prose goes through tok(), which is a single chokepoint. The data
   tables are rendered directly from their objects, so they are translated
   once, in place, when a locale is set. Idempotent: translating an already
   translated table is a lookup miss and a no-op. */
function localiseData(){
  const each = (arr, fields) => (arr || []).forEach(o => {
    if(!o) return;
    fields.forEach(f => { if(typeof o[f] === 'string') o[f] = T(o[f]); });
  });
  const vals = (obj, fields) => Object.values(obj || {}).forEach(o => {
    if(!o || typeof o !== 'object') return;
    fields.forEach(f => { if(typeof o[f] === 'string') o[f] = T(o[f]); });
  });
  try{
    if(typeof DATA !== 'undefined' && DATA){
      each(DATA.jobs, ['t']); each(DATA.crimes, ['n']);
      each(DATA.items, ['n','d']); each(DATA.news, ['t']); each(DATA.ribs, ['n']);
      vals(DATA.skills, ['name']); vals(DATA.habits, ['name']);
      if(Array.isArray(DATA.eduNames)) DATA.eduNames = DATA.eduNames.map(T);
      if(DATA.statNames) Object.keys(DATA.statNames).forEach(k => DATA.statNames[k] = T(DATA.statNames[k]));
      if(DATA.fieldNames) Object.keys(DATA.fieldNames).forEach(k => DATA.fieldNames[k] = T(DATA.fieldNames[k]));
    }
    if(typeof ACHIEVEMENTS !== 'undefined') each(ACHIEVEMENTS, ['n','d']);
    if(typeof CHALLENGES !== 'undefined')   each(CHALLENGES, ['n','d']);
    if(typeof CONDITIONS !== 'undefined')   each(CONDITIONS, ['n']);
    if(typeof PERSONALITIES !== 'undefined')each(PERSONALITIES, ['n']);
    if(typeof PROPERTY_TYPES !== 'undefined')each(PROPERTY_TYPES, ['n']);
    if(typeof VEHICLES !== 'undefined')     each(VEHICLES, ['n']);
    if(typeof BUSINESSES !== 'undefined')   each(BUSINESSES, ['n']);
    if(typeof DEGREES !== 'undefined')      each(DEGREES, ['n']);
    if(typeof SUBJECTS !== 'undefined')     each(SUBJECTS, ['n']);
    if(typeof ASSETS !== 'undefined')       each(ASSETS, ['n','d']);
    if(typeof HEIRLOOMS !== 'undefined')    each(HEIRLOOMS, ['n']);
    if(typeof COUNSEL !== 'undefined')      each(COUNSEL, ['n','d']);
  }catch(e){ if(typeof softFail === 'function') softFail('localiseData', e); }
}

/* ---- proving the pipeline without a translator ----
   A pseudo-locale answers the two questions a real translation would:
   does every string actually pass through the lookup, and does the layout
   survive a language that runs a third longer than English. Accents make
   an untranslated string obvious on screen; the padding catches a button
   that only fits because English is short.                              */
const PSEUDO_MAP = { a:'\u00e1', e:'\u00e9', i:'\u00ed', o:'\u00f3', u:'\u00fa',
                     A:'\u00c1', E:'\u00c9', I:'\u00cd', O:'\u00d3', U:'\u00da' };
function pseudoLocale(strings){
  const map = {};
  (strings || []).forEach(s => {
    if(typeof s !== 'string' || !s.trim()) return;
    /* leave {tokens} alone: mangling them would break substitution, and a
       real translator is told to leave them alone too */
    const body = s.replace(/\{(\w+)\}|[A-Za-z]/g,
      (m, tokenName) => tokenName ? m : (PSEUDO_MAP[m] || m));
    map[i18nKey(s.trim())] = '\u27e6' + body + '\u2027\u2027\u2027\u27e7';
  });
  return map;
}

/* ---------------- cloud sync: trusting nothing that comes back ----------
   CLOUD.url is typed by the player, so a response is a message from a
   stranger. Two different things need protecting and they need different
   treatment:

     the entitlement   Plus is bought with money. It is never, under any
                       circumstances, read from the network. A save restored
                       from a server you control cannot make you a paying
                       customer.

     the progress      Achievements, points and records are single-player
                       state that anyone determined could edit in
                       localStorage anyway, so the threat is not cheating,
                       it is a malformed reply wiping a legitimate player.
                       Merged by taking the better of the two, never by
                       overwriting.                                        */
function validSlot(x){
  if(!x || typeof x !== 'object' || Array.isArray(x)) return false;
  if(typeof x.name !== 'string' || x.name.length > 80) return false;
  if(typeof x.age !== 'number' || !isFinite(x.age) || x.age < 0 || x.age > 130) return false;
  if(x.npcs && !Array.isArray(x.npcs)) return false;
  if(x.stats && typeof x.stats !== 'object') return false;
  return true;
}
function cloudMergeMeta(remote){
  if(!remote || typeof remote !== 'object' || Array.isArray(remote)) return 0;
  let took = 0;
  const num = k => {
    const v = remote[k];
    if(typeof v === 'number' && isFinite(v) && v >= 0 && v > (META[k] || 0)){ META[k] = v; took++; }
  };
  const mapOf = k => {
    const v = remote[k];
    if(!v || typeof v !== 'object' || Array.isArray(v)) return;
    if(!META[k] || typeof META[k] !== 'object') META[k] = {};
    Object.keys(v).slice(0, 2000).forEach(id => {
      if(typeof id !== 'string' || id.length > 60) return;
      const rv = v[id];
      if(typeof rv === 'number'){ if(!(META[k][id] > rv)){ META[k][id] = rv; took++; } }
      else if(rv === true && !META[k][id]){ META[k][id] = true; took++; }
    });
  };
  num('lp'); num('lives'); num('taps'); num('adsSeen');
  ['ach','rec','eggs','done','countriesPlayed','perks'].forEach(mapOf);
  if(Array.isArray(remote.deathAges))
    META.deathAges = remote.deathAges.filter(n => typeof n === 'number' && n >= 0 && n <= 130).slice(-12);

function cloudPush(quiet){

    headers:{'Content-Type':'application/json'},body:JSON.stringify(cloudPayload())})
   .then(r=>{ CLOUD.status=r.ok?'synced '+new Date().toLocaleTimeString():'error'; cloudSaveCfg();
     if(!quiet)popupOK(r.ok?'Uploaded':'Upload failed',r.ok?'Your progress is in the cloud.':'The server rejected it.');

function cloudPull(){

  fetch((CLOUD.url||'')+'/cloud/'+encodeURIComponent(CLOUD.code))
   .then(r=>r.ok?r.json():Promise.reject())
   .then(d=>{
     if(!d || typeof d!=='object' || !d.slots || typeof d.slots!=='object') throw 0;
     let wrote=0, refused=0;
     Object.keys(d.slots).slice(0,SLOTS).forEach(k=>{
       const n=parseInt(k,10);

     });
     const took = d.meta ? cloudMergeMeta(d.meta) : 0;
     if(took) saveMeta();

       `${wrote} save${wrote===1?'':'s'} restored to this device.`

       + '\n\nBequest Plus is tied to your purchase, not to the sync, so it is never restored this way.');

/* ---------------- text tokens & variants ---------------- */
/* An event's title, its text, its choice labels and its outcome are four
   separate tok() calls. Each used to re-roll every token, so with three
   children the title and the outcome named a different one 62% of the time,
   and no event could ever name two people at once. The cast is resolved once
   when the event is drawn and reused for all four. */
let CAST=null;
function makeCast(){
  const kids=anyOf('child'), sibs=anyOf('sibling');
  const shuf=a=>a.slice().sort(()=>R()-0.5);
  const k=shuf(kids), sb=shuf(sibs);
  const household=[partner()].concat(k).filter(Boolean);
  const origin=[findNPC('mother'),findNPC('father')].concat(sb).filter(Boolean);
  return {
    any:pick(S.npcs.filter(n=>n.alive)),
    friend:pick(anyOf('friend'))||pick(anyOf('colleague')),
    partner:partner(),
    child:k[0], child2:k[1],
    parent:findNPC('mother')||findNPC('father'),
    sibling:sb[0], sibling2:sb[1],
    colleague:pick(anyOf('colleague')),
    kids:k, household, origin
  };
}
function withCast(cast,fn){ const prev=CAST; CAST=cast; try{ return fn(); } finally { CAST=prev; } }
/* "Margot, Tom and Claire" */
function nameList(arr,max){
  const f=(arr||[]).filter(Boolean).slice(0,max||4).map(n=>n.name.split(' ')[0]);
  if(!f.length) return '';
  if(f.length===1) return f[0];
  return f.slice(0,-1).join(', ')+' and '+f[f.length-1];
}
function tok(str){
  if(!str) return '';
  /* Translate first, substitute second. The catalogue holds the English
     with its {tokens} intact, so a translator moves them around inside
     their own sentence and the substitution still lands. */
  str = T(str);
  const c=CAST||makeCast();
  const p=c.parent, f=c.friend, ch=c.child, sib=c.sibling, pt=c.partner, col=c.colleague, any=c.any;
  const first=n=>n?n.name.split(' ')[0]:null;
  return str
    .replace(/\{child2\}/g,  first(c.child2)||'your other child')
    .replace(/\{sibling2\}/g,first(c.sibling2)||'your other sibling')
    .replace(/\{kids\}/g,    nameList(c.kids)||'the children')
    .replace(/\{family\}/g,  nameList(c.household.length?c.household:c.origin)||'the family')
    .replace(/\{origin\}/g,  nameList(c.origin)||'your family')
    .replace(/\{npc\}/g,    first(any)||'someone')
    .replace(/\{friend\}/g, first(f)||'a friend')
    .replace(/\{partner\}/g,first(pt)||'your partner')
    .replace(/\{child\}/g,  first(ch)||'your child')
    .replace(/\{parent\}/g, first(p)||'your parent')
    .replace(/\{sibling\}/g,first(sib)||'your sibling')
    .replace(/\{colleague\}/g,first(col)||'a colleague')
    .replace(/\{boss\}/g,   S.boss||'your manager')
    .replace(/\{employer\}/g,S.employer||'your employer')
    .replace(/\{school\}/g, S.school||'school')
    .replace(/\{paper\}/g,  S.paper||('The '+S.city+' Herald'))
    .replace(/\{city\}/g,   S.city)
    .replace(/\{country\}/g,country().name)
    .replace(/\{job\}/g,    S.job?S.job.t:'your job')
    .replace(/\{name\}/g,   S.name.split(' ')[0])
    .replace(/\{age\}/g,    S.age)
    .replace(/\{amt\}/g,    money(ri(20,300)));
}
function variant(x){ return tok(Array.isArray(x)?pick(x):x); }

let EFF_SCALE=1, EFF_LOG=null, ACT_BLOCKED=false, PREV_YEAR=null, CHOOSER=null, CONFIRM=null;
/* Every pound in or out is recorded so the player can budget. */
function ledger(kind,label,amount){
  if(!S)return;
  S.ledger=S.ledger||{income:[],spend:[]};
  if(!amount)return;
  S.ledger[kind==='earn'?'income':'spend'].push({l:label,a:Math.round(Math.abs(amount))});
}
function ledgerTotal(kind){ return ((S.ledger&&S.ledger[kind])||[]).reduce((n,x)=>n+x.a,0); }
function sc(v){ return (EFF_SCALE===1||v<=0)?v:Math.round(v*EFF_SCALE*10)/10; }
function applyEff(e){
  if(!e) return [];
  const out=[];
  DATA.statKeys.forEach(k=>{ if(e[k]!=null){
    const d=sc(e[k]), before=S.stats[k];
    S.stats[k]=clamp(before+d);
    const real=Math.round((S.stats[k]-before)*10)/10;
    if(real!==0)out.push(`${DATA.statNames[k]} ${real>0?'+':''}${real}`);
    else if(d>0)out.push(`${DATA.statNames[k]} already at maximum`);
  }});
  if(e.money){
    if(e.money<0 && S.age<18){
      /* a child's costs come out of the household, never their own pocket */
      const need=-e.money;
      const fromChild=Math.min(S.money,need);
      S.money-=fromChild;
      S.familyMoney=Math.max(0,S.familyMoney-(need-fromChild));
      out.push(`${money(e.money)} (your family paid)`);
    } else {
      S.money+=e.money; out.push(`${e.money>0?'+':''}${money(e.money)}`);
      /* Event money never reached the ledger, so the budget bar on the year
         sheet was quietly wrong and nothing downstream could see it. */
      ledger(e.money>0?'earn':'spend', e.money>0?'Something came in':'Something came up',
             Math.abs(e.money));
    }
  }
  if(e.savings){ S.savings+=e.savings; out.push(`Savings +${money(e.savings)}`); }
  if(e.skill) for(const k in e.skill){
    if(S.skills[k]==null)S.skills[k]=0;
    let d=sc(e.skill[k]); if(META.perks&&META.perks.quicklearn&&d>0)d=d*1.25;
    const before=S.skills[k]; S.skills[k]=clamp(before+d);
    const real=Math.round((S.skills[k]-before)*10)/10;
    if(real!==0)out.push(`${DATA.skills[k].name} ${real>0?'+':''}${real}`);
    else if(d>0)out.push(`${DATA.skills[k].name} already at maximum`);
  }
  if(e.habit) for(const k in e.habit){ let d=e.habit[k]; if(d>0)d=sc(d); if(d>0&&S.traits.includes('addictive'))d=Math.round(d*1.5); if(d>0)d=Math.round(d*M('habitGrip')); else d=Math.round(d/M('habitGrip')); S.habits[k]=clamp(S.habits[k]+d); out.push(`${DATA.habits[k].name} ${d>0?'+':''}${d}`); }
  if(e.rel) for(const who in e.rel){
    const d=e.rel[who];
    let t = who==='parents'?S.npcs.filter(n=>(n.rel==='mother'||n.rel==='father')&&n.alive)
      : who==='partner'?S.npcs.filter(n=>(n.rel==='partner'||n.rel==='spouse')&&n.alive)
      : who==='friends'?anyOf('friend')
      : who==='children'?anyOf('child')
      : S.npcs.filter(n=>n.alive);
    t.forEach(n=>n.r=clamp(n.r+d));
    if(t.length) out.push(`${who} ${d>0?'+':''}${d}`);
  }
  if(e.followers){ e.followers=Math.round(sc(e.followers)); S.followers+=e.followers; out.push(`+${e.followers.toLocaleString()} followers`); }
  if(EFF_LOG)out.forEach(x=>EFF_LOG.push(x));
  return out;
}

function birthdayText(){

function tickHabits(){
  const out=[]; let cost=0;
  for(const k in S.habits){
    const lvl=S.habits[k], h=DATA.habits[k]; if(!h||lvl<=5) continue;
    const sc=lvl/100;
    for(const sk in h.eff) S.stats[sk]=clamp(S.stats[sk]+Math.round(h.eff[sk]*sc*(sk==='health'&&S.traits.includes('frail')?1.4:1)));
    cost+=h.cost*sc*(1+newsMod('prices'))*M('cost');
    if(k==='gym')S.skills.fitness=clamp(S.skills.fitness+Math.round(2*sc));
    if(k==='reading')S.skills.writing=clamp(S.skills.writing+Math.round(1*sc));
    if(k==='gambling'){ const sw=Math.round((R()<0.42?1:-1)*ri(200,4000)*sc); S.money+=sw;
      if(Math.abs(sw)>1500)out.push(sw>0?`You won ${money(sw)} gambling.`:`You lost ${money(-sw)} gambling.`); }
    if(!h.good)S.habits[k]=clamp(lvl-1);
  }
  if(cost>0){
    const named=Object.keys(S.habits).filter(k=>S.habits[k]>5&&DATA.habits[k].cost>0)
      .map(k=>DATA.habits[k].name.toLowerCase());
    const what=named.length?named.join(', '):'day-to-day habits';
    if(S.age<13){
      /* nobody bills a child for the food in their house */
      S.familyMoney=Math.max(0,S.familyMoney-cost);
    } else if(S.age<18){
      const paid=Math.min(S.familyMoney,cost);
      S.familyMoney-=paid;
      const rest=cost-paid;

      if(paid>0)out.push(`Your family spent ${money(paid)} on your ${what}.`);
    } else {
      S.money-=cost; ledger('spend','Habits: '+what,cost); out.push(`Your ${what} cost ${money(cost)} this year.`);
    }
  }
  return out;
}
function billsFor(){

  const items=[];

    if(h.cost>0)items.push({l:'Housing \u2014 '+h.n.toLowerCase(),a:Math.round(h.cost*c.col)});
    items.push({l:'Food \u2014 '+f.n.toLowerCase()+(people>1?` (${people} people)`:''),
                a:Math.round(f.cost*c.col*(1+(people-1)*0.6))});

      if(!S.subs[id])return; const sub=SUB(id); if(!sub)return;

/* ---------------- how you live ----------------
   Bills were housing, food and subscriptions, all fixed tiers, none of them
   touching what you earn. So a good salary was banked rather than spent:
   outgoings sat flat near $11,000 while income climbed past $50,000, and a
   median life ended holding $1.77m in idle cash it had never decided to
   accumulate.

   The sink is the true one. You earn more and you spend more, mostly
   without choosing to: a better flat, a car you did not need, the kind of
   holiday you used to read about. It creeps up quickly and comes down
   slowly and unwillingly, discipline slows it, and you can take a year to
   deliberately pull it back at a cost to how the year feels.

   It is charged against what you actually have rather than billed, because
   nobody runs up arrears on a lifestyle: they quietly stop affording it. */
function livingFloor(){ return Math.round(3800*country().col); }
/* The share of what you earn that goes on living the way you live. It has
   to be the TARGET that discipline and thrift move, not merely the speed of
   getting there: over fifty years everybody arrives, so a lever on the
   speed alone is a lever on nothing. */
function livingRatio(s){
  s = s || S;
  const thrift = Math.max(0, Math.min(1, s.thrift || 0));
  const disc = ((s.stats ? s.stats.discipline : 50) - 50) / 300;
  return Math.max(0.30, Math.min(0.68, 0.60 - 0.18 * thrift - disc));
}
function livingTarget(income, s){
  return Math.max(livingFloor(), Math.round(income * livingRatio(s)));
}
function tickLiving(out){
  if(S.age<18) return;
  if(S.living==null) S.living=livingFloor();
  if(S.jailLeft>0){                     /* the state is housing you */
    S.living=Math.max(livingFloor(), Math.round(S.living*0.85));
    return;
  }
  /* thrift is a habit, and habits lapse */
  if(S.thrift==null) S.thrift=0;
  S.thrift=Math.max(0, S.thrift-0.045);

  const income=ledgerTotal('income');
  const target=livingTarget(income, S);
  const gap=target-S.living;
  S.living=Math.max(livingFloor(),
    Math.round(S.living + (gap>0 ? gap*0.34 : gap*0.16)));

  let cost=S.living;
  if(cost>S.money){
    /* you cannot spend what you have not got, so the life gets smaller */
    const short=cost-Math.max(0,S.money);
    cost=Math.max(0,S.money);
    S.living=Math.max(livingFloor(), S.living-Math.round(short*0.6));
    S.stats.happiness=clamp(S.stats.happiness-4);
    out.push(`You could not keep living as you were. Something had to go.`);
  }
  if(cost>0){
    S.money-=cost; ledger('spend','Living as you do',cost);
    if(income>0 && cost>income*0.62 && R()<0.25)
      out.push(`Almost everything you earned went on living the way you now live.`);
  }
}
function tickProperty(out){

function tickBills(out){
  if(S.age<18)return;
