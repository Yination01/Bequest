<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080c16; --bg2:#0e1524; --card:#131c2e; --card2:#18233a; --line:#22304d;
  --tx:#eaf0fb; --mut:#7e8db3; --dim:#5f6c8c;
  --am:#f0a63c; --am2:#ef6a4d; --g:#42c98a; --r:#e0565b; --a:#e8b73f;
}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);overscroll-behavior:none;
  font:15px/1.45 ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
#app{max-width:520px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;
  background:var(--bg);position:relative;overflow:hidden}
#app[data-screen="title"] #screen-create,#app[data-screen="title"] #game,
#app[data-screen="create"] #screen-title,#app[data-screen="create"] #game,
#app[data-screen="game"] #screen-title,#app[data-screen="game"] #screen-create{display:none}
/* the two full-page screens must own the scrolling, not the fixed-height shell */
#screen-title,#screen-create{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
#game{display:flex;flex-direction:column;height:100%;min-height:0}
.dim{color:var(--dim)}
.bad{color:var(--r)}
.ok{color:var(--g)}
.mb{margin-bottom:9px;display:block}
.mt{margin-top:11px}

/* ---------- title ---------- */
.title{padding:30px 22px calc(46px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:13px;
  align-items:center;text-align:center;justify-content:center;min-height:100%}
.title.create{justify-content:flex-start;padding-top:34px}
.logo{width:104px;height:104px;border-radius:24px;box-shadow:0 14px 44px rgba(240,166,60,.2)}
.title h1{font-size:33px;letter-spacing:.24em;font-weight:800;
  background:linear-gradient(90deg,var(--am),var(--am2));-webkit-background-clip:text;background-clip:text;color:transparent}
.title h2{font-size:22px;align-self:flex-start;margin-bottom:4px}
.tag{color:var(--mut);letter-spacing:.06em}
.tbtns{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:6px;width:100%}
.btn{flex:1;min-width:130px;padding:13px 18px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--tx);font-size:15px;font-weight:650;cursor:pointer}
.btn.primary{background:linear-gradient(90deg,var(--am),var(--am2));border:0;color:#1a1204}
.btn.wide{width:100%;flex:none}
.meta{color:var(--mut);font-size:12.5px;margin-top:8px;line-height:1.7}
.note{color:var(--dim);font-size:11.5px;margin-top:4px;max-width:340px}
.title label{width:100%;text-align:left;color:var(--mut);font-size:12.5px;display:flex;flex-direction:column;gap:6px;
  text-transform:uppercase;letter-spacing:.1em}
.inrow{display:flex;gap:8px}
.title input,.title select{flex:1;width:100%;padding:13px;border-radius:11px;border:1px solid var(--line);
  background:var(--bg2);color:var(--tx);font-size:15px;text-transform:none;letter-spacing:0}

/* dice button */
.dicebtn{flex:0 0 auto;width:46px;border-radius:11px;border:1px solid var(--line);background:var(--card2);
  color:var(--am);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.dicebtn:active{transform:scale(.93);background:#22304d}
.die{line-height:1;display:block}
.ctrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.ctrow .ct{margin:0}
.ctrow .dicebtn{width:36px;height:32px;font-size:17px}
.phead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.phead .dicebtn{width:38px;height:34px;font-size:18px}

/* ---------- header ---------- */
#hdr{flex:0 0 auto;padding:11px 13px 9px;background:linear-gradient(180deg,#121a2c,var(--bg));
  border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:11px}
.avatar{width:44px;height:44px;flex:0 0 44px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:15px;color:#1a1204;background:linear-gradient(135deg,var(--am),var(--am2));letter-spacing:.02em}
.hinfo{flex:1;min-width:0}
.hname{font-size:16px;font-weight:750;display:flex;align-items:center;gap:6px}
.gen{font-size:9px;background:rgba(240,166,60,.16);color:var(--am);padding:2px 5px;border-radius:5px;letter-spacing:.08em}
.hsub{font-size:11.5px;color:var(--mut)}
.hmoney{text-align:right}
.hm{font-size:16px;font-weight:750;color:var(--am)}
.bars{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 10px;margin-top:10px}
.b .bl{display:flex;justify-content:space-between;font-size:9.5px;color:var(--mut);letter-spacing:.02em}
.bt{height:5px;background:#0a1120;border-radius:4px;overflow:hidden;margin-top:3px}
.bt.big{height:8px}
.bt i{display:block;height:100%;border-radius:4px;transition:width .35s ease}
.bt i.g{background:linear-gradient(90deg,#33a86f,var(--g))}
.bt i.a{background:linear-gradient(90deg,#c9942c,var(--a))}
.bt i.r{background:linear-gradient(90deg,#b8383d,var(--r))}

/* ---------- main ---------- */
#main{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:11px 11px 4px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px 13px}
.ct{font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:var(--mut);margin-bottom:9px;font-weight:700}
.news{background:linear-gradient(135deg,#1a2643,#131c2e);border-color:#2b3c60}
.ni{font-size:13px;color:var(--am);margin-bottom:3px}
.log{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.yr{font-size:10px;letter-spacing:.2em;color:var(--dim);text-align:center;margin:6px 0 2px}
.li{display:flex;gap:9px;align-items:flex-start}
.li b{color:var(--dim);min-width:22px;font-weight:700;font-size:11px;padding-top:2px;text-align:right}
.li span{flex:1}
.li.good span{color:var(--g)}
.li.bad span{color:var(--r)}
.muted{color:var(--mut);font-size:13px}

/* list rows */
.row{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;text-align:left;
  padding:11px 2px;background:none;border:0;border-bottom:1px solid rgba(34,48,77,.6);color:var(--tx);cursor:pointer}
.row:last-child{border-bottom:0}
.row:active{background:rgba(255,255,255,.03)}
.row i{color:var(--dim);font-style:normal;font-size:17px;flex:0 0 auto}
.row i.price{font-size:13px;color:var(--am);font-weight:700}
.row.locked{opacity:.42;cursor:default}
.row.danger .rn{color:#f08a8e}
.rn{font-size:14px;font-weight:600}
.fieldhdr{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--am);
  margin:12px 0 2px;padding-top:8px;border-top:1px solid rgba(34,48,77,.6)}
.fieldhdr:first-of-type{border-top:0;padding-top:0;margin-top:0}
.owned{font-size:9.5px;color:var(--g);border:1px solid rgba(66,201,138,.5);border-radius:5px;padding:1px 4px;vertical-align:middle}
.grid3{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.mini{padding:10px 8px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--tx);
  font-size:12.5px;font-weight:600;cursor:pointer}
.mini:active{background:var(--card2)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid rgba(34,48,77,.55);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--mut);flex:0 0 auto}
.kv b{text-align:right}

/* people */
.npc{padding:10px 0;border-bottom:1px solid rgba(34,48,77,.6)}
.npc:last-child{border-bottom:0}
.npcline{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.rel{font-size:13px;font-weight:700;color:var(--am)}
.nact{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.nact button{padding:6px 11px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);
  color:var(--tx);font-size:11.5px;cursor:pointer}
.nact button:active{background:var(--card2)}
.sk{margin-bottom:12px}

/* age button + nav */
#agewrap{flex:0 0 auto;padding:8px 11px 0}
#ageBtn{width:100%;padding:15px;border:0;border-radius:14px;color:#1a1204;font-size:15px;font-weight:800;
  letter-spacing:.14em;cursor:pointer;background:linear-gradient(90deg,var(--am),var(--am2));
  box-shadow:0 6px 24px rgba(239,106,77,.28)}
#ageBtn:active{transform:scale(.99)}
.nav{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;
  padding:7px 7px calc(7px + env(safe-area-inset-bottom));background:var(--bg2);border-top:1px solid var(--line)}
.nav button{padding:8px 2px;border:0;background:none;color:var(--mut);font-size:10.5px;font-weight:650;
  cursor:pointer;border-radius:9px;letter-spacing:.02em}
.nav button.on{color:var(--am);background:rgba(240,166,60,.1)}

/* modal */
.modal{position:absolute;inset:0;background:rgba(4,7,14,.82);display:none;align-items:flex-end;justify-content:center;
  z-index:50;backdrop-filter:blur(4px)}
.modal.show{display:flex}
.sheet{width:100%;max-height:92%;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-bottom:0;
  border-radius:20px 20px 0 0;padding:18px 17px calc(18px + env(safe-area-inset-bottom));animation:up .24s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(30px);opacity:.3}to{transform:none;opacity:1}}
.ptag{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--am);font-weight:700}
.ph{font-size:19px;font-weight:750;margin-bottom:7px;line-height:1.25}
.pb{font-size:14.5px;color:#c4d0ea;line-height:1.55}
.choices{display:flex;flex-direction:column;gap:7px;margin-top:15px}
.choice{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 14px;border-radius:12px;
  border:1px solid var(--line);background:var(--bg2);color:var(--tx);text-align:left;font-size:14.5px;cursor:pointer}
.choice i{font-style:normal;color:var(--dim);font-size:17px}
.choice:active{background:var(--card2)}
.choice.ok{border-color:rgba(240,166,60,.4)}
.reslist{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-size:11.5px;padding:4px 8px;border-radius:7px;background:rgba(66,201,138,.12);color:var(--g);
  border:1px solid rgba(66,201,138,.28)}
.chip.neg{background:rgba(224,86,91,.12);color:var(--r);border-color:rgba(224,86,91,.28)}

/* death */
.death .dh{font-size:24px;font-weight:750}
.dsub{color:var(--mut);margin-bottom:6px}
.lpline{font-size:12.5px;color:var(--am);margin-bottom:14px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.sec{font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:var(--mut);margin:16px 0 8px;font-weight:700}
.ribs{display:flex;flex-wrap:wrap;gap:6px}
.award{font-size:11.5px;padding:5px 10px;border-radius:8px;color:var(--am);
  background:linear-gradient(90deg,rgba(240,166,60,.16),rgba(239,106,77,.16));border:1px solid rgba(240,166,60,.38)}
.award.t1{border-color:rgba(192,132,87,.55);color:#e0a074;background:rgba(192,132,87,.12)}
.award.t2{border-color:rgba(216,222,233,.5);color:#d8dee9;background:rgba(216,222,233,.1)}
.award.t3{border-color:rgba(245,207,93,.55);color:#f5cf5d;background:rgba(245,207,93,.12)}
.award.t4{border-color:rgba(143,227,255,.55);color:#8fe3ff;background:rgba(143,227,255,.12)}
.moments{font-size:13px;color:#c4d0ea;display:flex;flex-direction:column;gap:4px}
.moments b{color:var(--dim);margin-right:6px}
.row2,.row{}
.death .row{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap;border:0;padding:0}

/* achievements */
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;background:var(--bg2);border:1px solid var(--line);
  border-radius:12px;padding:4px}
.seg button{padding:9px 4px;border:0;background:none;color:var(--mut);font-size:12.5px;font-weight:650;
  border-radius:9px;cursor:pointer}
.seg button.on{background:var(--card2);color:var(--am)}
.achhead{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;margin-bottom:8px}
.achhead b{font-size:20px;color:var(--am)}
.pts{color:var(--am);font-weight:700;font-size:12.5px}
.achrow{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid rgba(34,48,77,.55);opacity:.45}
.achrow.done{opacity:1}
.achrow:last-child{border-bottom:0}
.achtx{flex:1;min-width:0}
.achrow .pts{color:var(--dim)}
.achrow.done .pts{color:var(--am)}
.achmedal{width:31px;height:31px;flex:0 0 31px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:13px;color:#1a1204}
.achmedal.t1{background:linear-gradient(135deg,#c08457,#8d5a35)}
.achmedal.t2{background:linear-gradient(135deg,#d8dee9,#9aa5b4)}
.achmedal.t3{background:linear-gradient(135deg,#f5cf5d,#d99b2a)}
.achmedal.t4{background:linear-gradient(135deg,#8fe3ff,#5b9cf5);color:#06121f}
.achmedal.off{background:#1a2338;color:#3a4665}
.ach-pop .achbig{display:flex;gap:13px;align-items:center;margin:4px 0}
.ach-pop .achbig .achmedal{width:50px;height:50px;flex:0 0 50px;font-size:21px}
.achmeta{font-size:11.5px;color:var(--am);margin-top:5px;font-weight:650}
.chal{padding:9px 0;border-bottom:1px solid rgba(34,48,77,.55)}
.chal:last-child{border-bottom:0}
.chal.done{opacity:.7}
.chal .bt{margin-top:6px}

/* ---- difficulty ---- */
.diffpick{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.dchip{flex:1 1 auto;padding:10px 8px;border-radius:11px;border:1px solid var(--line);background:var(--bg2);
  color:var(--mut);font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.dchip.on{background:var(--card2)}
.plus{font-size:8px;background:rgba(143,227,255,.16);color:#8fe3ff;padding:1px 3px;border-radius:4px;letter-spacing:.06em}
.diffcard{width:100%;text-align:left;border:1px solid var(--line);background:var(--bg2);border-radius:14px;padding:13px;margin-top:2px}
.dtitle{font-size:16px;font-weight:750;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lpx{font-size:11px;color:var(--am);font-weight:700;letter-spacing:.04em}
.dblurb{font-size:13px;color:#c4d0ea;line-height:1.5;margin:7px 0 11px}
.knobgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px}
.knob{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;color:var(--mut);
  padding:4px 0;border-bottom:1px solid rgba(34,48,77,.5)}
.knob b{font-weight:700;color:var(--dim)}
.knob.tough b{color:var(--r)}
.knob.kind b{color:var(--g)}
.hardnote{font-size:11px;color:var(--am);margin-top:10px;font-weight:600}
.hardnote.dim{color:var(--dim);font-weight:400}
.hardonly{color:#8fe3ff}
.linkbtn{background:none;border:0;color:var(--am);font-size:12.5px;font-weight:650;cursor:pointer;padding:11px 0 0;
  text-align:left;width:100%}
.dbadge{font-weight:700}

/* comparison table */
.cmpwrap{overflow-x:auto;margin-top:9px;-webkit-overflow-scrolling:touch}
.cmp{width:100%;border-collapse:collapse;font-size:11px;min-width:330px}
.cmp th,.cmp td{padding:6px 5px;text-align:right;border-bottom:1px solid rgba(34,48,77,.5);white-space:nowrap}
.cmp th:first-child,.cmp td:first-child{text-align:left;color:var(--mut)}
.cmp th{font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.cmp td.tough{color:var(--r)}
.cmp td.kind{color:var(--g)}
.cmpfoot td{font-weight:700;color:var(--tx)}

/* custom sliders */
.sliders{margin-top:11px;border-top:1px solid var(--line);padding-top:11px}
.srow-head{font-size:11px;color:var(--mut);margin-bottom:10px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.tiny{padding:4px 8px;border-radius:7px;border:1px solid var(--line);background:var(--card2);color:var(--tx);
  font-size:10.5px;cursor:pointer}
.srow{margin-bottom:13px}
.slabel{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px}
.slabel b{font-weight:700;color:var(--dim)}
.slabel b.tough{color:var(--r)}
.slabel b.kind{color:var(--g)}
.sdesc{font-size:10.5px;color:var(--dim);margin-top:2px}
.srow input[type=range]{width:100%;accent-color:var(--am);height:22px}

/* saves */
.slot{padding:10px 0;border-bottom:1px solid rgba(34,48,77,.6)}
.slot:last-of-type{border-bottom:0}
.slot.cur{background:rgba(240,166,60,.05);border-radius:9px;padding-left:8px;padding-right:8px}
.cl{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--mut);text-transform:uppercase;
  letter-spacing:.1em;margin-bottom:9px}
.cl input{padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--tx);
  font-size:14px;text-transform:none;letter-spacing:0}
.clrow{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut)}
.clrow input{accent-color:var(--am);width:17px;height:17px}


/* ================= v2 INTERFACE ================= */
:root{ --glow:0 0 0 1px rgba(255,255,255,.04), 0 8px 24px rgba(0,0,0,.35); }

/* hero header */
#hdr{padding:12px 13px 10px;background:
  radial-gradient(120% 100% at 0% 0%, #1b2743 0%, #101829 55%, #0b1120 100%);
  border-bottom:1px solid var(--line)}
.hero{display:flex;align-items:center;gap:12px}
.avwrap{position:relative;width:74px;height:74px;flex:0 0 74px}
.ring{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4;stroke-linecap:round}
.ring .rbg{stroke:rgba(255,255,255,.07)}
.ring .rfg{transition:stroke-dasharray .6s cubic-bezier(.2,.8,.3,1)}
.ring .rfg.g{stroke:var(--g)} .ring .rfg.a{stroke:var(--a)} .ring .rfg.r{stroke:var(--r)}
.avin{position:absolute;inset:5px;border-radius:18px;overflow:hidden;display:flex}
.av{display:block;border-radius:16px}
.agepill{position:absolute;right:-2px;bottom:-2px;min-width:24px;height:22px;padding:0 6px;border-radius:11px;
  background:linear-gradient(90deg,var(--am),var(--am2));color:#1a1204;font-size:12px;font-weight:800;
  display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.4)}
.hinfo{flex:1;min-width:0}
.hname{font-size:16.5px;font-weight:750;display:flex;align-items:center;gap:6px;letter-spacing:-.01em}
.hjob{font-size:12.5px;color:var(--am);font-weight:600;margin-top:1px}
.hloc{font-size:11px;color:var(--dim)}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.ch{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:2px 6px;border-radius:5px;background:rgba(255,255,255,.06)}
.ch.bad{color:var(--r);background:rgba(224,86,91,.14)}
.hcash{text-align:right}

/* stat strip */
.statrow{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:11px}
.stat{background:rgba(255,255,255,.04);border-radius:10px;padding:6px 3px 5px;text-align:center;position:relative}
.stat .si{height:15px;display:flex;align-items:center;justify-content:center}
.stat .si svg{width:14px;height:14px;fill:currentColor;stroke:currentColor;stroke-width:0}
.stat .si svg[stroke]{fill:none}
.stat.g{color:var(--g)} .stat.a{color:var(--a)} .stat.r{color:var(--r)}
.stat .sv{font-size:13px;font-weight:800;color:var(--tx);line-height:1.2}
.stat .sbar{height:3px;border-radius:2px;background:rgba(0,0,0,.35);overflow:hidden;margin-top:3px}
.stat .sbar i{display:block;height:100%;background:currentColor;transition:width .55s cubic-bezier(.2,.8,.3,1)}

/* life hero card */
.card.hi{background:linear-gradient(145deg,#182votes 0%,#141d31 100%);background:linear-gradient(145deg,#1a2540,#131c2e);
  box-shadow:var(--glow)}
.histat{display:flex;justify-content:space-between;font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;
  color:var(--mut);margin-bottom:10px}
.histat b{color:var(--am)}
.hisplit{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.hlbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim)}
.hbig{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.hbig.sm{font-size:16px;padding-top:6px}
.hbig.g{color:var(--g)} .hbig.a{color:var(--a)}
.milestone{display:flex;gap:10px;align-items:center;margin-top:12px;padding-top:11px;
  border-top:1px solid rgba(255,255,255,.07)}
.milestone span svg{width:20px;height:20px;fill:none;stroke:var(--am);stroke-width:1.7}
.milestone b{font-size:13.5px}

/* family strip */
.famrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.fam{flex:0 0 62px;background:none;border:0;padding:0;cursor:pointer;text-align:center;color:var(--tx)}
.famav{border-radius:13px;overflow:hidden;display:flex;justify-content:center}
.famn{font-size:10.5px;margin-top:4px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fambar{height:3px;background:rgba(0,0,0,.4);border-radius:2px;overflow:hidden;margin-top:3px}
.fambar i{display:block;height:100%}
.fambar i.g{background:var(--g)}.fambar i.a{background:var(--a)}.fambar i.r{background:var(--r)}

/* timeline */
.timeline{position:relative;padding-left:14px}
.timeline:before{content:'';position:absolute;left:3px;top:4px;bottom:4px;width:1px;background:rgba(34,48,77,.9)}
.tyear{font-size:9.5px;letter-spacing:.2em;color:var(--dim);margin:11px 0 6px -14px;text-align:center}
.tline{position:relative;display:flex;gap:8px;padding:4px 0;font-size:13.5px;animation:fade .3s ease}
.tdot{position:absolute;left:-14px;top:10px;width:7px;height:7px;border-radius:50%;
  background:var(--line);box-shadow:0 0 0 3px var(--card)}
.tline.good .tdot{background:var(--g)} .tline.bad .tdot{background:var(--r)}
.tline.good .tt{color:var(--g)} .tline.bad .tt{color:var(--r)}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card.tip{background:rgba(240,166,60,.07);border-color:rgba(240,166,60,.3)}

/* people avatars */
.npcwho{display:flex;gap:10px;align-items:center}
.npcav{border-radius:12px;overflow:hidden;flex:0 0 40px;display:flex}

/* nav icons */
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .2s}
.nav svg{width:19px;height:19px;fill:currentColor}
.nav button.on{background:none;color:var(--am)}
.nav button.on svg{filter:drop-shadow(0 0 6px rgba(240,166,60,.5))}

/* age button */
#ageBtn{position:relative;overflow:hidden}
#ageBtn.pulse{animation:pop .32s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(.97)}100%{transform:scale(1)}}
#main.in>.card{animation:slidein .32s cubic-bezier(.2,.8,.3,1) backwards}
#main.in>.card:nth-child(2){animation-delay:.04s}
#main.in>.card:nth-child(3){animation-delay:.08s}
#main.in>.card:nth-child(4){animation-delay:.12s}
@keyframes slidein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* action economy + school */
.acthead{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.pips{display:flex;gap:4px}
.pip{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.13)}
.pip.on{background:linear-gradient(135deg,var(--am),var(--am2));box-shadow:0 0 7px rgba(240,166,60,.5)}
.ch.act{color:var(--am);background:rgba(240,166,60,.14)}
.row.spent{opacity:.4}
i.dim2{font-style:normal;font-size:11px;color:var(--dim);font-weight:700}
.showmore{width:100%;margin-top:9px;padding:9px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg2);color:var(--am);font-size:12.5px;font-weight:650;cursor:pointer}
.card.school{background:linear-gradient(145deg,#1b2a45,#131d30)}
.gradechip{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:13px;color:#0b1020}
.gradechip.g{background:var(--g)} .gradechip.a{background:var(--a)} .gradechip.r{background:var(--r)}
.card.flash{animation:flash 1.1s ease}
@keyframes flash{0%{box-shadow:0 0 0 2px rgba(240,166,60,0)}25%{box-shadow:0 0 0 2px rgba(240,166,60,.75)}100%{box-shadow:0 0 0 2px rgba(240,166,60,0)}}
.npclife{color:var(--am);opacity:.85;margin-top:2px}

/* store */
.plushero{background:linear-gradient(145deg,#24304d,#161f33);border-color:#31456e}
.plushero.on{background:linear-gradient(145deg,#1d3a2e,#152a22);border-color:#2f6b52}
.prices{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:13px}
.pricecard{padding:11px 6px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);
  color:var(--tx);cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:center}
.pricecard b{font-size:15px}
.pricecard span{font-size:10px;color:var(--mut)}
.pricecard i{font-size:9px;color:var(--am);font-style:normal}
.pricecard.best{border-color:var(--am);background:rgba(240,166,60,.1)}
.tick{font-size:13px;padding:5px 0;border-bottom:1px solid rgba(34,48,77,.5)}
.tick:last-child{border-bottom:0}
.tick.free{color:var(--tx)}
.tick.locked{color:var(--dim)}
.adbox{border:1px dashed var(--line);border-radius:12px;padding:26px;text-align:center;margin:8px 0}
.adlabel{font-size:11px;letter-spacing:.3em;color:var(--dim);margin-bottom:6px}

/* easter eggs */
.eggsheet{border-color:rgba(240,166,60,.45)}
.eggsheet.t-rare{border-color:rgba(143,227,255,.45)}
.eggsheet.t-myth{border-color:rgba(200,150,255,.55);
  background:linear-gradient(145deg,#1d1730,#141326)}
.eggtext{font-size:14px;line-height:1.65;color:#dfe7fa;font-style:italic;
  border-left:2px solid var(--am);padding:8px 0 8px 12px;margin:10px 0}
.eggsheet.t-myth .eggtext{border-left-color:#c896ff}
.award.egg{border-color:rgba(200,150,255,.5);color:#d7b3ff;background:rgba(200,150,255,.12)}
.trackcard{background:linear-gradient(145deg,#1e2338,#141a2b)}

/* year summary, budget, header sheet */
.ysec{margin-bottom:11px}
.ylabel{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--am);margin-bottom:4px}
.yline{font-size:13.5px;color:#cbd6ee;padding:3px 0 3px 12px;border-left:2px solid rgba(34,48,77,.9)}
.ybody{max-height:46vh;overflow-y:auto;margin-top:10px}
.budgetbar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center;
  background:rgba(255,255,255,.04);border-radius:12px;padding:10px;margin:10px 0}
.budgetbar>div>div:last-child{font-size:15px;font-weight:750}
.bgood{color:var(--g)} .bbad{color:var(--r)}
.ledger{margin-top:10px;max-height:190px;overflow-y:auto}
.lrow{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:4px 0;
  border-bottom:1px solid rgba(34,48,77,.5)}
.lrow span{color:var(--mut)}
.statToggle{width:100%;margin-top:8px;padding:6px;border:0;background:none;color:var(--mut);
  font-size:11px;font-weight:650;letter-spacing:.06em;cursor:pointer}
.statsheet{position:absolute;inset:0;background:rgba(4,7,14,.72);backdrop-filter:blur(3px);
  display:none;align-items:flex-start;justify-content:center;z-index:40;padding-top:64px}
.statsheet.open{display:flex}
.statpanel{width:calc(100% - 22px);max-height:70vh;overflow-y:auto;background:var(--card);
  border:1px solid var(--line);border-radius:16px;padding:14px;animation:up .2s ease}

/* hubs and sections */
.hubgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hub{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;
  padding:12px 11px;border-radius:13px;border:1px solid var(--line);background:var(--bg2);
  color:var(--tx);cursor:pointer}
.hub:active{background:var(--card2)}
.hub.danger{border-color:#4a2330;background:#1d1524}
.hubi{font-size:17px;color:var(--am);line-height:1}
.hub.danger .hubi{color:#f08a8e}
.hubn{font-size:14px;font-weight:700;margin-top:3px}
.hubc{font-size:11px;color:var(--dim)}
.secthead{background:linear-gradient(145deg,#1a2540,#131c2e)}
.backbtn{background:none;border:0;color:var(--am);font-size:12.5px;font-weight:650;cursor:pointer;
  padding:0 0 8px}
.secttitle{font-size:19px;font-weight:750}
.personhead{display:flex;gap:12px;align-items:center}
.personhead .npcav{flex:0 0 54px;border-radius:15px;overflow:hidden;display:flex}

/* accessibility and search */
#app[data-text="s"]{font-size:13.5px}
#app[data-text="m"]{font-size:15px}
#app[data-text="l"]{font-size:16.5px}
#app[data-text="xl"]{font-size:18.5px}
#app[data-text="l"] .rn,#app[data-text="xl"] .rn{font-size:15.5px}
#app[data-text="l"] .pb,#app[data-text="xl"] .pb{font-size:16px}
#app[data-text="l"] .hsub,#app[data-text="xl"] .hsub{font-size:13px}
.search{width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--line);
  background:var(--bg2);color:var(--tx);font-size:14.5px;margin-bottom:8px}
.mini.on{border-color:var(--am);color:var(--am);background:rgba(240,166,60,.1)}

<script>
/* BEQUEST — difficulty.
   Every knob is a MULTIPLIER applied at one specific point in the engine.
   1.00 = the Normal baseline. Higher is not always harder — see `dir`.        */

const DIFF_KNOBS = [
  { k:'earn',      n:'Earnings',            d:'Salary, business profit and sponsorship income.',      dir:'up_easier', min:0.4, max:2.0 },

const DIFFICULTIES = [

  { id:'custom', n:'Custom', rank:-1, lp:1.0, colour:'#8fe3ff', premium:true,
    blurb:'Set all twelve values yourself. Legacy Points are scaled to how hard you actually made it, so easy settings earn less.',
    m:{ earn:1.00, cost:1.00, start:1.00, decay:1.00, death:1.00, luck:0.00,
        jobOdds:1.00, promoOdds:1.00, crimeOdds:1.00, prison:1.00, habitGrip:1.00, relDecay:1.00, autopay:1 } }
];

function diffDef(id){ return DIFFICULTIES.find(d=>d.id===id)||DIFFICULTIES[1]; }

/* Score a custom set against the presets so Custom cannot be used to farm Legacy Points.
   Each knob contributes how much harder than Normal it is; 0 = Normal.          */
function customScore(m){
  let s=0;
  DIFF_KNOBS.forEach(k=>{
    const v=m[k.k], base=k.add?0:1;
    if(k.toggle){ s += (v?0:0.25); return; }   // paying your own bills is harder
    let harder = k.dir==='up_harder' ? (v-base) : (base-v);
    if(k.add) harder = -v*4;
    s += harder;
  });
  return s/DIFF_KNOBS.length;             // ~0 Normal, ~0.3 Hard, ~0.55 Brutal
}
function customLP(m){
  const s=customScore(m);
  return Math.max(0.25, Math.min(2.2, 1 + s*1.8));
}
/* Effective rank of a custom set, for gating Hard-only achievements. */
function customRank(m){
  const s=customScore(m);
  return s>=0.45?3 : s>=0.22?2 : s>=-0.1?1 : 0;
}

/* ============ 1. HEALTH — real conditions with progression ============ */
/* sev 1 minor · 2 serious · 3 critical.  yr = yearly effect while untreated.
   prog = chance per year of worsening.  cure = chance treatment resolves it.      */
const CONDITIONS = [
  { id:'asthma',    n:'Asthma',              sev:1, chronic:true,  cost:900,   yr:{health:-1},            prog:0.03, cure:0.15, work:0, fatal:false },

  { id:'hyperten',  n:'High blood pressure', sev:1, chronic:true,  cost:1400,  yr:{health:-2},            prog:0.09, cure:0.30, work:0, fatal:false },
  { id:'heart',     n:'Heart disease',       sev:3, chronic:true,  cost:9000,  yr:{health:-6},            prog:0.10, cure:0.18, work:0.25, fatal:true },
  { id:'copd',      n:'Lung disease',        sev:3, chronic:true,  cost:7000,  yr:{health:-6,looks:-1},   prog:0.12, cure:0.12, work:0.25, fatal:true },
  { id:'liver',     n:'Liver damage',        sev:3, chronic:true,  cost:8000,  yr:{health:-6},            prog:0.10, cure:0.15, work:0.20, fatal:true },
  { id:'cancer',    n:'Cancer',              sev:3, chronic:false, cost:42000, yr:{health:-12,happiness:-8},prog:0.22,cure:0.45, work:0.45, fatal:true },
  { id:'addiction', n:'Substance addiction', sev:2, chronic:true,  cost:6000,  yr:{health:-4,reputation:-3},prog:0.10,cure:0.30, work:0.30, fatal:false },
  { id:'arthritis', n:'Arthritis',           sev:1, chronic:true,  cost:1800,  yr:{health:-2,happiness:-2},prog:0.06, cure:0.10, work:0.10, fatal:false },
  { id:'dementia',  n:'Dementia',            sev:3, chronic:true,  cost:12000, yr:{health:-5,smarts:-5},  prog:0.18, cure:0.02, work:0.80, fatal:true },
  { id:'stroke',    n:'Stroke aftereffects', sev:3, chronic:true,  cost:15000, yr:{health:-5,smarts:-2},  prog:0.10, cure:0.20, work:0.55, fatal:true },

];
const COND = id => CONDITIONS.find(c => c.id === id);

/* Which conditions a life can develop, and what raises the odds. */
function conditionRisk(S, c) {
  const a = S.age, h = S.habits, st = S.stats;
  let p = 0;
  switch (c.id) {
    case 'asthma':     p = a < 16 ? 0.004 : 0.001; break;
    case 'anxiety':    p = 0.004 + (st.happiness < 35 ? 0.012 : 0) + (h.doomscroll > 50 ? 0.008 : 0); break;
    case 'depression': p = 0.003 + (st.happiness < 25 ? 0.020 : 0) + (h.drinking > 55 ? 0.006 : 0); break;
    case 'backinjury': p = a > 30 ? 0.004 + (S.job && ['trade','service'].includes(S.job.field) ? 0.010 : 0) : 0.001; break;
    case 'diabetes':   p = a > 32 ? 0.002 + (h.junkfood > 55 ? 0.014 : 0) : 0; break;
    case 'hyperten':   p = a > 35 ? 0.006 + (h.junkfood > 45 ? 0.006 : 0) + (st.happiness < 35 ? 0.004 : 0) : 0; break;
    case 'heart':      p = a > 45 ? 0.004 + (h.smoking > 40 ? 0.010 : 0) + (h.junkfood > 55 ? 0.006 : 0) : 0; break;
    case 'copd':       p = a > 40 ? (h.smoking > 45 ? 0.014 : 0.0008) : 0; break;
    case 'liver':      p = a > 33 ? (h.drinking > 60 ? 0.014 : 0.0005) : 0; break;
    case 'cancer':     p = a > 40 ? 0.003 + (a - 40) * 0.0004 + (h.smoking > 50 ? 0.008 : 0) : 0.0004; break;
    case 'addiction':  p = (h.drugs > 45 ? 0.030 : 0) + (h.drinking > 70 ? 0.010 : 0); break;
    case 'arthritis':  p = a > 50 ? 0.008 + (a - 50) * 0.0006 : 0; break;
    case 'dementia':   p = a > 68 ? 0.004 + (a - 68) * 0.0022 : 0; break;
    case 'stroke':     p = a > 52 ? 0.002 + (a - 52) * 0.0005 + (h.smoking > 45 ? 0.004 : 0) : 0; break;
    default: p = 0;
  }
  if (S.traits && S.traits.includes('sickly')) p *= 1.8;
  if (S.skills && S.skills.fitness > 65) p *= 0.6;
  if (S.habits && S.habits.gym > 50) p *= 0.75;
  return p * 0.55;   // tuned against the bequest regression test
}

/* ============ 2. MONEY — credit score & lending ============ */
const CREDIT_BANDS = [

/* ============ 4. RELATIONSHIPS — personalities ============ */
const PERSONALITIES = [

  { id:'distant',  n:'Distant',     talk:0.6, forgive:0.7, drift:1.5, fatal:false },

  { id:'private',  n:'Private',     talk:0.7, forgive:1.0, drift:0.9, fatal:false }

const personality = id => PERSONALITIES.find(p => p.id === id) || PERSONALITIES[5];

/* ============ 5. LEGAL — records, employment bars, parole ============ */
/* Fields that run criminal-record checks, and how far back they care. */
const RECORD_BARS = {
  public:   { years:99, label:'Public sector posts run full record checks' },
  medical:  { years:99, label:'Medical roles require a clean record' },
  security: { years:99, label:'Security and forces bar anyone with convictions' },
  politics: { years:99, label:'You would never pass selection with a conviction' },
  corp:     { years:10, label:'Corporate employers check the last 10 years' },
  tech:     { years:7,  label:'Screening covers the last 7 years' }
};
/* Severity of the worst conviction determines how long it haunts you. */
function recordAge(S) {
  if (!S.record || !S.record.length) return null;
  const worst = S.record.reduce((a, b) => (b.sev > a.sev ? b : a));
  return { worst, since: S.age - worst.age };
}
function recordBlocks(S, field) {
  const bar = RECORD_BARS[field];
  if (!bar) return null;
  const r = recordAge(S);
  if (!r) return null;
  if (r.worst.spent) return null;                   // conviction is spent
  if (r.since >= bar.years) return null;
  return bar.label;
}

const TRACK = id => TRACKS.find(t => t.id === id);
function TRACK_RANK(t){
  const def = TRACK(t.id);
  let r = def.ranks[0];
  def.ranks.forEach((x,i) => { if (t.progress >= x.need) { r = x; t.rank = i; } });
  return r;
}

/* Housing a household actually needs: you, a partner, children, dependents. */
function householdSize(S) {
  let n = 1;
  if (S.npcs.some(x => x.alive && (x.rel === 'partner' || x.rel === 'spouse'))) n++;
  n += S.npcs.filter(x => x.alive && x.rel === 'child' && x.age < 19).length;
  n += (S.dependents || 0);
  return n;
}

function mkId(){ return 'L'+Math.floor(Math.random()*1e9).toString(36); }

function pickMotive(rnd){
  const tot = MOTIVES.reduce((n,m)=>n+m.w,0);
  let r = rnd()*tot;
  for(const m of MOTIVES){ r-=m.w; if(r<=0) return m; }
  return MOTIVES[0];
}

function makeVehicleListing(def, rnd, ri2, col){
  const sellerId = rnd()<0.42?'dealer' : rnd()<0.7?'private':'auction';
  const seller = SELLER(sellerId);
  const age = def.id==='classic' ? ri2(18,45) : ri2(0,14);
  const miles = Math.round((age*ri2(5,14) + ri2(0,9)) * 1000);
  const cond = clampNum(100 - age*4 - miles/4000 + ri2(-8,14), 12, 100);
  const wear = 0.45 + (cond/100)*0.55;
  const price = Math.max(300, Math.round(def.base * col * wear * seller.markup * (0.92+rnd()*0.18)));
  return { id:mkId(), kind:'vehicle', t:def.id, price, ask:price, cond,
    age, miles, colour: COLOURS[Math.floor(rnd()*COLOURS.length)],
    seller: sellerId, motive: pickMotive(rnd).id, warranty: seller.warranty && cond>60 };
}

function makePropertyListing(def, rnd, ri2, col){
  const sellerId = rnd()<0.6?'estate':'owner';
  const seller = SELLER(sellerId);
  const cond = clampNum(ri2(25,98), 15, 100);
  const needsWork = cond < 45;
  const wear = 0.72 + (cond/100)*0.38;
  const price = Math.max(5000, Math.round(def.base * col * wear * seller.markup * (0.9+rnd()*0.22)));
  const addr = `${ri2(1,180)} ${STREETS[Math.floor(rnd()*STREETS.length)]} ${STREET_KIND[Math.floor(rnd()*STREET_KIND.length)]}`;
  return { id:mkId(), kind:'property', t:def.id, price, ask:price, cond, addr,
    seller: sellerId, motive: pickMotive(rnd).id, needsWork,
    tenant: def.commercial ? (rnd()<0.5) : false };
}

function makeItemListing(def, rnd, ri2, col){
  const used = rnd()<0.42 && def.cat!=='Assets';
  const sellerId = used ? 'secondhand' : 'shop';
  const seller = SELLER(sellerId);
  const cond = used ? clampNum(ri2(35,92),20,100) : 100;
  const wear = used ? 0.45+(cond/100)*0.5 : 1;
  const price = Math.max(5, Math.round(def.c * col * wear * seller.markup * (0.95+rnd()*0.12)));
  return { id:mkId(), kind:'item', t:def.id, price, ask:price, cond, used,
    seller: sellerId, motive: pickMotive(rnd).id };
}

function clampNum(v,a,b){ return Math.max(a, Math.min(b, Math.round(v))); }

/* How a seller responds to an offer.
   pct is how far below asking you are offering, 0..1                       */
function haggleOutcome(listing, offer, charisma, businessSkill, rnd){
  const seller = SELLER(listing.seller);
  const motive = MOTIVES.find(m=>m.id===listing.motive) || MOTIVES[0];
  const below = 1 - (offer / listing.ask);
  if (below <= 0) return { result:'accept', price: offer };
  /* what they would tolerate before walking */
  const tolerance = seller.haggle*0.22 + motive.give + charisma/650 + businessSkill/900;
  if (below <= tolerance*0.55) return { result:'accept', price: offer };
  if (below <= tolerance) {
    const meet = Math.round(listing.ask * (1 - below*0.55));
    return { result:'counter', price: meet };
  }
  if (below > tolerance*2.2 && rnd() < 0.45) return { result:'insulted', price: listing.ask };
  return { result:'refuse', price: listing.ask };
}

<script>
/* BEQUEST — procedural SVG avatar.
   Draws a face that genuinely ages and reflects the character's state:
   region skin tone, gender, looks, health, happiness, wealth, job, conditions.
   Everything is inline SVG so it works offline and in a sandboxed iframe.      */

const SKIN = {
  west:['#f3d2bd','#e8bc9e','#d9a684'], euro:['#f2d3c0','#e7bda0','#dca98c'],
  nordic:['#f7ddcb','#f0cdb4'],          slav:['#f1d1bb','#e4b99b'],
  jp:['#f4d9c0','#ecc6a6'],              kr:['#f5dcc4','#edc9aa'],
  cn:['#f2d5b6','#e6c39c'],              in:['#d9a071','#c2814f','#a9683a'],
  ph:['#d8a476','#c08a58'],              id:['#d7a577','#bf8b59'],
  latin:['#dcae86','#c68e63','#a97246'], wafr:['#8d5524','#6f4220','#5a351a'],
  eafr:['#7d4a1f','#63391a'],            safr:['#8a5326','#6b4020','#4e2f18'],
  arab:['#e0b48c','#cf9a6d'],            tr:['#e5bb96','#d3a274']
};
const HAIR_DARK = ['#1c1410','#2a1d15','#3a2a1c'];
const HAIR_ANY  = ['#1c1410','#2a1d15','#3a2a1c','#6b4a2a','#8a6234','#b08a4a','#c9a227','#7a3b1f'];

function hashCode(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) { h = (h * 31 + str.charCodeAt(i)) | 0; }
  return Math.abs(h);
}

/* Deterministic per-character features so the face never changes between renders. */
function avatarFeatures(S) {
  const seed = hashCode((S.name || 'x') + (S.seed || 0));
  const r = n => (seed >> (n * 3)) % 1000 / 1000;
  const reg = (DATA.countries.find(c => c.id === S.country) || {}).reg || 'west';
  const tones = SKIN[reg] || SKIN.west;
  const darkHairRegions = ['jp','kr','cn','in','ph','id','wafr','eafr','arab'];
  const hairPool = darkHairRegions.includes(reg) ? HAIR_DARK : HAIR_ANY;
  return {
    skin: tones[Math.floor(r(0) * tones.length)],
    hair: hairPool[Math.floor(r(1) * hairPool.length)],
    faceW: Math.round((30 + r(2) * 5) * 100) / 100,
    eyeGap: Math.round((9 + r(3) * 3) * 100) / 100,
    noseLen: Math.round((4 + r(4) * 3) * 100) / 100,
    ears: r(5) > 0.5,
    style: Math.floor(r(6) * 4),
    freckles: r(7) > 0.78
  };
}

function shade(hex, pct) {
  const n = parseInt(hex.slice(1), 16);
  let R = (n >> 16) + pct, G = ((n >> 8) & 255) + pct, B = (n & 255) + pct;
  R = Math.max(0, Math.min(255, R)); G = Math.max(0, Math.min(255, G)); B = Math.max(0, Math.min(255, B));
  return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
}

/* size = px. Returns an <svg> string. */
function avatarSVG(S, size) {
  size = size || 96;
  const f = avatarFeatures(S);
  const a = S.age, st = S.stats;
  const child = a < 13, baby = a < 3, old = a >= 62, elder = a >= 78;

  /* proportions: babies have big heads and small features */
  const headR = baby ? 30 : child ? 27 : 25;
  const cy    = baby ? 52 : 50;

  /* health drains colour out of the face */
  const health = st.health;
  const pale = health < 45 ? Math.round((45 - health) / 2) : 0;
  const skin = shade(f.skin, pale);

  /* hair: greys then thins with age */
  let hair = f.hair;
  if (a >= 50) hair = '#8f8f93';
  if (a >= 62) hair = '#b9b9be';
  if (elder)   hair = '#d8d8dc';
  const balding = S.gender === 'm' && a >= 48;
  const bald    = S.gender === 'm' && a >= 66 && f.style < 2;

  /* mouth curve follows happiness */
  const h = st.happiness;
  const curve = Math.round(((h - 50) / 50) * 5 * 100) / 100;
  const r2 = n => Math.round(n * 100) / 100;
  const mouth = `M ${50 - 7} ${cy + 13} Q 50 ${r2(cy + 13 + curve)} ${50 + 7} ${cy + 13}`;

  /* eyes narrow when unhappy or very old */
  const eyeR = elder ? 1.7 : h < 30 ? 1.9 : 2.3;
  const ex0 = 0;
  const ex = f.eyeGap;

  /* clothing colour reflects standing */
  const field = S.job ? S.job.field : null;
  const collar = !S.job ? '#3b4a6b'
    : ['corp','tech','politics','public'].includes(field) ? '#24406e'
    : ['medical'].includes(field) ? '#2f7f78'
    : ['trade','service'].includes(field) ? '#7a5327'
    : ['security'].includes(field) ? '#33404f'
    : '#5b3f77';

  const glasses = st.smarts >= 72 && a >= 8;
  const beard   = S.gender === 'm' && a >= 20 && f.style % 2 === 0;
  const wrinkle = a >= 52;
  const looks   = st.looks;

  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" class="av" aria-hidden="true">
  <defs>
    <clipPath id="cl${f.style}"><circle cx="50" cy="${cy}" r="${headR}"/></clipPath>
    <linearGradient id="bg${f.style}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2842"/><stop offset="1" stop-color="#121a2c"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#bg${f.style})"/>

  <!-- shoulders / clothing -->
  <path d="M 16 100 Q 20 ${cy + 30} 50 ${cy + 26} Q 80 ${cy + 30} 84 100 Z" fill="${collar}"/>
  <path d="M 44 ${cy + 26} L 50 ${cy + 36} L 56 ${cy + 26} Z" fill="${shade(collar, 26)}"/>

  <!-- neck -->
  <rect x="44" y="${cy + 16}" width="12" height="12" rx="5" fill="${shade(skin, -18)}"/>

  ${f.ears ? `<ellipse cx="${50 - headR + 2}" cy="${cy + 2}" rx="3.2" ry="4.6" fill="${shade(skin,-12)}"/>
              <ellipse cx="${50 + headR - 2}" cy="${cy + 2}" rx="3.2" ry="4.6" fill="${shade(skin,-12)}"/>` : ''}

  <!-- head -->
  <circle cx="50" cy="${cy}" r="${headR}" fill="${skin}"/>

  <!-- hair -->
  ${bald ? `<path d="M ${50-headR} ${cy-4} Q 50 ${cy-headR-4} ${50+headR} ${cy-4} L ${50+headR} ${cy-9} Q 50 ${cy-headR+4} ${50-headR} ${cy-9} Z" fill="${hair}" opacity=".55"/>`
    : `<g clip-path="url(#cl${f.style})">
        <path d="M ${50-headR-2} ${cy - (balding ? 2 : 6)}
                 Q 50 ${cy - headR - (baby ? 4 : balding ? 8 : 16)} ${50+headR+2} ${cy - (balding ? 2 : 6)}
                 L ${50+headR+2} ${cy-headR-6} L ${50-headR-2} ${cy-headR-6} Z" fill="${hair}"/>
        ${f.style === 1 && !balding ? `<rect x="${50-headR-2}" y="${cy-8}" width="6" height="${headR+10}" fill="${hair}"/>
                                        <rect x="${50+headR-4}" y="${cy-8}" width="6" height="${headR+10}" fill="${hair}"/>` : ''}
        ${f.style === 3 && S.gender === 'f' ? `<ellipse cx="50" cy="${cy-headR+6}" rx="${headR+1}" ry="10" fill="${hair}"/>` : ''}
      </g>`}

  <!-- brows -->
  <rect x="${50-ex-3.5}" y="${cy-8}" width="7" height="1.6" rx="0.8" fill="${shade(hair,-10)}" opacity=".9"/>
  <rect x="${50+ex-3.5}" y="${cy-8}" width="7" height="1.6" rx="0.8" fill="${shade(hair,-10)}" opacity=".9"/>

  <!-- eyes -->
  <circle cx="${50-ex}" cy="${cy-2}" r="${eyeR}" fill="#1a1a22"/>
  <circle cx="${50+ex}" cy="${cy-2}" r="${eyeR}" fill="#1a1a22"/>
  ${eyeR > 2 ? `<circle cx="${50-ex+0.7}" cy="${cy-2.7}" r=".7" fill="#fff" opacity=".85"/>
                <circle cx="${50+ex+0.7}" cy="${cy-2.7}" r=".7" fill="#fff" opacity=".85"/>` : ''}

  ${glasses ? `<g stroke="#c9d3e8" stroke-width="1.1" fill="none" opacity=".85">
      <circle cx="${50-ex}" cy="${cy-2}" r="5"/><circle cx="${50+ex}" cy="${cy-2}" r="5"/>
      <line x1="${50-ex+5}" y1="${cy-2}" x2="${50+ex-5}" y2="${cy-2}"/></g>` : ''}

  <!-- nose -->
  <path d="M 50 ${cy-1} L ${49} ${cy + f.noseLen} L ${51.5} ${cy + f.noseLen}"
        fill="none" stroke="${shade(skin,-28)}" stroke-width="1.1" stroke-linejoin="round"/>

  <!-- mouth -->
  <path d="${mouth}" fill="none" stroke="${shade(skin,-45)}" stroke-width="1.7" stroke-linecap="round"/>

  ${beard ? `<path d="M ${50-11} ${cy+8} Q 50 ${cy+24} ${50+11} ${cy+8} Q 50 ${cy+17} ${50-11} ${cy+8} Z"
              fill="${hair}" opacity=".8"/>` : ''}

  ${f.freckles && a < 40 ? `<g fill="${shade(skin,-30)}" opacity=".55">
      <circle cx="${50-ex-2}" cy="${cy+4}" r=".8"/><circle cx="${50-ex+2}" cy="${cy+6}" r=".7"/>
      <circle cx="${50+ex+1}" cy="${cy+5}" r=".8"/><circle cx="${50+ex-3}" cy="${cy+7}" r=".6"/></g>` : ''}

  ${wrinkle ? `<g stroke="${shade(skin,-32)}" stroke-width=".8" fill="none" opacity=".7">
      <path d="M ${50-ex-6} ${cy-5} q 3 -2 6 0"/><path d="M ${50+ex} ${cy-5} q 3 -2 6 0"/>
      ${old ? `<path d="M ${50-9} ${cy+7} q 2 4 0 7"/><path d="M ${50+9} ${cy+7} q -2 4 0 7"/>` : ''}
      ${elder ? `<path d="M ${50-14} ${cy+2} q 3 3 0 6"/><path d="M ${50+14} ${cy+2} q -3 3 0 6"/>` : ''}
    </g>` : ''}

  ${looks >= 85 && a >= 14 ? `<g opacity=".5"><circle cx="${50-ex-5}" cy="${cy+4}" r="3" fill="#ff8fa3"/>
      <circle cx="${50+ex+5}" cy="${cy+4}" r="3" fill="#ff8fa3"/></g>` : ''}

  ${S.jailLeft > 0 ? `<g opacity=".9"><rect x="0" y="0" width="100" height="100" rx="22" fill="none"/>
      ${[18,34,50,66,82].map(x=>`<rect x="${x}" y="0" width="4" height="100" fill="#0b1020" opacity=".55"/>`).join('')}</g>` : ''}
</svg>`;
}

/* Tiny version for NPC rows. */
function avatarMini(n, size) {
  const fake = { name:n.name, seed:hashCode(n.id), age:n.age, gender:n.gender,
    country:(typeof S!=='undefined'&&S)?S.country:'us',
    stats:{health:n.alive?70:10, happiness:n.r, smarts:40, looks:50}, job:null, jailLeft:0 };
  return avatarSVG(fake, size || 38);
}

</script>

   Every egg found is recorded permanently in META.eggs.                     */

/* tuned so a first life sees roughly one, not three */
const EGG_TIERS = { wink:0.020, rare:0.0040, myth:0.0006 };

const EGGS = [

              desc:'Unlocked by Yination. Rare events find you more often.' },

              desc:'Unlocked by being counted. A hidden starting condition.' }
};

/* Sonder: a complete stranger's life, generated and then gone forever. */
function sonderLife(rnd, pickFn, nameFn, surFn, cityFn, reg) {
  const g = pickFn(['m','f']);
  const name = nameFn(reg, g) + ' ' + surFn(reg);
  const born = 1890 + Math.floor(rnd() * 110);
  const died = born + 18 + Math.floor(rnd() * 72);
  const jobs = ['a bus conductor','a seamstress','a dock worker','a schoolteacher','a clerk',
    'a nurse','a fisherman','a printer','a shopkeeper','a bricklayer','a switchboard operator',
    'a tailor','a baker','a night watchman','a translator'];
  const ends = ['quietly, in a chair by a window','in a hospital corridor at four in the morning',
    'on a road they had driven a thousand times','surrounded by people','with nobody there',
    'a long way from where they started'];
  const things = ['loved one person their whole life','never forgave their brother',
    'grew tomatoes nobody wanted','wrote letters that were never sent',
    'was funny, and nobody remembers the jokes','kept a secret that died with them',
    'was kind for no particular reason'];
  return `${name}. Born ${born}, died ${died}. They were ${pickFn(jobs)}. They ${pickFn(things)}. ` +
         `They died ${pickFn(ends)}. You will never think about them again.`;
}

function cloudPush(quiet){

  fetch((CLOUD.url||'')+'/cloud/'+encodeURIComponent(CLOUD.code),{method:'PUT',
    headers:{'Content-Type':'application/json'},body:JSON.stringify(cloudPayload())})
   .then(r=>{ CLOUD.status=r.ok?'synced '+new Date().toLocaleTimeString():'error'; cloudSaveCfg();
     if(!quiet)popupOK(r.ok?'Uploaded':'Upload failed',r.ok?'Your progress is in the cloud.':'The server rejected it.');
     if(!quiet)renderAll(); })
   .catch(()=>{ CLOUD.status='offline'; cloudSaveCfg(); if(!quiet)popupOK('Offline','Could not reach the sync server.'); });

function cloudPull(){
  if(!requirePlus('cloud sync'))return;

  fetch((CLOUD.url||'')+'/cloud/'+encodeURIComponent(CLOUD.code))
   .then(r=>r.ok?r.json():Promise.reject())
   .then(d=>{ if(!d.slots)throw 0;
     Object.keys(d.slots).forEach(k=>localStorage.setItem(slotKey(k),JSON.stringify(d.slots[k])));

function newGame(opts){
  opts=opts||{};

  const dDef = diffDef(dId);
  const mods = Object.assign({}, dDef.m, (dId==='custom'&&opts.mods)?opts.mods:(dId==='custom'&&typeof CREATE!=='undefined'&&CREATE.mods)?CREATE.mods:{});
  const seed=(Date.now()^ri(0,1e9))>>>0; RNG=mulberry32(seed);
  const g=opts.gender||pick(['m','f']);
  const c=opts.country||pick(DATA.countries).id;
  const reg=(DATA.countries.find(x=>x.id===c)||DATA.countries[0]).reg;
  const tw=DATA.wealthTiers, roll=ri(1,100); let acc=0, tier=tw[2];
  for(const t of tw){ acc+=t.w; if(roll<=acc){tier=t;break;} }
  let givenName=(opts.name&&opts.name.trim())||'';

    // the name was rolled, not typed: it must belong to this country's pool
    const pool=DATA.names[reg];
    const first=givenName.split(' ')[0], last=givenName.split(' ').slice(1).join(' ');
    const ok=(pool.m.includes(first)||pool.f.includes(first))&&pool.l.includes(last);
    if(!ok)givenName='';                       // discard and regenerate below
  }
  const sur=surFor(reg);
  const rollable=DATA.traits.filter(t=>!t.secret);
  const tr=[]; while(tr.length<2){const t=pick(rollable); if(!tr.includes(t.id))tr.push(t.id);}
  /* Each life leans toward some kinds of story and away from others, so two
     lives never draw on the same slice of the content. */
  const THEMES=['i','c','t','y','a','o','s','w','m','r','h','x','f','b'];
  const shuffled=THEMES.slice().sort(()=>R()-0.5);
  const lean=shuffled.slice(0,4), away=shuffled.slice(4,7);
  const sk={}; Object.keys(DATA.skills).forEach(k=>sk[k]=0);
  sk.fitness=ri(0,15); sk.charisma=ri(0,20);
  const hb={}; Object.keys(DATA.habits).forEach(k=>hb[k]=0);
  hb.junkfood=0; hb.sleep=ri(55,80);
  S={
    diff:dId, mods:mods, assisted:false, lpCap:(dId==='custom'?customLP(mods):dDef.lp),
    seed, name:givenName||(nameFor(reg,g)+' '+sur), surname:sur, gender:g,
    country:c, city:cityFor(reg), countriesLived:[c], gen:1,
    age:0, alive:true,
    stats:{health:ri(72,100)+((META.perks&&META.perks.goodstock)?6:0),happiness:ri(70,95),smarts:ri(20,70),looks:ri(15,85),reputation:50,discipline:ri(20,60)},
    skills:sk, habits:hb, traits:tr, birthTier:tier.id,
    money:0, savings:0, debt:0, familyMoney:Math.round(ri(tier.money[0],tier.money[1])*mods.start*((META.perks&&META.perks.bornlucky)?1.6:1)),
    crypto:{units:0,price:100}, property:null, properties:[], vehicles:[], businesses:[], assets:[], business:null,
    items:[], job:null, jobYears:0, careerLvl:null, edu:0, inSchool:false, followers:0, totalWorked:0,
    lean, away, echoes:[], goals:[], perksUsed:[], track:null, home:'parents', food:'basic', subs:{}, cards:[], autopay:null, arrears:0, pets:[], orientation:null, outTo:false, npcs:[], flags:{}, log:[], news:[], seen:{}, cd:{}, moreView:'stats', employer:null, boss:null, school:null, paper:null, slot:(opts.slot||1),
    jailLeft:0, yearsJailed:0, crimesCommitted:0, jobsHeld:0, firedCount:0,
    peakNet:0, peakIncome:0, marriedYears:0, childrenCount:0, donated:0, illness:null,
    banned:[], dependents:0, credsLost:false, actionsLeft:2, actLog:{}, logAll:false, conditions:[], record:[], credit:null, parole:0, perf:60, gpa:50, uniTier:null, disabled:false, loans:[],
    counters:{promotions:0,businesses:0,divorces:0,relapses:0,cryptoProfit:0,debtCleared:0,
              maxDebt:0,heistWins:0,illnessesBeaten:0,gifts:0,partners:0},
    achThisLife:[]
  };
  /* most people are born into a family that already exists */
  { const roll=R();
    const count = roll<0.34?0 : roll<0.70?1 : roll<0.90?2 : 3;
    for(let i=0;i<count;i++){
      const sib=mkNPC('sibling',pick(['m','f']),ri(1,14),reg);
      sib.surname=sur; sib.name=nameFor(reg,sib.gender)+' '+sur;
      sib.r=ri(45,85); S.npcs.push(sib);
    }
  }
  S.npcs.push(mkNPC('mother','f',ri(20,40),reg));
  S.npcs.push(mkNPC('father','m',ri(21,45),reg));
  S.npcs.filter(n=>n.rel==='mother'||n.rel==='father').forEach(n=>{n.r=ri(60,90); n.surname=sur; n.name=nameFor(reg,n.gender)+' '+sur;});
  S.surname=S.name.split(' ').slice(1).join(' ')||sur;
  /* orientation is set at birth and discovered later, as in life */
  { let roll=ri(1,100), acc=0, o=DATA.orientations[0];
    for(const x of DATA.orientations){ const w=x.id==='gay'?(g==='m'?6:0):x.id==='lesbian'?(g==='f'?6:0):x.w;
      acc+=w; if(roll<=acc){o=x;break;} }
    S.orientation=o.id; }
  S.bmonth=ri(1,12); S.bday=ri(1,28);
  if(R()<0.0007){ S.bmonth=2; S.bday=29; }
  if(R()<0.004){ S.bmonth=1; S.bday=1; S.midnightBorn=true; }
  if(tier.id===4&&R()<0.10){
    S.track={id:'royal',rank:0,progress:ri(0,6),heat:0,followers:0,standing:50,commend:0,rating:0,years:0};
    logLine('You were born into the royal house.','good');
  }
  S.school=schoolFor(reg); S.paper=paperFor(reg);
  /* a trait unlocked by an earlier discovery can be born into */
  unlockedTraits().forEach(t=>{ if(R()<0.25&&S.traits.indexOf(t)<0)S.traits.push(t); });
  applyTraitStart();
  logLine(`You were born ${g==='m'?'a boy':'a girl'} in ${S.city}, ${country().name}.`,'good');
  logLine(`Your family is ${tier.name.toLowerCase()}.`);
  { const sibs=S.npcs.filter(n=>n.rel==='sibling');
    if(sibs.length)logLine(`You have ${sibs.length===1?'an older sibling':sibs.length+' older siblings'}: ${sibs.map(n=>n.name.split(' ')[0]).join(', ')}.`); }
  logLine(`Traits: ${tr.map(traitName).join(', ')}.`);
  logLine(`Difficulty: ${dDef.n}${dId==='custom'?'':''} · Legacy Points ×${(dId==='custom'?customLP(mods):dDef.lp).toFixed(2)}`);
  { const pool=GOAL_POOL.slice().sort(()=>R()-0.5);
    S.goals=pool.slice(0,3).map(g=>({id:g.id,done:false})); }
  META.lives++; META.countriesPlayed[S.country]=true; saveMeta(); checkAch(true); save();
  if(S.bmonth===2&&S.bday===29&&!hasEgg('leapday'))setTimeout(()=>findEgg('leapday'),0);
  else if(S.midnightBorn&&!hasEgg('midnight'))setTimeout(()=>findEgg('midnight'),0);
}
function applyTraitStart(){
  const t=S.traits;
  if(t.includes('gifted'))S.stats.smarts=clamp(S.stats.smarts+15);
  if(t.includes('athletic'))S.skills.fitness=clamp(S.skills.fitness+15);
  if(t.includes('charming'))S.skills.charisma=clamp(S.skills.charisma+15);
  if(t.includes('frail'))S.stats.health=clamp(S.stats.health-15);
  if(t.includes('stubborn'))S.stats.discipline=clamp(S.stats.discipline+15);
  if(t.includes('beautiful'))S.stats.looks=clamp(S.stats.looks+25);
  if(t.includes('oldsoul'))S.stats.smarts=clamp(S.stats.smarts+8);
  if(t.includes('loner'))S.stats.discipline=clamp(S.stats.discipline+10);

}

/* ---------------- text tokens & variants ---------------- */
function tok(str){
  if(!str) return '';
  const p=findNPC('mother')||findNPC('father');
  const f=pick(anyOf('friend'))||pick(anyOf('colleague'));
  const ch=pick(anyOf('child'));
  const sib=pick(anyOf('sibling'));
  const pt=partner();
  const col=pick(anyOf('colleague'));
  const any=pick(S.npcs.filter(n=>n.alive));
  const first=n=>n?n.name.split(' ')[0]:null;
  return str
    .replace(/\{npc\}/g,    first(any)||'someone')
    .replace(/\{friend\}/g, first(f)||'a friend')
    .replace(/\{partner\}/g,first(pt)||'your partner')
    .replace(/\{child\}/g,  first(ch)||'your child')
    .replace(/\{parent\}/g, first(p)||'your parent')
    .replace(/\{sibling\}/g,first(sib)||'your sibling')
    .replace(/\{colleague\}/g,first(col)||'a colleague')
    .replace(/\{boss\}/g,   S.boss||'your manager')
    .replace(/\{employer\}/g,S.employer||'your employer')
    .replace(/\{school\}/g, S.school||'school')
    .replace(/\{paper\}/g,  S.paper||('The '+S.city+' Herald'))
    .replace(/\{city\}/g,   S.city)
    .replace(/\{country\}/g,country().name)
    .replace(/\{job\}/g,    S.job?S.job.t:'your job')
    .replace(/\{name\}/g,   S.name.split(' ')[0])
    .replace(/\{age\}/g,    S.age)
    .replace(/\{amt\}/g,    money(ri(20,300)));
}
function variant(x){ return tok(Array.isArray(x)?pick(x):x); }

/* ---------------- effects ---------------- */
let EFF_SCALE=1, EFF_LOG=null, ACT_BLOCKED=false, PREV_YEAR=null, CHOOSER=null, CONFIRM=null;
/* Every pound in or out is recorded so the player can budget. */
function ledger(kind,label,amount){
  if(!S)return;
  S.ledger=S.ledger||{income:[],spend:[]};
  if(!amount)return;
  S.ledger[kind==='earn'?'income':'spend'].push({l:label,a:Math.round(Math.abs(amount))});
}
function ledgerTotal(kind){ return ((S.ledger&&S.ledger[kind])||[]).reduce((n,x)=>n+x.a,0); }
function sc(v){ return (EFF_SCALE===1||v<=0)?v:Math.round(v*EFF_SCALE*10)/10; }
function applyEff(e){
  if(!e) return [];
  const out=[];
  DATA.statKeys.forEach(k=>{ if(e[k]!=null){
    const d=sc(e[k]), before=S.stats[k];
    S.stats[k]=clamp(before+d);
    const real=Math.round((S.stats[k]-before)*10)/10;
    if(real!==0)out.push(`${DATA.statNames[k]} ${real>0?'+':''}${real}`);
    else if(d>0)out.push(`${DATA.statNames[k]} already at maximum`);
  }});
  if(e.money){
    if(e.money<0 && S.age<18){
      /* a child's costs come out of the household, never their own pocket */
      const need=-e.money;
      const fromChild=Math.min(S.money,need);
      S.money-=fromChild;
      S.familyMoney=Math.max(0,S.familyMoney-(need-fromChild));
      out.push(`${money(e.money)} (your family paid)`);
    } else {
      S.money+=e.money; out.push(`${e.money>0?'+':''}${money(e.money)}`);
    }
  }
  if(e.savings){ S.savings+=e.savings; out.push(`Savings +${money(e.savings)}`); }
  if(e.skill) for(const k in e.skill){
    if(S.skills[k]==null)S.skills[k]=0;
    let d=sc(e.skill[k]); if(META.perks&&META.perks.quicklearn&&d>0)d=d*1.25;
    const before=S.skills[k]; S.skills[k]=clamp(before+d);
    const real=Math.round((S.skills[k]-before)*10)/10;
    if(real!==0)out.push(`${DATA.skills[k].name} ${real>0?'+':''}${real}`);
    else if(d>0)out.push(`${DATA.skills[k].name} already at maximum`);
  }
  if(e.habit) for(const k in e.habit){ let d=e.habit[k]; if(d>0)d=sc(d); if(d>0&&S.traits.includes('addictive'))d=Math.round(d*1.5); if(d>0)d=Math.round(d*M('habitGrip')); else d=Math.round(d/M('habitGrip')); S.habits[k]=clamp(S.habits[k]+d); out.push(`${DATA.habits[k].name} ${d>0?'+':''}${d}`); }
  if(e.rel) for(const who in e.rel){
    const d=e.rel[who];
    let t = who==='parents'?S.npcs.filter(n=>(n.rel==='mother'||n.rel==='father')&&n.alive)
      : who==='partner'?S.npcs.filter(n=>(n.rel==='partner'||n.rel==='spouse')&&n.alive)
      : who==='friends'?anyOf('friend')
      : who==='children'?anyOf('child')
      : S.npcs.filter(n=>n.alive);
    t.forEach(n=>n.r=clamp(n.r+d));
    if(t.length) out.push(`${who} ${d>0?'+':''}${d}`);
  }
  if(e.followers){ e.followers=Math.round(sc(e.followers)); S.followers+=e.followers; out.push(`+${e.followers.toLocaleString()} followers`); }
  if(EFF_LOG)out.forEach(x=>EFF_LOG.push(x));
  return out;
}

function ageUp(){
  if(!S||!S.alive) return;
  try{ PREV_YEAR = JSON.stringify(S); }catch(e){ PREV_YEAR = null; }
  S.age++; QUEUE=[];
  S.ledger={income:[],spend:[]};
  S.actionsLeft=actionsPerYear(); S.buysThisYear=0; S.lifestyleThisYear=0; S.jumpGroup=null; S.section=null; S.msection=null; S.person=null; S.listing=null;
  const notes=[];
  if(S.parole>0)S.parole--;
  /* people who depend on you do not do so forever */
  if(S.fostering&&R()<0.22){ S.fostering=false; S.dependents=Math.max(0,S.dependents-1);
    notes.push('Your foster placement has come to an end.'); }
  if(S.dependents>0&&R()<0.14){
    S.dependents--;
    notes.push(pick(['Someone who depended on you no longer does.',
      'The person staying with you has found their own place.',
      'Your caring responsibilities have eased.']));
  }
  S.record.forEach(r=>{ if(!r.spent&&S.age-r.age>=(r.sev===1?6:r.sev===2?12:99))r.spent=true; });
  if(S.jailLeft>0){
    S.jailLeft--; S.yearsJailed++;
    S.stats.happiness=clamp(S.stats.happiness-8); S.stats.health=clamp(S.stats.health-3);
    S.skills.combat=clamp(S.skills.combat+4);
    notes.push(S.jailLeft>0?`You served another year in prison. ${S.jailLeft} remaining.`:'You were released from prison.');
    if(S.jailLeft===0){ S.stats.reputation=clamp(S.stats.reputation-5); S.parole=3;
      notes.push('You are on parole for three years. Any further conviction will be treated harshly.'); }
  }
  push({type:'B',title:`You turned ${S.age}`,text:birthdayText(),sub:stage()});
  notes.push(...tickHabits());
  notes.push(...tickFinance());
  notes.push(...tickConditions());
  notes.push(...tickAging());
  tickNPCs(notes); tickPets(notes); tickTrack(notes); tickSchool(notes); tickNews(notes);
  if(notes.length) push({type:'YEAR',title:`Age ${S.age}`,notes:notes.slice()});
  const n = S.jailLeft>0?0:(R()<0.3?2:1)+(R()<0.15?1:0);
  pickEvents(n).forEach(ev=>push({type:'A',ev,text:variant(ev.x)}));
  deathCheck();
  clampMinorMoney(); settleState();
  eggTick();
  logLine(`— Age ${S.age} —`);
  checkAch(); checkGoals(); drain();
}
function birthdayText(){

function tickHabits(){
  const out=[]; let cost=0;
  for(const k in S.habits){
    const lvl=S.habits[k], h=DATA.habits[k]; if(!h||lvl<=5) continue;
    const sc=lvl/100;
    for(const sk in h.eff) S.stats[sk]=clamp(S.stats[sk]+Math.round(h.eff[sk]*sc*(sk==='health'&&S.traits.includes('frail')?1.4:1)));
    cost+=h.cost*sc*(1+newsMod('prices'))*M('cost');
    if(k==='gym')S.skills.fitness=clamp(S.skills.fitness+Math.round(2*sc));
    if(k==='reading')S.skills.writing=clamp(S.skills.writing+Math.round(1*sc));
    if(k==='gambling'){ const sw=Math.round((R()<0.42?1:-1)*ri(200,4000)*sc); S.money+=sw;
      if(Math.abs(sw)>1500)out.push(sw>0?`You won ${money(sw)} gambling.`:`You lost ${money(-sw)} gambling.`); }
    if(!h.good)S.habits[k]=clamp(lvl-1);
  }
  if(cost>0){
    const named=Object.keys(S.habits).filter(k=>S.habits[k]>5&&DATA.habits[k].cost>0)
      .map(k=>DATA.habits[k].name.toLowerCase());
    const what=named.length?named.join(', '):'day-to-day habits';
    if(S.age<13){
      /* nobody bills a child for the food in their house */
      S.familyMoney=Math.max(0,S.familyMoney-cost);
    } else if(S.age<18){
      const paid=Math.min(S.familyMoney,cost);
      S.familyMoney-=paid;
      const rest=cost-paid;
      if(rest>0){ S.money=Math.max(0,S.money-rest); }
      if(paid>0)out.push(`Your family spent ${money(paid)} on your ${what}.`);
    } else {
      S.money-=cost; ledger('spend','Habits: '+what,cost); out.push(`Your ${what} cost ${money(cost)} this year.`);
    }
  }
  return out;
}
function billsFor(){
  const c=country(), h=HOME(S.home), f=FOODTIER(S.food);
  const people=householdSize(S);
  const items=[];
  if(S.age>=18){
    if(h.cost>0)items.push({l:'Housing \u2014 '+h.n.toLowerCase(),a:Math.round(h.cost*c.col)});
    items.push({l:'Food \u2014 '+f.n.toLowerCase()+(people>1?` (${people} people)`:''),
                a:Math.round(f.cost*c.col*(1+(people-1)*0.6))});
    Object.keys(S.subs).forEach(id=>{
      if(!S.subs[id])return; const sub=SUB(id); if(!sub)return;
      let a=sub.cost;
      if(id==='utilities')a=Math.round(a*(0.6+h.space*0.35));
      items.push({l:sub.n,a:Math.round(a*c.col)});
    });
    (S.cards||[]).forEach(cd=>{ const def=CARD(cd.id);
      if(def&&def.fee)items.push({l:def.n+' fee',a:def.fee}); });
  }
  return items;
}
function tickProperty(out){

    pr.cond=clamp((pr.cond==null?70:pr.cond)-(hasItem('maint')?1.5:4.5));

    S.money-=maint; ledger('spend',def.n+' upkeep',maint);

    }

function tickBusinesses(out){

function tickBills(out){
  if(S.age<18)return;
  /* last year's bills, if you never paid them, do not simply disappear */
  if(S.billsDue>0){
    S.arrears+=S.billsDue;
    S.credit=Math.max(300,(S.credit==null?600:S.credit)-30);
    out.push(`You never paid last year\u2019s ${money(S.billsDue)} of bills. It is now arrears.`);
    S.billsDue=0; S.billItems=[];
  }
  const items=billsFor();
  const total=items.reduce((n,x)=>n+x.a,0);
  if(total<=0)return;
  S.billsDue=total; S.billItems=items;
  if(autopayOn()){
    payBills(out,true);
  } else {
    out.push(`Bills of ${money(total)} are due. Pay them from the Money tab.`);
  }
}
function payBills(out,auto){
  const total=S.billsDue||0;
  if(total<=0)return false;
  const use=Math.min(S.money,total);
  S.money-=use;
  const short=total-use;
  (S.billItems||[]).forEach(x=>ledger('spend',x.l,x.a));
  if(short>0){
    const onCard=chargeToCard(short);
    if(onCard<short){
      S.arrears+=(short-onCard);
      S.credit=Math.max(300,(S.credit==null?600:S.credit)-40);
      if(out)out.push(`You could not cover ${money(short-onCard)} of your bills. It has gone into arrears.`);
    } else if(out)out.push(`Bills of ${money(total)} paid, ${money(onCard)} of it on credit.`);
  } else if(out)out.push(`${auto?'Bills paid automatically':'Bills paid'}: ${money(total)}.`);
  S.billsDue=0; S.billItems=[];
  return true;
}
/* arrears bite: eviction, downgrades, credit damage */
function tickArrears(out){
  if(S.arrears<=0)return;

  S.stats.happiness=clamp(S.stats.happiness-4);

    const idx=HOUSING.findIndex(h=>h.id===S.home);

    out.push(`You were evicted. You are now in ${HOME(S.home).n.toLowerCase()}.`);
    logLine('You were evicted.','bad');
  }
}
function chargeToCard(amount){
  let left=amount, used=0;
  (S.cards||[]).forEach(cd=>{
    if(left<=0)return; const def=CARD(cd.id); if(!def)return;
    const room=Math.max(0,def.limit-cd.bal);
    const take=Math.min(room,left);
    cd.bal+=take; left-=take; used+=take;
  });
  return used;
}
function tickCards(out){
  (S.cards||[]).forEach(cd=>{
    const def=CARD(cd.id); if(!def||cd.bal<=0)return;
    const interest=Math.round(cd.bal*def.apr);
    cd.bal+=interest;
    const min=Math.round(cd.bal*0.05)+25;
    if(autopayOn()&&S.money>=min){ S.money-=min; cd.bal-=min; ledger('spend',def.n+' payment',min);
      S.credit=Math.min(850,(S.credit==null?600:S.credit)+4); }
    else if(S.money<min){ S.credit=Math.max(300,(S.credit==null?600:S.credit)-35);
      out.push(`You missed the minimum payment on your ${def.n.toLowerCase()}.`); }
    if(cd.bal>def.limit*0.95)out.push(`Your ${def.n.toLowerCase()} is at its limit.`);
    if(def.perk&&def.id==='black')S.stats.reputation=clamp(S.stats.reputation+6);
  });
}

}
function tickConditions(){
  const out=[];
  /* new diagnoses */
  CONDITIONS.forEach(c=>{
    if(S.conditions.some(x=>x.id===c.id))return;
    let p=conditionRisk(S,c)*M('decay');
    if(hasItem('screening'))p*=0.85;
    if(hasEcho('scarred'))p*=1.35;
    if(hasEcho('steadied'))p*=0.8;
    if(R()<p){
      addCondition(c.id,c.sev);
      S.stats.health=clamp(S.stats.health-c.sev*5);
      out.push(`You were diagnosed with ${c.n.toLowerCase()}.`);
      logLine(`Diagnosed with ${c.n}.`,'bad');
      if(hasItem('screening'))out.push('Your annual screening caught it early.');
    }
  });
  /* progression, and what they cost you */
  S.conditions.forEach(k=>{
    const c=COND(k.id); if(!c)return;
    const scale=k.treated?0.35:1;
    for(const st in c.yr){ const amt=c.yr[st]*scale*M('decay')*(st==='health'?0.7:1);
      S.stats[st]=clamp(S.stats[st]+amt); }
    if(k.age!==S.age&&!k.treated&&R()<c.prog*M('decay')&&k.sev<3){
      k.sev++; out.push(`Your ${c.n.toLowerCase()} has worsened.`);
    }
    if(k.treated&&R()<0.25)k.treated=false;          // needs ongoing management
    if(!c.chronic&&k.treated&&R()<c.cure){
      S.conditions=S.conditions.filter(x=>x!==k);
      S.counters.illnessesBeaten++;
      out.push(`You have recovered from ${c.n.toLowerCase()}.`);
      logLine(`Recovered from ${c.n}.`,'good');
    }
  });
  /* disability from severe untreated illness */
  const severe=S.conditions.filter(k=>k.sev>=3&&!k.treated&&(S.age-k.age)>=3).length;
  if(severe>=1&&!S.disabled&&R()<0.06){
    S.disabled=true; S.disabledAt=S.age; out.push('You are now registered as disabled.');
    logLine('You became disabled.','bad');
  }
  return out;
}
/* The only way a condition should ever be added. Worsens an existing one
   rather than creating a duplicate. */
function addCondition(id,sev){
  const c=COND(id); if(!c)return null;
  const have=S.conditions.find(k=>k.id===id);
  if(have){ have.sev=Math.min(3,have.sev+1); have.treated=false; return have; }
  const k={id:id,age:S.age,sev:sev||c.sev,treated:false};
  S.conditions.push(k); return k;
}
function workPenalty(){
  let w=0; S.conditions.forEach(k=>{const c=COND(k.id); if(c)w+=c.work*(k.treated?0.4:1)*(k.sev/c.sev);});
  if(S.disabled)w+=0.2;
  return Math.min(0.9,w);
}
/* What your standard of living does to you in a year, on its own. */
function livingEffect(){
  const h=HOME(S.home), f=FOODTIER(S.food);
  const crowd=Math.max(0,householdSize(S)-h.space);
  return {
    happy: h.happy*0.35 + f.happy*0.4 - crowd*2,
    health: h.health*0.3 + f.health*0.4 - crowd*0.5,
    rep: h.rep*0.15
  };
}
function tickAging(){
  const out=[], a=S.age;
  let d=0;
  if(a>30)d+=0.35; if(a>50)d+=1.0; if(a>65)d+=1.9; if(a>80)d+=3.0;
  d*=(1-S.skills.fitness/300);
  if(S.traits.includes('frail'))d*=1.4;
  if(S.traits.includes('athletic'))d*=0.85;
  if(S.traits.includes('oldsoul'))d*=0.85;
  if(META.perks&&META.perks.goodstock)d*=0.9;
  let cd=0; S.conditions.forEach(k=>{ const c=COND(k.id);
    cd += k.sev*(c&&c.fatal?0.30:0.16)*(k.treated?0.4:1); });
  d += Math.min(2.4, cd);        // several illnesses compound, but not without limit
  d*=(1-(country().life||0)/220); d*=M('decay');
  S.stats.health=clamp(S.stats.health-d);
  let hd=S.traits.includes('anxious')?-2:-1;
  if(S.stats.happiness<25)hd+=2;      // people adapt; misery is not a one-way ratchet
  if(S.stats.happiness<12)hd+=2;
  if(S.stats.health<35)hd-=3;
  if(S.debt>20000)hd-=2;
  if(partner())hd+=2;
  if(anyOf('friend').length)hd+=1;
  if(!S.job&&a>=22&&a<65)hd-=3;
  if(hd<0)hd*=M('decay');
  S.stats.happiness=clamp(S.stats.happiness+hd);
  if(a>28)S.stats.looks=clamp(S.stats.looks-(a>55?1.4:0.7)*M('decay')*(S.traits.includes('beautiful')?0.75:1));
  if(S.inSchool){
    S.stats.smarts=clamp(S.stats.smarts+(S.traits.includes('gifted')?3:2));
    const dg=Math.round((S.stats.smarts-50)/10)+Math.round(S.stats.discipline/25)
      -(S.habits.doomscroll>45?3:0)-(S.stats.happiness<30?3:0)+ri(-3,3);
    S.gpa=clamp((S.gpa==null?50:S.gpa)+dg);
  }
  if(S.habits.sleep<25){ S.stats.health=clamp(S.stats.health-1); S.stats.smarts=clamp(S.stats.smarts-1); }
  if(S.stats.health<25)out.push('Your health is failing.');
  if(partner()&&partner().rel==='spouse')S.marriedYears++;
  if(a>=14&&R()<0.006*country().crime*(S.stats.reputation<35?1.6:1)){
    const loss=Math.min(S.money,ri(50,2500));
    S.money-=loss; S.stats.health=clamp(S.stats.health-ri(2,10)); S.stats.happiness=clamp(S.stats.happiness-8);
    out.push(`You were mugged in ${S.city}. You lost ${money(loss)}.`);
  }
  return out;
}
/* Every person around you is living their own life in parallel, and you hear about it. */
function npcLife(n,notes){
  if(!n.own)n.own={edu:0,job:null,partner:null,kids:0,city:null,arc:'steady'};
  const o=n.own, a=n.age, arc=o.arc;
  const tell=t=>{ if(n.r>25||R()<0.4)notes.push(t); };
  if(a===18&&!o.edu){
    if(arc==='rising'||R()<0.35){ o.edu=3; tell(`${n.name} started university.`); }
    else { o.edu=1; tell(`${n.name} left school and started looking for work.`); }
  }
  if(a===22&&o.edu===3){ tell(`${n.name} graduated.`); }
  if(!o.job&&a>=(o.edu>=3?22:17)&&R()<0.5){
    const tier = arc==='rising'?4 : arc==='struggling'?0 : arc==='troubled'?0 : 2;
    const pool=DATA.jobs.filter(j=>jobLvl(j)<=tier&&j.edu<=o.edu);
    if(pool.length){ o.job=pick(pool).t; tell(`${n.name} started work as a ${o.job.toLowerCase()}.`); }
  }
  if(o.job&&a>28&&arc==='rising'&&R()<0.10){
    const pool=DATA.jobs.filter(j=>jobLvl(j)>=3);
    if(pool.length){ o.job=pick(pool).t; tell(`${n.name} was promoted to ${o.job.toLowerCase()}.`); }
  }
  if(o.job&&arc==='struggling'&&R()<0.07){ tell(`${n.name} lost their job.`); o.job=null; }
  if(!o.partner&&a>=20&&a<55&&R()<0.07){
    o.partner=nameFor(country().reg,pick(['m','f'])).split(' ')[0];
    tell(`${n.name} is seeing someone called ${o.partner}.`);
  }
  if(o.partner&&a>=23&&!o.married&&R()<0.10){ o.married=true; tell(`${n.name} married ${o.partner}.`); }
  if(o.married&&o.kids<3&&a<48&&R()<0.10){ o.kids++; tell(`${n.name} had a baby.`); }
  if(o.married&&R()<0.02){ o.married=false; tell(`${n.name} and ${o.partner} separated.`); o.partner=null; }
  if(a>25&&a<60&&R()<0.025){
    const c=pick(DATA.countries.filter(x=>x.id!==S.country));
    o.city=c.name; tell(`${n.name} moved to ${c.name}.`); n.r=clamp(n.r-8);
  }
  if(arc==='troubled'&&a>16&&R()<0.05){ tell(`${n.name} was arrested.`); n.r=clamp(n.r-4); }
  if(arc==='rising'&&a>30&&R()<0.03){ tell(`${n.name} has done very well for themselves.`); }
  if(a>45&&R()<0.03){ tell(`${n.name} has not been well lately.`); }
  if(a>=60&&a<70&&!o.retired&&R()<0.2){ o.retired=true; tell(`${n.name} retired.`); }
}

function deathCheck(){
  let p=0; const a=S.age,h=S.stats.health;
  if(h<=0)p=1;
  else if(a<16){ p=h<25?0.02:0.0009; if(S.illness)p+=0.01; }
  else{
    p=Math.max(0,(a-42)/100*0.045)+(a>70?(a-70)*0.014:0)+(a>88?(a-88)*0.055:0);
    p+=Math.max(0,(65-h))/100*0.06;
    S.conditions.forEach(k=>{
      const c=COND(k.id); if(!c)return;
      const base = c.fatal ? (k.sev>=3?0.016:k.sev===2?0.006:0.002)
                           : (k.sev>=3?0.004:0.0008);      // depression does not usually kill you
      p += base * (k.treated?0.35:1);
    });
    if(h<20)p+=0.14;
    p*=(1-(country().life||0)/160);
  }
  p*=M('death');
  if(R()<p){ die(deathCause()); return true; }
  return false;
}
function deathCause(){
  const lethal=S.conditions.filter(k=>{const c=COND(k.id);return c&&c.fatal;})
                           .sort((a,b)=>b.sev-a.sev)[0];
  if(lethal&&(lethal.sev>=3||R()<0.55))return 'complications from '+COND(lethal.id).n.toLowerCase();
  const severe=S.conditions.filter(k=>k.sev>=3).sort((a,b)=>b.sev-a.sev)[0];
  if(severe&&R()<0.3)return 'complications from '+COND(severe.id).n.toLowerCase();
  if(S.stats.health<=0)return 'total physical collapse';
  if(S.age>85)return 'old age';
  
  return pick(['heart failure','a sudden illness','an accident','natural causes','a stroke']);
}

/* ---------------- events ---------------- */
function reqOk(ev){
  if(ev.once&&S.seen[ev.id])return false;
  if(S.age<ev.min||S.age>ev.max)return false;
  const last=S.cd[ev.id];
  if(last!=null && S.age-last < (ev.cd||20)) return false;
  const q=ev.req||{};
  if(q.flags&&!q.flags.every(f=>S.flags[f]))return false;
  if(q.noflags&&q.noflags.some(f=>S.flags[f]))return false;
  if(q.job&&!S.job)return false;
  if(q.nojob&&S.job)return false;
  if(q.partner&&!partner())return false;
  if(q.nopartner&&partner())return false;
  if(q.child&&!anyOf('child').length)return false;
  if(q.nochild&&S.npcs.some(n=>n.rel==='child'))return false;
  if(q.sibling&&!anyOf('sibling').length)return false;
  if(q.maxSiblings!=null&&anyOf('sibling').length>q.maxSiblings)return false;
  if(q.teacher&&!anyOf('teacher').length)return false;
  if(q.condition&&!S.conditions.length)return false;
  if(q.record&&!S.record.length)return false;
  if(q.parole&&!(S.parole>0))return false;
  if(q.followers&&S.followers<q.followers)return false;
  if(q.artskill&&(S.skills.art||0)<q.artskill)return false;
  if(q.sibling&&!anyOf('sibling').length)return false;
  if(q.maxSiblings!=null&&anyOf('sibling').length>q.maxSiblings)return false;
  if(q.friend&&!anyOf('friend').length&&!anyOf('colleague').length)return false;
  if(q.property&&!(S.properties||[]).length)return false;
  if(q.noproperty&&(S.properties||[]).length)return false;
  if(q.item&&!hasItem(q.item))return false;
  if(q.poor&&S.birthTier>1)return false;
  if(q.smart&&S.stats.smarts<q.smart)return false;
  if(q.rep&&S.stats.reputation<q.rep)return false;
  if(q.parentAlive&&!S.npcs.some(n=>(n.rel==='mother'||n.rel==='father')&&n.alive))return false;
  if(q.parentDead&&!S.npcs.some(n=>(n.rel==='mother'||n.rel==='father')&&!n.alive))return false;
  if(q.anyBadHabit&&!Object.keys(DATA.habits).some(k=>!DATA.habits[k].good&&S.habits[k]>=q.anyBadHabit))return false;
  if(q.habit)for(const k in q.habit){ if(S.habits[k]<q.habit[k])return false; }
  return true;
}
function evWeight(e){
  const theme=e.id.split('_')[0];
  let w=e.w*(S.seen[e.id]?0.25:1);
  if(S.lean&&S.lean.indexOf(theme)>=0)w*=2.1;
  if(S.away&&S.away.indexOf(theme)>=0)w*=0.35;
  return w;
}
function pickEvents(n){
  const pool=EVENTS.filter(reqOk), out=[];
  for(let i=0;i<n&&pool.length;i++){
    const tot=pool.reduce((s,e)=>s+evWeight(e),0);
    let r=R()*tot, ch=pool[0];
    for(const e of pool){ r-=evWeight(e); if(r<=0){ch=e;break;} }
    out.push(ch); pool.splice(pool.indexOf(ch),1);
  }
  return out;
}
