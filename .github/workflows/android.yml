name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test and build the web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Rebuild the inlined bundle
        run: python3 pwa/build.py
      - name: Fail the build on any failing test
        run: node pwa/tests/suite.js
      - name: Hunt for impossible game states
        run: node research/audit.js
      - uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: |
            pwa/index.html
            Bequest.html

  apk:
    name: Assemble debug APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'          # AGP 8 requires JDK 17, not 11
      # The ubuntu runner already ships the Android SDK. The setup-android
      # action tries to install the long-obsolete 'tools' package and fails,
      # so we use the preinstalled SDK and just accept the licences.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Rebuild the inlined bundle
        run: python3 pwa/build.py

      - name: Install Capacitor
        run: npm install

      - name: Create the Android project
        run: npx cap add android || npx cap sync android

      - name: Target Android 8.0 and up
        run: |
          # adaptive icons and modern notifications need API 26
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 26/' android/variables.gradle || true
          grep -n "minSdkVersion" android/variables.gradle || true

      - name: Generate launcher icons and splash from resources/
        run: npm run icons || echo "asset generation skipped"

      - name: Stamp a version that always installs over the last build
        run: |
          # versionCode must increase for Android to accept the upgrade
          CODE=$(( 1000 + GITHUB_RUN_NUMBER ))
          NAME="1.0.$GITHUB_RUN_NUMBER"
          echo "versionCode=$CODE versionName=$NAME"
          sed -i "s/versionCode [0-9]*/versionCode $CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$NAME\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Sign with a stable key so builds replace each other
        run: |
          # Android refuses to upgrade an app signed by a different key.
          # We use the permanent committed debug keystore from resources/.
          mkdir -p ~/.android android/app
          if [ -n "${{ secrets.DEBUG_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 -d > resources/bequest-debug.keystore
          fi
          cp resources/bequest-debug.keystore ~/.android/debug.keystore
          cp resources/bequest-debug.keystore android/app/debug.keystore
          echo "Installed permanent debug keystore in ~/.android/debug.keystore and android/app/debug.keystore"
          keytool -list -v -keystore android/app/debug.keystore -storepass android | grep -E "Owner|SHA256"

          # Explicitly configure signingConfigs in android/app/build.gradle so Gradle is forced to use the permanent keystore
          node -e '
            const fs = require("fs");
            const bgPath = "android/app/build.gradle";
            let bg = fs.readFileSync(bgPath, "utf8");
            const signingBlock = `
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }
`;
            if (!bg.includes("signingConfigs {")) {
              bg = bg.replace(/buildTypes\s*\{/, signingBlock + "\n    buildTypes {");
              bg = bg.replace(/buildTypes\s*\{\s*release/, "buildTypes {\n        debug {\n            signingConfig signingConfigs.debug\n        }\n        release");
              fs.writeFileSync(bgPath, bg);
              console.log("Configured signingConfigs.debug in " + bgPath);
            }
          '
          grep -C 4 "signingConfigs" android/app/build.gradle

      - name: Sync web assets into Android
        run: npx cap sync android

      - name: Assemble debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Verify APK signature fingerprint matches permanent keystore
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "Error: No APK found to verify"
            exit 1
          fi
          echo "Checking APK: $APK"
          CERT_OUT=$(keytool -printcert -jarfile "$APK" 2>&1 || true)
          echo "$CERT_OUT"
          if ! echo "$CERT_OUT" | grep -q "54:51:2D:22:56:78:F0:76:D0:61:3E:AD:2C:07:86:08:A0:4A:D6:B3:46:88:E6:18:40:EF:77:D7:22:00:59:A5"; then
            echo "ERROR: APK is NOT signed with the permanent debug keystore!"
            exit 1
          fi
          echo "SUCCESS: Verified APK is signed with permanent debug keystore (54:51:2D:22...)"

      - uses: actions/upload-artifact@v4
        with:
          name: bequest-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
